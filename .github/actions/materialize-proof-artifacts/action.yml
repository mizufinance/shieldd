name: Materialize proof artifacts
description: Restore and verify the current external POC proof bundle.

inputs:
  github-token:
    description: Token used to download the rolling release asset on a cache miss.
    required: true

runs:
  using: composite
  steps:
    - name: Restore proof bundle cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          tools/gnark/artifacts/*/*.sr1cs
          tools/gnark/artifacts/*/proving_key.bin
        key: proof-artifacts-v1-${{ hashFiles('tools/gnark/artifacts/current-bundle.json', 'tools/gnark/artifacts/*/circuit_metadata.json') }}
    - name: Download and validate proof bundle
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: python3 "$GITHUB_ACTION_PATH/../../../scripts/proof_artifacts.py" materialize
