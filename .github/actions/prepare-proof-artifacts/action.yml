name: Prepare proof artifacts
description: Fetch one constraint bundle and publish its exact cache entry.

inputs:
  bundle:
    description: One of constraints or full.
    required: false
    default: full
  enable-cross-os-archive:
    description: Allow the cache to be restored by a different runner OS.
    required: false
    default: "false"
  repository-path:
    description: Checkout path relative to the GitHub workspace.
    required: false
    default: .

outputs:
  key:
    description: Exact immutable cache key for the selected constraints.
    value: proof-constraints-lfs-v3-${{ steps.selected.outputs.identity }}
  cache-hit:
    description: Whether the selected constraint bundle was already cached.
    value: ${{ steps.restore.outputs.cache-hit }}
  bytes:
    description: Total committed byte size of the selected bundle.
    value: ${{ steps.selected.outputs.bytes }}
  objects:
    description: Number of committed objects in the selected bundle.
    value: ${{ steps.selected.outputs.objects }}

runs:
  using: composite
  steps:
    - name: Resolve committed artifact identity
      id: selected
      shell: bash
      env:
        BUNDLE: ${{ inputs.bundle }}
      run: >-
        python3 "$GITHUB_ACTION_PATH/../../../scripts/proof_artifacts.py"
        cache-info --bundle "$BUNDLE" --github-output "$GITHUB_OUTPUT"

    - name: Restore exact constraint cache
      id: restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ inputs.repository-path }}/tools/gnark/artifacts/*/*.sr1cs
        key: proof-constraints-lfs-v3-${{ steps.selected.outputs.identity }}
        enableCrossOsArchive: ${{ inputs.enable-cross-os-archive }}

    - name: Materialize and validate selected proof artifacts
      shell: bash
      env:
        BUNDLE: ${{ inputs.bundle }}
      run: >-
        python3 "$GITHUB_ACTION_PATH/../../../scripts/proof_artifacts.py"
        materialize --bundle "$BUNDLE"

    - name: Save exact constraint cache
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ inputs.repository-path }}/tools/gnark/artifacts/*/*.sr1cs
        key: proof-constraints-lfs-v3-${{ steps.selected.outputs.identity }}
        enableCrossOsArchive: ${{ inputs.enable-cross-os-archive }}

    - name: Report artifact preparation
      shell: bash
      env:
        BUNDLE: ${{ inputs.bundle }}
        BYTES: ${{ steps.selected.outputs.bytes }}
        OBJECTS: ${{ steps.selected.outputs.objects }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
      run: |
        {
          echo "### Proof artifact preparation"
          echo
          echo "- Bundle: \`$BUNDLE\`"
          echo "- Objects: $OBJECTS"
          echo "- Committed bytes: $BYTES"
          echo "- Exact constraint-cache hit: ${CACHE_HIT:-false}"
        } >> "$GITHUB_STEP_SUMMARY"
