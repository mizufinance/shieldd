name: Restore proof artifacts
description: Restore and validate an exact constraint cache without Git LFS network access.

inputs:
  bundle:
    description: One of constraints or full.
    required: false
    default: full
  enable-cross-os-archive:
    description: Allow the cache to be restored from a different runner OS.
    required: false
    default: "false"
  repository-path:
    description: Checkout path relative to the GitHub workspace.
    required: false
    default: .

outputs:
  key:
    description: Exact immutable cache key for the selected constraints.
    value: proof-constraints-lfs-v3-${{ steps.selected.outputs.identity }}
  bytes:
    description: Total committed byte size of the selected bundle.
    value: ${{ steps.selected.outputs.bytes }}
  objects:
    description: Number of committed objects in the selected bundle.
    value: ${{ steps.selected.outputs.objects }}

runs:
  using: composite
  steps:
    - name: Resolve committed artifact identity
      id: selected
      shell: bash
      env:
        BUNDLE: ${{ inputs.bundle }}
      run: >-
        python3 "$GITHUB_ACTION_PATH/../../../scripts/proof_artifacts.py"
        cache-info --bundle "$BUNDLE" --github-output "$GITHUB_OUTPUT"

    - name: Restore exact constraint cache
      id: restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ inputs.repository-path }}/tools/gnark/artifacts/*/*.sr1cs
        key: proof-constraints-lfs-v3-${{ steps.selected.outputs.identity }}
        enableCrossOsArchive: ${{ inputs.enable-cross-os-archive }}

    - name: Require an exact prepared cache entry
      shell: bash
      env:
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
      run: |
        if [[ "$CACHE_HIT" != "true" ]]; then
          echo "exact constraint cache is missing; the workflow preparer must publish it first" >&2
          exit 1
        fi

    - name: Validate restored proof artifacts
      shell: bash
      env:
        BUNDLE: ${{ inputs.bundle }}
      run: >-
        python3 "$GITHUB_ACTION_PATH/../../../scripts/proof_artifacts.py"
        restore --bundle "$BUNDLE"
