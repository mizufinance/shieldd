name: rust
on:
  pull_request:
    # Don't run Rust tests if only docs changed.
    paths-ignore:
      - 'docs/**'
  merge_group:
    types: [checks_requested]
  # Also support ad-hoc calls for workflow.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enforce narrow LFS and proof scheduling policy
        run: python3 scripts/check_lfs_policy.py

      - uses: ./.github/actions/materialize-proof-artifacts

      - uses: ./.github/actions/setup-nix-rust

      # The `rust-toolchain.toml` file dictates which version of rust to setup.
      - name: check rust version
        run: nix develop --command rustc --version

      # Run `cargo check`, with a custom target dir for caching.
      - name: run cargo check
        run: >-
          nix develop --command python3 scripts/ci/run_with_annotation.py
          --title "Rust cargo check"
          -- just ci-check

      # If a dependency was modified, Cargo.lock may flap if not committed.
      - name: Check for diffs
        shell: bash
        run: |
          s="$(git status --porcelain)"
          if [[ -n "$s" ]]; then
              echo "ERROR: found modified files that should be committed:"
              echo "$s"
              git diff | head -n 128
              exit 1
          else
              echo "OK: no uncommitted changes detected"
          fi

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  # As of 2025Q1, the "features" job is the slowest in the CI suite.
  # Consider moving to a scheduled job on main, rather than running on PRs.
  features:
    runs-on: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 45 || 90 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/materialize-proof-artifacts

      - uses: ./.github/actions/setup-nix-rust
        with:
          free-disk: "true"

      # Build each crate separately, to validate that the feature-gating is working.
      # This is a lighter-weight version of `cargo check-all-features --workspace --release`.
      - name: check crate features
        run: >-
          nix develop --command python3 scripts/ci/run_with_annotation.py
          --title "Rust crate feature checks"
          -- ./deployments/scripts/check-crate-feature-sets

      - name: check wasm compatibility
        run: >-
          nix develop --command python3 scripts/ci/run_with_annotation.py
          --title "Rust wasm compatibility"
          -- ./deployments/scripts/check-wasm-compat.sh

  test:
    runs-on: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 45 || 90 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/materialize-proof-artifacts

      - uses: ./.github/actions/setup-nix-rust
        with:
          free-disk: "true"

      - name: Run tests with nextest
        run: >-
          nix develop --command python3 scripts/ci/run_with_annotation.py
          --title "Rust nextest"
          -- just ci-test
        env:
          CARGO_TERM_COLOR: always

  go-gnark:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: tools/gnark/go.mod
          cache-dependency-path: tools/gnark/go.sum

      - name: Check Go formatting
        working-directory: tools/gnark
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if test -n "$files"; then
            echo "unformatted Go files:"
            printf "%s\n" "$files"
            exit 1
          fi

      - name: Build gnark Go module
        working-directory: tools/gnark
        run: go build ./...

      - name: Test gnark Go module
        working-directory: tools/gnark
        run: go test ./...

      - name: Vet gnark Go module
        working-directory: tools/gnark
        run: go vet ./...

  gnark-rust:
    # Proofs and their evidence are produced locally and committed. The slow
    # end-to-end replay runs manually, not on PRs or the merge queue.
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-nix-rust
        with:
          free-disk: "true"

      - uses: ./.github/actions/materialize-proof-artifacts

      - name: Run gnark-backed Rust proof tests
        run: nix develop --command just ci-gnark-proof-tests
      - name: Execute exact FV specification evidence
        # The evidence inventory eventually lists the shieldd debug test binary.
        # jemalloc's configure probes use -Werror, while Nix's fortify headers
        # reject the dev profile's default -O0 C flags.
        env:
          CFLAGS: -O1
        run: nix develop --command bash scripts/check-fv-specification-evidence.sh

  summary:
    needs: [lint, deny, features, test, go-gnark, gnark-rust]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check Rust workflow result
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          DENY_RESULT: ${{ needs.deny.result }}
          FEATURES_RESULT: ${{ needs.features.result }}
          TEST_RESULT: ${{ needs.test.result }}
          GO_GNARK_RESULT: ${{ needs['go-gnark'].result }}
          GNARK_RUST_RESULT: ${{ needs['gnark-rust'].result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          failed=0
          for job in \
            "lint:$LINT_RESULT" \
            "deny:$DENY_RESULT" \
            "features:$FEATURES_RESULT" \
            "test:$TEST_RESULT" \
            "go-gnark:$GO_GNARK_RESULT"
          do
            name="${job%%:*}"
            result="${job#*:}"
            if [ "$result" != "success" ]; then
              echo "$name did not pass: $result"
              failed=1
            else
              echo "$name passed"
            fi
          done

          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "merge_group" ]]; then
            if [[ "$GNARK_RUST_RESULT" != "skipped" ]]; then
              echo "gnark-rust should be skipped on $EVENT_NAME: $GNARK_RUST_RESULT"
              failed=1
            else
              echo "gnark-rust deferred to a manual run"
            fi
          elif [[ "$GNARK_RUST_RESULT" != "success" ]]; then
            echo "gnark-rust did not pass: $GNARK_RUST_RESULT"
            failed=1
          else
            echo "gnark-rust passed"
          fi

          exit "$failed"
