name: rust
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  merge_group:
    types: [checks_requested]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Rust checks
    runs-on: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 150 || 180 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Enforce narrow LFS and proof scheduling policy
        run: python3 scripts/check_lfs_policy.py

      - uses: ./.github/actions/setup-nix-rust
        with:
          free-disk: "true"

      - name: Check Rust version
        run: nix develop --command rustc --version

      - name: Run cargo check
        run: >-
          nix develop --command python3 scripts/ci/run_with_annotation.py
          --title "Rust cargo check"
          -- just ci-check

      - name: Check for diffs
        shell: bash
        run: |
          s="$(git status --porcelain)"
          if [[ -n "$s" ]]; then
            echo "ERROR: found modified files that should be committed:"
            echo "$s"
            git diff | head -n 128
            exit 1
          fi
          echo "OK: no uncommitted changes detected"

      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

      - name: Check crate features
        run: >-
          nix develop --command python3 scripts/ci/run_with_annotation.py
          --title "Rust crate feature checks"
          -- ./deployments/scripts/check-crate-feature-sets

      - name: Check wasm compatibility
        run: >-
          nix develop --command python3 scripts/ci/run_with_annotation.py
          --title "Rust wasm compatibility"
          -- ./deployments/scripts/check-wasm-compat.sh

  tests:
    name: Rust and gnark tests
    runs-on: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 150 || 300 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-nix-rust
        with:
          free-disk: "true"

      - name: Run tests with nextest
        run: >-
          nix develop --command python3 scripts/ci/run_with_annotation.py
          --title "Rust nextest"
          -- just ci-test
        env:
          CARGO_TERM_COLOR: always

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: tools/gnark/go.mod
          cache-dependency-path: tools/gnark/go.sum

      - name: Check Go formatting
        working-directory: tools/gnark
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if test -n "$files"; then
            echo "unformatted Go files:"
            printf "%s\n" "$files"
            exit 1
          fi

      - name: Build gnark Go module
        working-directory: tools/gnark
        run: go build ./...

      - name: Test gnark Go module
        working-directory: tools/gnark
        run: go test ./...

      - name: Vet gnark Go module
        working-directory: tools/gnark
        run: go vet ./...

      - name: Prepare full proof artifacts for manual replay
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: ./.github/actions/prepare-proof-artifacts
        with:
          bundle: full

      - name: Run gnark-backed Rust proof tests
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: nix develop --command just ci-gnark-proof-tests

      - name: Execute exact FV specification evidence
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        env:
          CFLAGS: -O1
        run: nix develop --command bash scripts/check-fv-specification-evidence.sh

  summary:
    needs: [checks, tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check Rust workflow result
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          set -euo pipefail
          failed=0
          for job in \
            "checks:$CHECKS_RESULT" \
            "tests:$TESTS_RESULT"
          do
            name="${job%%:*}"
            result="${job#*:}"
            if [[ "$result" != "success" ]]; then
              echo "$name did not pass: $result"
              failed=1
            else
              echo "$name passed"
            fi
          done
          exit "$failed"
