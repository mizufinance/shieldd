name: formal

# One category, many lanes — the shape orbis-integration already uses.
#
# snarkpack-formal and soundness-formal were separate workflows, so each paid
# its own applicability + summary tax and duplicated the classifier boilerplate.
# They verify the same tree on the same events, so they are one gate with two
# families of lanes: `snarkpack: *` and `soundness: *`.
#
# The scheduled-only provers live in soundness-provers.yml, which has no
# pull_request trigger, so they never appear as skipped checks here.
#
# There is deliberately no `push` trigger: a standalone feature branch starts
# no formal workflow. Pull requests still run the cheap applicability/summary
# contract so branch protection receives a conclusive status, while every
# expensive lane below is guarded by that classifier.

on:
  workflow_call:
    inputs:
      target_ref:
        description: Branch whose committed state is the reusable-run candidate.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch whose committed state is the manual-run candidate.
        required: true
        type: choice
        default: dev
        options:
          - dev
          - main
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.target_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Reusable workflows retain the caller's event name (for example
  # `schedule`), so select an explicitly supplied target independently of the
  # event. PR and merge-queue runs have no target_ref and use their checked-out
  # candidate commit.
  CANDIDATE_REF: ${{ inputs.target_ref || '' }}
  SNARKPACK_FUZZ_TOOLCHAIN: nightly-2025-09-30
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  applicability:
    name: 'formal: applicability'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: stable
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      snarkpack_status: ${{ steps.snarkpack.outputs.status }}
      snarkpack_tier: ${{ steps.snarkpack.outputs.tier }}
      snarkpack_run: ${{ steps.snarkpack.outputs.run }}
      snarkpack_explanation: ${{ steps.snarkpack.outputs.explanation }}
      snarkpack_graphs: ${{ steps.snarkpack.outputs.graphs }}
      snarkpack_static_run: ${{ steps.snarkpack_impact.outputs.static_run }}
      snarkpack_extract_run: ${{ steps.snarkpack_impact.outputs.extract_run }}
      snarkpack_extract_graphs: ${{ steps.snarkpack_impact.outputs.extract_graphs }}
      snarkpack_lean_run: ${{ steps.snarkpack_impact.outputs.lean_run }}
      snarkpack_lean_modules: ${{ steps.snarkpack_impact.outputs.lean_modules }}
      snarkpack_fstar_run: ${{ steps.snarkpack_impact.outputs.fstar_run }}
      snarkpack_fstar_proofs: ${{ steps.snarkpack_impact.outputs.fstar_proofs }}
      snarkpack_fstar_force_all: ${{ steps.snarkpack_impact.outputs.fstar_force_all }}
      snarkpack_parity_run: ${{ steps.snarkpack_impact.outputs.parity_run }}
      snarkpack_rust_reference_run: ${{ steps.snarkpack_impact.outputs.rust_reference_run }}
      snarkpack_fuzz_run: ${{ steps.snarkpack_impact.outputs.fuzz_run }}
      snarkpack_dos_run: ${{ steps.snarkpack_impact.outputs.dos_run }}
      soundness_status: ${{ steps.soundness.outputs.status }}
      soundness_tier: ${{ steps.soundness.outputs.tier }}
      soundness_run: ${{ steps.soundness.outputs.run }}
      soundness_explanation: ${{ steps.soundness.outputs.explanation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 0
      - name: Freeze the candidate commit
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse --verify HEAD^{commit})"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "invalid candidate commit: $candidate_sha" >&2
            exit 1
          }
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
      # GITHUB_OUTPUT is per-step, so both classifications can write `tier`
      # without colliding; they are read back as steps.<id>.outputs.tier.
      - name: Classify snarkpack applicability
        id: snarkpack
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: |
          set -euo pipefail
          args=(
            --gate snarkpack-formal
            --event "$GITHUB_EVENT_NAME"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ -n "$BASE_SHA" ]]; then
            args+=(--base "$BASE_SHA")
          fi
          python3 scripts/ci/gate-applicability.py "${args[@]}"
      - name: Classify soundness applicability
        id: soundness
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: |
          set -euo pipefail
          args=(
            --gate soundness-formal
            --event "$GITHUB_EVENT_NAME"
            --head "$GITHUB_SHA"
            --github-output "$GITHUB_OUTPUT"
            --pretty
          )
          if [[ -n "$BASE_SHA" ]]; then
            args+=(--base "$BASE_SHA")
          fi
          python3 scripts/ci/gate-applicability.py "${args[@]}"
      - name: Plan the exact SnarkPack FV dependency closure
        id: snarkpack_impact
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          SNARKPACK_STATUS: ${{ steps.snarkpack.outputs.status }}
          SNARKPACK_GRAPHS: ${{ steps.snarkpack.outputs.graphs }}
          SNARKPACK_UNKNOWN_FILES: ${{ steps.snarkpack.outputs.unknown_files }}
        run: |
          set -euo pipefail
          args=(
            --event "$GITHUB_EVENT_NAME"
            --status "$SNARKPACK_STATUS"
            --head "${{ steps.candidate.outputs.sha }}"
            --graphs-json "$SNARKPACK_GRAPHS"
            --unknown-files-json "$SNARKPACK_UNKNOWN_FILES"
            --github-output "$GITHUB_OUTPUT"
            --pretty
          )
          if [[ -n "$BASE_SHA" ]]; then
            args+=(--base "$BASE_SHA")
          fi
          python3 scripts/ci/snarkpack_fv_impact.py "${args[@]}"

  # ---------------------------------------------------------------- snarkpack

  snarkpack-static:
    name: 'snarkpack: static'
    needs: applicability
    if: >-
      needs.applicability.result == 'success' &&
      needs.applicability.outputs.snarkpack_static_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
          lfs: true
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache-prefix: snarkpack-static
      - name: Run static FV invariants
        env:
          SNARKPACK_FV_MODE: static
        run: >-
          python3 scripts/ci/run_with_annotation.py
          --title "SnarkPack static FV"
          -- nix develop --command just snarkpack-fv

  # Aeneas extraction is graph-addressed: one graph and one extraction process
  # per Blacksmith runner. Independent graph failures therefore cannot discard
  # successful recovery artifacts.
  snarkpack-extract:
    name: 'snarkpack: extract (${{ matrix.graph }})'
    needs: applicability
    if: >-
      needs.applicability.result == 'success' &&
      needs.applicability.outputs.snarkpack_extract_run == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        graph: ${{ fromJSON(needs.applicability.outputs.snarkpack_extract_run == 'true' && needs.applicability.outputs.snarkpack_extract_graphs || '["__not_selected__"]') }}
    container:
      image: ghcr.io/mizufinance/shieldd-snarkpack-fv-toolchain@sha256:63fb57a0c07de6c4a3ded67410b26a2804d090a3ae51929708c8e4650a686282
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
          lfs: true
      - name: Trust the workspace inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Fingerprint this graph's exact checked state
        id: extraction_fingerprint
        shell: bash
        env:
          SELECTED_GRAPH: ${{ matrix.graph }}
        run: |
          set -euo pipefail
          fingerprint="$(
            python3 \
              crates/crypto/proof-aggregation/formal/lean-ipp/scripts/extractions.py \
              ci-fingerprint --graph "$SELECTED_GRAPH"
          )"
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]] || {
            echo "invalid extraction CI fingerprint: $fingerprint" >&2
            exit 1
          }
          echo "sha256=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore exact successful graph attestation
        id: extraction_pass_cache
        if: >-
          github.event_name == 'pull_request' ||
          github.event_name == 'merge_group'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/snarkpack-extraction-pass-${{ matrix.graph }}
          key: snarkpack-extraction-pass-v1-${{ runner.os }}-${{ matrix.graph }}-${{ steps.extraction_fingerprint.outputs.sha256 }}
      - name: Validate restored graph attestation
        if: steps.extraction_pass_cache.outputs.cache-hit == 'true'
        shell: bash
        env:
          EXPECTED_FINGERPRINT: ${{ steps.extraction_fingerprint.outputs.sha256 }}
          SELECTED_GRAPH: ${{ matrix.graph }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/snarkpack-extraction-pass-$SELECTED_GRAPH/fingerprint"
          test -f "$marker"
          test "$(cat "$marker")" = "$EXPECTED_FINGERPRINT"
      - name: Restore extraction build cache
        id: extraction_cache
        if: steps.extraction_pass_cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: snarkpack-extract-v4-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/crypto/proof-aggregation/formal/snarkpack/aeneas-toolchain.toml') }}-${{ hashFiles('crates/crypto/proof-aggregation/src/**/*.rs', 'crates/crypto/proof-aggregation/formal/lean-ipp/scripts/extractions.py', 'crates/crypto/proof-aggregation/formal/lean-ipp/scripts/normalize_aeneas_lean.py') }}
          restore-keys: |
            snarkpack-extract-v4-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/crypto/proof-aggregation/formal/snarkpack/aeneas-toolchain.toml') }}-${{ hashFiles('crates/crypto/proof-aggregation/src/**/*.rs', 'crates/crypto/proof-aggregation/formal/lean-ipp/scripts/extractions.py', 'crates/crypto/proof-aggregation/formal/lean-ipp/scripts/normalize_aeneas_lean.py') }}-progress-
            snarkpack-extract-v4-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/crypto/proof-aggregation/formal/snarkpack/aeneas-toolchain.toml') }}-
      - name: Compare the selected extraction graph
        id: extraction_compare
        if: steps.extraction_pass_cache.outputs.cache-hit != 'true'
        timeout-minutes: 22
        env:
          SELECTED_GRAPH: ${{ matrix.graph }}
          SNARKPACK_FV_MODE: extract-changed
          SNARKPACK_FV_GRAPHS_JSON: '["${{ matrix.graph }}"]'
        run: >-
          python3 scripts/ci/run_with_annotation.py
          --title "SnarkPack extraction ${{ matrix.graph }}"
          -- just snarkpack-fv
      - name: Materialize this graph's recovery artifact
        id: extraction_recovery
        if: >-
          failure() &&
          steps.extraction_compare.outcome == 'failure'
        timeout-minutes: 22
        shell: bash
        env:
          SELECTED_GRAPH: ${{ matrix.graph }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/snarkpack-recovery-$SELECTED_GRAPH"
          python3 scripts/ci/run_with_annotation.py \
            --title "SnarkPack extraction recovery $SELECTED_GRAPH" \
            -- python3 \
              crates/crypto/proof-aggregation/formal/lean-ipp/scripts/extractions.py \
              regenerate --graph "$SELECTED_GRAPH" --artifact "$artifact"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Upload this graph's recovery artifact
        if: >-
          failure() &&
          steps.extraction_compare.outcome == 'failure' &&
          steps.extraction_recovery.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snarkpack-extraction-graph-${{ matrix.graph }}-${{ needs.applicability.outputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ steps.extraction_recovery.outputs.artifact }}
          if-no-files-found: error
      - name: Save the exact successful extraction compiler cache
        if: >-
          steps.extraction_compare.outcome == 'success' &&
          steps.extraction_cache.outputs.cache-hit != 'true' &&
          matrix.graph == fromJSON(needs.applicability.outputs.snarkpack_extract_graphs)[0]
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: snarkpack-extract-v4-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/crypto/proof-aggregation/formal/snarkpack/aeneas-toolchain.toml') }}-${{ hashFiles('crates/crypto/proof-aggregation/src/**/*.rs', 'crates/crypto/proof-aggregation/formal/lean-ipp/scripts/extractions.py', 'crates/crypto/proof-aggregation/formal/lean-ipp/scripts/normalize_aeneas_lean.py') }}
      - name: Materialize successful graph attestation
        if: steps.extraction_compare.outcome == 'success'
        shell: bash
        env:
          FINGERPRINT: ${{ steps.extraction_fingerprint.outputs.sha256 }}
          SELECTED_GRAPH: ${{ matrix.graph }}
        run: |
          set -euo pipefail
          marker_dir="$RUNNER_TEMP/snarkpack-extraction-pass-$SELECTED_GRAPH"
          mkdir -p "$marker_dir"
          printf '%s\n' "$FINGERPRINT" > "$marker_dir/fingerprint"
      - name: Save exact successful graph attestation
        if: steps.extraction_compare.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/snarkpack-extraction-pass-${{ matrix.graph }}
          key: snarkpack-extraction-pass-v1-${{ runner.os }}-${{ matrix.graph }}-${{ steps.extraction_fingerprint.outputs.sha256 }}
      - name: Save one source-specific extraction progress cache
        if: >-
          failure() &&
          steps.extraction_compare.outcome == 'failure' &&
          matrix.graph == fromJSON(needs.applicability.outputs.snarkpack_extract_graphs)[0]
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: snarkpack-extract-v4-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/crypto/proof-aggregation/formal/snarkpack/aeneas-toolchain.toml') }}-${{ hashFiles('crates/crypto/proof-aggregation/src/**/*.rs', 'crates/crypto/proof-aggregation/formal/lean-ipp/scripts/extractions.py', 'crates/crypto/proof-aggregation/formal/lean-ipp/scripts/normalize_aeneas_lean.py') }}-progress-${{ github.run_id }}-${{ github.run_attempt }}

  snarkpack-extraction-recovery:
    name: 'snarkpack: merge extraction recovery'
    needs: [applicability, snarkpack-extract]
    if: >-
      always() &&
      needs.applicability.result == 'success' &&
      needs.applicability.outputs.snarkpack_extract_run == 'true' &&
      needs.snarkpack-extract.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
          lfs: true
      - name: Download every successful graph recovery
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: snarkpack-extraction-graph-*-${{ needs.applicability.outputs.candidate_sha }}-${{ github.run_attempt }}
          path: recovery-artifacts
      - name: Atomically merge compatible graph recoveries
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(
            find recovery-artifacts -type f -name recovery.json \
              -printf '%h\n' | sort -u
          )
          ((${#artifacts[@]} > 0)) || {
            echo "no successful extraction recovery artifacts were produced" >&2
            exit 1
          }
          args=()
          for artifact in "${artifacts[@]}"; do
            args+=(--artifact "$artifact")
          done
          python3 scripts/ci/run_with_annotation.py \
            --title "SnarkPack extraction recovery merge" \
            -- python3 \
              crates/crypto/proof-aggregation/formal/lean-ipp/scripts/extractions.py \
              import-recovery --maximal-compatible "${args[@]}"
      - name: Upload the atomically merged candidate tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snarkpack-extraction-merged-${{ needs.applicability.outputs.candidate_sha }}-${{ github.run_attempt }}
          path: |
            crates/crypto/proof-aggregation/formal/lean-ipp/Ipp/Extracted/*Generated.lean
            crates/crypto/proof-aggregation/formal/snarkpack/lean-extraction-manifest.json
          if-no-files-found: error

  snarkpack-lean:
    name: 'snarkpack: lean affected closure'
    needs: applicability
    if: >-
      needs.applicability.result == 'success' &&
      needs.applicability.outputs.snarkpack_lean_run == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 180
    container:
      image: ghcr.io/mizufinance/shieldd-snarkpack-fv-toolchain@sha256:63fb57a0c07de6c4a3ded67410b26a2804d090a3ae51929708c8e4650a686282
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
          lfs: true
      - name: Trust the workspace inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Fingerprint each selected Lean module and its dependencies
        id: lean_fingerprint
        env:
          LEAN_MODULES_JSON: ${{ needs.applicability.outputs.snarkpack_lean_modules }}
        run: >-
          python3 scripts/ci/snarkpack_lean_attestation.py fingerprint
          --modules-json "$LEAN_MODULES_JSON"
          --github-output "$GITHUB_OUTPUT"
      - name: Restore an exact or prior serialized Lean cache
        id: lean_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: crates/crypto/proof-aggregation/formal/lean-ipp/.lake
          key: lean-ipp-v7-${{ runner.os }}-${{ hashFiles('crates/crypto/proof-aggregation/formal/lean-ipp/lake-manifest.json', 'crates/crypto/proof-aggregation/formal/lean-ipp/lakefile.lean', 'crates/crypto/proof-aggregation/formal/lean-ipp/lean-toolchain') }}-${{ steps.lean_fingerprint.outputs.state_sha256 }}
          restore-keys: |
            lean-ipp-v7-${{ runner.os }}-${{ hashFiles('crates/crypto/proof-aggregation/formal/lean-ipp/lake-manifest.json', 'crates/crypto/proof-aggregation/formal/lean-ipp/lakefile.lean', 'crates/crypto/proof-aggregation/formal/lean-ipp/lean-toolchain') }}-
            lean-ipp-v6-${{ runner.os }}-${{ hashFiles('crates/crypto/proof-aggregation/formal/lean-ipp/lake-manifest.json', 'crates/crypto/proof-aggregation/formal/lean-ipp/lakefile.lean', 'crates/crypto/proof-aggregation/formal/lean-ipp/lean-toolchain') }}-
      - name: Validate restored markers and plan only pending Lean modules
        id: lean_plan
        shell: bash
        env:
          EXACT_CACHE: ${{ steps.lean_cache.outputs.cache-hit == 'true' && '1' || '0' }}
          LEAN_MODULES_JSON: ${{ needs.applicability.outputs.snarkpack_lean_modules }}
        run: |
          set -euo pipefail
          args=(
            plan
            --modules-json "$LEAN_MODULES_JSON"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ "$EXACT_CACHE" == 1 ]]; then
            args+=(--exact-cache)
          fi
          python3 scripts/ci/snarkpack_lean_attestation.py "${args[@]}"
      - name: Build only pending modules in one serialized Lean invocation
        id: lean_build
        if: steps.lean_plan.outputs.pending == 'true'
        env:
          LEAN_NUM_THREADS: "1"
          SNARKPACK_FV_MODE: lean-changed
          SNARKPACK_LEAN_MODULES_JSON: ${{ steps.lean_plan.outputs.pending_modules }}
        run: >-
          python3 scripts/ci/run_with_annotation.py
          --title "SnarkPack pending Lean modules"
          -- just snarkpack-fv
      - name: Refresh only missing or changed audit diagnostics
        id: lean_audit_refresh
        if: >-
          steps.lean_plan.outputs.pending_audits == 'true' &&
          (steps.lean_plan.outputs.pending == 'false' ||
           steps.lean_build.outcome == 'success')
        env:
          LEAN_NUM_THREADS: "1"
          SNARKPACK_FV_MODE: lean-audit-changed
          SNARKPACK_LEAN_MODULES_JSON: ${{ steps.lean_plan.outputs.pending_audit_modules }}
          SNARKPACK_LEAN_AUDIT_LOG_DIR: ${{ runner.temp }}/snarkpack-lean-audit
        run: >-
          python3 scripts/ci/run_with_annotation.py
          --title "SnarkPack pending Lean audit diagnostics"
          -- just snarkpack-fv
      - name: Validate and cache refreshed raw audit evidence
        id: lean_audit_record
        if: >-
          steps.lean_plan.outputs.pending_audits == 'true' &&
          steps.lean_audit_refresh.outcome == 'success'
        env:
          PENDING_LEAN_AUDITS_JSON: ${{ steps.lean_plan.outputs.pending_audit_modules }}
        run: >-
          python3 scripts/ci/snarkpack_lean_attestation.py record-audit
          --modules-json "$PENDING_LEAN_AUDITS_JSON"
          --input-dir "${{ runner.temp }}/snarkpack-lean-audit"
      - name: Atomically attest modules only after builds and audits succeed
        id: lean_record
        if: >-
          steps.lean_plan.outputs.pending == 'true' &&
          steps.lean_build.outcome == 'success' &&
          (steps.lean_plan.outputs.pending_audits == 'false' ||
           steps.lean_audit_record.outcome == 'success')
        env:
          PENDING_LEAN_MODULES_JSON: ${{ steps.lean_plan.outputs.pending_modules }}
        run: >-
          python3 scripts/ci/snarkpack_lean_attestation.py record
          --modules-json "$PENDING_LEAN_MODULES_JSON"
      - name: Validate the complete current Lean attestation
        id: lean_attestation
        if: >-
          (steps.lean_plan.outputs.pending == 'false' ||
           steps.lean_record.outcome == 'success') &&
          (steps.lean_plan.outputs.pending_audits == 'false' ||
           steps.lean_audit_record.outcome == 'success')
        env:
          LEAN_MODULES_JSON: ${{ needs.applicability.outputs.snarkpack_lean_modules }}
        run: >-
          python3 scripts/ci/snarkpack_lean_attestation.py plan
          --modules-json "$LEAN_MODULES_JSON"
          --exact-cache
      - name: Re-run the current axiom parser against cached raw audit evidence
        id: lean_audit
        if: steps.lean_attestation.outcome == 'success'
        env:
          LEAN_MODULES_JSON: ${{ needs.applicability.outputs.snarkpack_lean_modules }}
        run: >-
          python3 scripts/ci/snarkpack_lean_attestation.py validate-audit
          --modules-json "$LEAN_MODULES_JSON"
      - name: Save the exact successful per-module Lean cache
        if: >-
          steps.lean_audit.outcome == 'success' &&
          steps.lean_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: crates/crypto/proof-aggregation/formal/lean-ipp/.lake
          key: lean-ipp-v7-${{ runner.os }}-${{ hashFiles('crates/crypto/proof-aggregation/formal/lean-ipp/lake-manifest.json', 'crates/crypto/proof-aggregation/formal/lean-ipp/lakefile.lean', 'crates/crypto/proof-aggregation/formal/lean-ipp/lean-toolchain') }}-${{ steps.lean_fingerprint.outputs.state_sha256 }}
      - name: Save source-specific Lean progress after a proof failure
        if: >-
          failure() &&
          steps.lean_build.outcome == 'failure'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: crates/crypto/proof-aggregation/formal/lean-ipp/.lake
          key: lean-ipp-v7-${{ runner.os }}-${{ hashFiles('crates/crypto/proof-aggregation/formal/lean-ipp/lake-manifest.json', 'crates/crypto/proof-aggregation/formal/lean-ipp/lakefile.lean', 'crates/crypto/proof-aggregation/formal/lean-ipp/lean-toolchain') }}-progress-${{ github.run_id }}-${{ github.run_attempt }}

  # Runs outside the Aeneas FV image on purpose.
  # snarkpack-formal.sh re-checks every version it is given against
  # formal/snarkpack/toolchain.toml, so a drifted pin here fails loudly.
  snarkpack-fstar:
    name: 'snarkpack: fstar'
    needs: applicability
    if: >-
      needs.applicability.result == 'success' &&
      needs.applicability.outputs.snarkpack_fstar_run == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
      - name: Fingerprint exact F* checker state
        id: fstar_fingerprint
        run: >-
          python3
          crates/crypto/proof-aggregation/formal/lean-ipp/scripts/verification_manifest.py
          fstar-ci-cache-key --github-output "$GITHUB_OUTPUT"
      - name: Restore CI-attested F* evidence
        id: fstar_pass_cache
        if: needs.applicability.outputs.snarkpack_fstar_force_all != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/snarkpack-fstar-pass
          key: snarkpack-fstar-pass-v1-${{ runner.os }}-${{ steps.fstar_fingerprint.outputs.environment_sha256 }}-${{ steps.fstar_fingerprint.outputs.exact_sha256 }}
          restore-keys: |
            snarkpack-fstar-pass-v1-${{ runner.os }}-${{ steps.fstar_fingerprint.outputs.environment_sha256 }}-
      - name: Reuse exact current F* attestation without rebuilding
        if: steps.fstar_pass_cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/snarkpack-fstar-pass/fstar-checker-evidence.json"
          python3 \
            crates/crypto/proof-aggregation/formal/lean-ipp/scripts/verification_manifest.py \
            validate-fstar-artifact --artifact "$artifact"
          cp "$artifact" \
            crates/crypto/proof-aggregation/formal/snarkpack/fstar-checker-evidence.json
      - name: Select prior CI evidence as the incremental F* base
        if: steps.fstar_pass_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/snarkpack-fstar-pass/fstar-checker-evidence.json"
          if [[ -f "$artifact" ]]; then
            echo "SNARKPACK_FSTAR_BASE_EVIDENCE=$artifact" >> "$GITHUB_ENV"
          fi
      - uses: ./.github/actions/setup-nix-rust
        if: steps.fstar_pass_cache.outputs.cache-hit != 'true'
        with:
          rust-cache-prefix: snarkpack-formal
      - name: Install pinned Z3
        if: steps.fstar_pass_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/opt"
          curl -fsSL -o /tmp/z3.zip \
            https://github.com/Z3Prover/z3/releases/download/z3-4.14.1/z3-4.14.1-x64-glibc-2.35.zip
          unzip -q /tmp/z3.zip -d "$HOME/.local/opt"
          echo "$HOME/.local/opt/z3-4.14.1-x64-glibc-2.35/bin" >> "$GITHUB_PATH"
      - name: Install pinned F*
        if: steps.fstar_pass_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/opt"
          curl -fsSL -o /tmp/fstar.tar.gz \
            https://github.com/FStarLang/FStar/releases/download/v2026.05.24/fstar-v2026.05.24-Linux-x86_64.tar.gz
          tar -xzf /tmp/fstar.tar.gz -C "$HOME/.local/opt"
          echo "$HOME/.local/opt/fstar/bin" >> "$GITHUB_PATH"
      - name: Install pinned hax
        if: steps.fstar_pass_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/opt"
          hax_dir="$HOME/.local/opt/hax-v0.3.7"
          git clone --depth 1 --branch hax-lib-v0.3.7 https://github.com/cryspen/hax "$hax_dir"
          nix profile install "$hax_dir#hax" "$hax_dir#hax-engine"
          echo "HAX_PROOF_LIBS_HOME=$hax_dir/hax-lib/proof-libs/fstar" >> "$GITHUB_ENV"
      - name: Restore exact F* Rust-boundary extraction cache
        id: fstar_boundary_cache
        if: steps.fstar_pass_cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            crates/crypto/proof-aggregation/proofs/fstar/extraction
            crates/crypto/proof-aggregation/src/ipp/ip_proofs/proofs/fstar/extraction
            crates/core/component/shielded-pool/proofs/fstar/extraction
          key: snarkpack-fstar-boundary-v1-${{ runner.os }}-${{ hashFiles('.cargo/config.toml', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'crates/crypto/proof-aggregation/Cargo.toml', 'crates/crypto/proof-aggregation/src/ipp/ip_proofs/Cargo.toml', 'crates/core/component/shielded-pool/Cargo.toml', 'crates/crypto/proof-aggregation/formal/snarkpack/toolchain.toml', 'scripts/snarkpack-formal.sh', 'crates/crypto/proof-aggregation/src/**/*.rs', 'crates/core/component/shielded-pool/src/**/*.rs') }}
      - name: Run SnarkPack F* gate
        id: fstar_check
        if: steps.fstar_pass_cache.outputs.cache-hit != 'true'
        env:
          SNARKPACK_FSTAR_EVIDENCE_UPDATE: "1"
          SNARKPACK_FSTAR_PROOFS_JSON: ${{ needs.applicability.outputs.snarkpack_fstar_proofs }}
          SNARKPACK_FSTAR_BOUNDARY_CACHE_HIT: ${{ steps.fstar_boundary_cache.outputs.cache-hit == 'true' && '1' || '0' }}
          # Reusable scheduled runs retain the caller's event name. Those and
          # manual full runs must re-check every module even when committed
          # per-module evidence is current.
          SNARKPACK_FSTAR_FORCE_ALL: ${{ needs.applicability.outputs.snarkpack_fstar_force_all == 'true' && '1' || '0' }}
        run: >-
          python3 scripts/ci/run_with_annotation.py
          --title "SnarkPack F*"
          -- nix develop --command scripts/snarkpack-formal.sh
      - name: Validate newly checked F* evidence
        id: fstar_artifact_validation
        if: steps.fstar_check.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 \
            crates/crypto/proof-aggregation/formal/lean-ipp/scripts/verification_manifest.py \
            validate-fstar-artifact \
            --artifact \
            crates/crypto/proof-aggregation/formal/snarkpack/fstar-checker-evidence.json
      - name: Materialize exact successful F* attestation
        if: steps.fstar_artifact_validation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/snarkpack-fstar-pass"
          mkdir -p "$cache_dir"
          cp \
            crates/crypto/proof-aggregation/formal/snarkpack/fstar-checker-evidence.json \
            "$cache_dir/fstar-checker-evidence.json"
      - name: Save exact successful F* attestation
        if: steps.fstar_artifact_validation.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/snarkpack-fstar-pass
          key: snarkpack-fstar-pass-v1-${{ runner.os }}-${{ steps.fstar_fingerprint.outputs.environment_sha256 }}-${{ steps.fstar_fingerprint.outputs.exact_sha256 }}
      - name: Upload checked F* evidence
        if: >-
          steps.fstar_pass_cache.outputs.cache-hit == 'true' ||
          steps.fstar_artifact_validation.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snarkpack-fstar-checker-evidence-${{ needs.applicability.outputs.candidate_sha }}-${{ github.run_attempt }}
          path: crates/crypto/proof-aggregation/formal/snarkpack/fstar-checker-evidence.json
          if-no-files-found: error

  snarkpack-parity:
    name: 'snarkpack: parity'
    needs: applicability
    if: >-
      needs.applicability.result == 'success' &&
      needs.applicability.outputs.snarkpack_parity_run == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
          lfs: true
      - name: Fingerprint exact parity lane inputs
        id: parity_fingerprint
        shell: bash
        env:
          GRAPH_SELECTION: ${{ needs.applicability.outputs.snarkpack_extract_graphs }}
        run: |
          set -euo pipefail
          python3 scripts/ci/snarkpack_lane_fingerprint.py \
            --lane parity \
            --context "$GRAPH_SELECTION" \
            --github-output "$GITHUB_OUTPUT"
      - name: Restore exact successful parity attestation
        id: parity_pass_cache
        if: needs.applicability.outputs.snarkpack_fstar_force_all != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/snarkpack-parity-pass
          key: snarkpack-parity-pass-v1-${{ runner.os }}-${{ steps.parity_fingerprint.outputs.sha256 }}
      - name: Validate restored parity attestation
        if: steps.parity_pass_cache.outputs.cache-hit == 'true'
        shell: bash
        env:
          EXPECTED_SHA256: ${{ steps.parity_fingerprint.outputs.sha256 }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/snarkpack-parity-pass/sha256"
          [[ -f "$marker" ]] || {
            echo "restored parity attestation has no marker" >&2
            exit 1
          }
          [[ "$(cat "$marker")" == "$EXPECTED_SHA256" ]] || {
            echo "restored parity attestation does not match current inputs" >&2
            exit 1
          }
      - uses: ./.github/actions/setup-nix-rust
        if: steps.parity_pass_cache.outputs.cache-hit != 'true'
        with:
          rust-cache-prefix: snarkpack-parity
      - name: Run Rust/reference parity once
        id: parity_check
        if: steps.parity_pass_cache.outputs.cache-hit != 'true'
        env:
          SNARKPACK_FV_MODE: parity-changed
          SNARKPACK_FV_GRAPHS_JSON: ${{ needs.applicability.outputs.snarkpack_extract_graphs }}
        run: >-
          python3 scripts/ci/run_with_annotation.py
          --title "SnarkPack parity"
          -- nix develop --command just snarkpack-fv
      - name: Materialize successful parity attestation
        if: steps.parity_check.outcome == 'success'
        shell: bash
        env:
          CURRENT_SHA256: ${{ steps.parity_fingerprint.outputs.sha256 }}
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/snarkpack-parity-pass"
          mkdir -p "$cache_dir"
          printf '%s\n' "$CURRENT_SHA256" > "$cache_dir/sha256"
      - name: Save exact successful parity attestation
        if: steps.parity_check.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/snarkpack-parity-pass
          key: snarkpack-parity-pass-v1-${{ runner.os }}-${{ steps.parity_fingerprint.outputs.sha256 }}

  snarkpack-rust-reference:
    name: 'snarkpack: rust and reference'
    needs: applicability
    if: >-
      needs.applicability.result == 'success' &&
      needs.applicability.outputs.snarkpack_rust_reference_run == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
          lfs: true
      - name: Fingerprint exact Rust/reference lane inputs
        id: rust_reference_fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/snarkpack_lane_fingerprint.py \
            --lane rust-reference \
            --github-output "$GITHUB_OUTPUT"
      - name: Restore exact successful Rust/reference attestation
        id: rust_reference_pass_cache
        if: needs.applicability.outputs.snarkpack_fstar_force_all != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/snarkpack-rust-reference-pass
          key: snarkpack-rust-reference-pass-v1-${{ runner.os }}-${{ steps.rust_reference_fingerprint.outputs.sha256 }}
      - name: Validate restored Rust/reference attestation
        if: steps.rust_reference_pass_cache.outputs.cache-hit == 'true'
        shell: bash
        env:
          EXPECTED_SHA256: ${{ steps.rust_reference_fingerprint.outputs.sha256 }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/snarkpack-rust-reference-pass/sha256"
          [[ -f "$marker" ]] || {
            echo "restored Rust/reference attestation has no marker" >&2
            exit 1
          }
          [[ "$(cat "$marker")" == "$EXPECTED_SHA256" ]] || {
            echo "restored Rust/reference attestation does not match current inputs" >&2
            exit 1
          }
      - uses: ./.github/actions/setup-nix-rust
        if: steps.rust_reference_pass_cache.outputs.cache-hit != 'true'
        with:
          rust-cache-prefix: snarkpack-rust-reference
      - name: Run production and independent-reference suites
        id: rust_reference_check
        if: steps.rust_reference_pass_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          app_shipping_log="$(mktemp)"
          trap 'rm -f "$app_shipping_log"' EXIT
          python3 scripts/ci/run_with_annotation.py \
            --title "SnarkPack production Rust suite" \
            -- nix develop --command cargo test \
              -p shieldd-sdk-proof-aggregation --lib
          python3 scripts/ci/run_with_annotation.py \
            --title "SnarkPack independent reference suite" \
            -- nix develop --command cargo test \
              -p shieldd-sdk-proof-aggregation-reference --lib
          python3 scripts/ci/run_with_annotation.py \
            --title "SnarkPack application aggregate suite" \
            -- nix develop --command cargo test \
              -p shieldd-sdk-app --lib aggregate_ -- --test-threads=1
          python3 scripts/ci/run_with_annotation.py \
            --title "SnarkPack shipping-input retention" \
            -- nix develop --command cargo test \
              -p shieldd-sdk-app --lib \
              app::tests::async_verifier_outcome_retains_its_exact_shipping_input \
              -- --exact --test-threads=1 2>&1 | tee "$app_shipping_log"
          python3 scripts/ci/run_with_annotation.py \
            --title "SnarkPack shipping-input test evidence" \
            -- nix develop --command python3 \
              crates/crypto/proof-aggregation/formal/lean-ipp/scripts/verification_manifest.py \
              test-log "$app_shipping_log" \
              --expected 1 \
              --label "async_verifier_outcome_retains_its_exact_shipping_input" \
              --test-name "app::tests::async_verifier_outcome_retains_its_exact_shipping_input"
          python3 scripts/ci/run_with_annotation.py \
            --title "SnarkPack challenge boundaries" \
            -- nix develop --command just snarkpack-challenge-boundaries
      - name: Materialize successful Rust/reference attestation
        if: steps.rust_reference_check.outcome == 'success'
        shell: bash
        env:
          CURRENT_SHA256: ${{ steps.rust_reference_fingerprint.outputs.sha256 }}
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/snarkpack-rust-reference-pass"
          mkdir -p "$cache_dir"
          printf '%s\n' "$CURRENT_SHA256" > "$cache_dir/sha256"
      - name: Save exact successful Rust/reference attestation
        if: steps.rust_reference_check.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/snarkpack-rust-reference-pass
          key: snarkpack-rust-reference-pass-v1-${{ runner.os }}-${{ steps.rust_reference_fingerprint.outputs.sha256 }}

