name: formal

# One category, many lanes — the shape orbis-integration already uses.
#
# snarkpack-formal and soundness-formal were separate workflows, so each paid
# its own applicability + summary tax and duplicated the classifier boilerplate.
# They verify the same tree on the same events, so they are one gate with two
# families of lanes: `snarkpack: *` and `soundness: *`.
#
# The manually invoked provers live in soundness-provers.yml, which has no
# pull_request trigger, so they never appear as skipped checks here.
#
# There is deliberately no `push` trigger: a standalone feature branch starts
# no formal workflow. Pull requests still run the cheap applicability/summary
# contract so branch protection receives a conclusive status, while every
# expensive lane below is guarded by that classifier.

on:
  workflow_call:
    inputs:
      target_ref:
        description: Branch whose committed state is the reusable-run candidate.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit SHA to verify.
        required: true
        type: string
        default: dev
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.target_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Reusable workflows select an explicitly supplied target independently of
  # the event. PR and merge-queue runs use their checked-out candidate commit.
  CANDIDATE_REF: ${{ inputs.target_ref || '' }}
  SNARKPACK_FUZZ_TOOLCHAIN: nightly-2025-09-30
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  applicability:
    name: 'formal: applicability'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: stable
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      snarkpack_status: ${{ steps.snarkpack.outputs.status }}
      snarkpack_tier: ${{ steps.snarkpack.outputs.tier }}
      snarkpack_run: ${{ steps.snarkpack.outputs.run }}
      snarkpack_explanation: ${{ steps.snarkpack.outputs.explanation }}
      snarkpack_graphs: ${{ steps.snarkpack.outputs.graphs }}
      snarkpack_static_run: ${{ steps.snarkpack_impact.outputs.static_run }}
      snarkpack_extract_run: ${{ steps.snarkpack_impact.outputs.extract_run }}
      snarkpack_extract_graphs: ${{ steps.snarkpack_impact.outputs.extract_graphs }}
      snarkpack_extract_cache_hit: ${{ steps.extract_pass_cache.outputs.cache-hit }}
      snarkpack_lean_run: ${{ steps.snarkpack_impact.outputs.lean_run }}
      snarkpack_lean_modules: ${{ steps.snarkpack_impact.outputs.lean_modules }}
      snarkpack_fstar_run: ${{ steps.snarkpack_impact.outputs.fstar_run }}
      snarkpack_fstar_proofs: ${{ steps.snarkpack_impact.outputs.fstar_proofs }}
      snarkpack_fstar_force_all: ${{ steps.snarkpack_impact.outputs.fstar_force_all }}
      snarkpack_parity_run: ${{ steps.snarkpack_impact.outputs.parity_run }}
      snarkpack_extract_parity_fingerprint: ${{ steps.extract_parity_fingerprint.outputs.sha256 }}
      snarkpack_parity_cache_hit: ${{ steps.parity_pass_cache.outputs.cache-hit }}
      snarkpack_rust_reference_run: ${{ steps.snarkpack_impact.outputs.rust_reference_run }}
      snarkpack_fuzz_run: ${{ steps.snarkpack_impact.outputs.fuzz_run }}
      snarkpack_dos_run: ${{ steps.snarkpack_impact.outputs.dos_run }}
      snarkpack_runtime_fingerprint: ${{ steps.runtime_fingerprint.outputs.sha256 }}
      snarkpack_runtime_cache_hit: ${{ steps.runtime_cache.outputs.cache-hit }}
      snarkpack_fstar_environment_sha256: ${{ steps.fstar_fingerprint.outputs.environment_sha256 }}
      snarkpack_fstar_exact_sha256: ${{ steps.fstar_fingerprint.outputs.exact_sha256 }}
      snarkpack_fstar_cache_hit: ${{ steps.fstar_pass_cache.outputs.cache-hit }}
      soundness_status: ${{ steps.soundness.outputs.status }}
      soundness_tier: ${{ steps.soundness.outputs.tier }}
      soundness_run: ${{ steps.soundness.outputs.run }}
      soundness_explanation: ${{ steps.soundness.outputs.explanation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 0
      - name: Freeze the candidate commit
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse --verify HEAD^{commit})"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "invalid candidate commit: $candidate_sha" >&2
            exit 1
          }
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
      - name: Prepare bounded applicability state
        run: mkdir -p .ci-state
      # GITHUB_OUTPUT is per-step, so both classifications can write `tier`
      # without colliding; they are read back as steps.<id>.outputs.tier.
      - name: Classify snarkpack applicability
        id: snarkpack
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: |
          set -euo pipefail
          args=(
            --gate snarkpack-formal
            --event "$GITHUB_EVENT_NAME"
            --decision-file .ci-state/snarkpack-decision.json
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ -n "$BASE_SHA" ]]; then
            args+=(--base "$BASE_SHA")
          fi
          python3 scripts/ci/gate-applicability.py "${args[@]}"
      - name: Classify soundness applicability
        id: soundness
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: |
          set -euo pipefail
          args=(
            --gate soundness-formal
            --event "$GITHUB_EVENT_NAME"
            --head "${{ steps.candidate.outputs.sha }}"
            --decision-file .ci-state/soundness-decision.json
            --github-output "$GITHUB_OUTPUT"
            --pretty
          )
          if [[ -n "$BASE_SHA" ]]; then
            args+=(--base "$BASE_SHA")
          fi
          python3 scripts/ci/gate-applicability.py "${args[@]}"
      - name: Plan the exact SnarkPack FV dependency closure
        id: snarkpack_impact
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: |
          set -euo pipefail
          args=(
            --event "$GITHUB_EVENT_NAME"
            --head "${{ steps.candidate.outputs.sha }}"
            --gate-decision .ci-state/snarkpack-decision.json
            --github-output "$GITHUB_OUTPUT"
            --pretty
          )
          if [[ -n "$BASE_SHA" ]]; then
            args+=(--base "$BASE_SHA")
          fi
          python3 scripts/ci/snarkpack_fv_impact.py "${args[@]}"
      # Resolve exact pass records on the GitHub-hosted planner. A hit keeps the
      # corresponding compute job from being provisioned at all.
      - name: Fingerprint selected extraction/parity inputs
        id: extract_parity_fingerprint
        if: >-
          steps.snarkpack_impact.outputs.extract_run == 'true' ||
          steps.snarkpack_impact.outputs.parity_run == 'true'
        env:
          GRAPH_SELECTION: ${{ steps.snarkpack_impact.outputs.extract_graphs }}
        run: >-
          python3 scripts/ci/snarkpack_lane_fingerprint.py
          --lane parity
          --context "$GRAPH_SELECTION"
          --github-output "$GITHUB_OUTPUT"
      - name: Look up exact parity success
        id: parity_pass_cache
        if: steps.snarkpack_impact.outputs.parity_run == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache/snarkpack-parity-pass
          key: snarkpack-parity-pass-v2-${{ runner.os }}-${{ steps.extract_parity_fingerprint.outputs.sha256 }}
      - name: Validate cached parity success
        if: steps.parity_pass_cache.outputs.cache-hit == 'true'
        env:
          EXPECTED_SHA256: ${{ steps.extract_parity_fingerprint.outputs.sha256 }}
        run: |
          set -euo pipefail
          marker=".ci-cache/snarkpack-parity-pass/sha256"
          test -f "$marker"
          test "$(cat "$marker")" = "$EXPECTED_SHA256"
      - name: Look up exact extraction success
        id: extract_pass_cache
        if: steps.snarkpack_impact.outputs.extract_run == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache/snarkpack-extract-pass
          key: snarkpack-extract-pass-v2-${{ runner.os }}-${{ steps.extract_parity_fingerprint.outputs.sha256 }}
      - name: Validate cached extraction success
        if: steps.extract_pass_cache.outputs.cache-hit == 'true'
        env:
          EXPECTED_SHA256: ${{ steps.extract_parity_fingerprint.outputs.sha256 }}
        run: |
          set -euo pipefail
          marker=".ci-cache/snarkpack-extract-pass/sha256"
          test -f "$marker"
          test "$(cat "$marker")" = "$EXPECTED_SHA256"
      - name: Fingerprint selected runtime inputs
        id: runtime_fingerprint
        if: >-
          steps.snarkpack_impact.outputs.rust_reference_run == 'true' ||
          steps.snarkpack_impact.outputs.fuzz_run == 'true' ||
          steps.snarkpack_impact.outputs.dos_run == 'true'
        env:
          RUST_REFERENCE_RUN: ${{ steps.snarkpack_impact.outputs.rust_reference_run }}
          FUZZ_RUN: ${{ steps.snarkpack_impact.outputs.fuzz_run }}
          DOS_RUN: ${{ steps.snarkpack_impact.outputs.dos_run }}
          FUZZ_RUNS: ${{ (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && '256' || '16' }}
        run: |
          set -euo pipefail
          python3 scripts/ci/snarkpack_lane_fingerprint.py \
            --lane runtime \
            --context "rust-reference=$RUST_REFERENCE_RUN" \
            --context "fuzz=$FUZZ_RUN:$FUZZ_RUNS" \
            --context "dos=$DOS_RUN" \
            --github-output "$GITHUB_OUTPUT"
      - name: Look up exact runtime success
        id: runtime_cache
        if: steps.runtime_fingerprint.outcome == 'success'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache/snarkpack-runtime-pass
          key: snarkpack-runtime-pass-v2-${{ runner.os }}-${{ steps.runtime_fingerprint.outputs.sha256 }}
      - name: Validate cached runtime success
        if: steps.runtime_cache.outputs.cache-hit == 'true'
        env:
          EXPECTED_SHA256: ${{ steps.runtime_fingerprint.outputs.sha256 }}
        run: |
          set -euo pipefail
          marker=".ci-cache/snarkpack-runtime-pass/sha256"
          test -f "$marker"
          test "$(cat "$marker")" = "$EXPECTED_SHA256"
      - name: Fingerprint selected F* inputs
        id: fstar_fingerprint
        if: steps.snarkpack_impact.outputs.fstar_run == 'true'
        run: >-
          python3
          crates/crypto/proof-aggregation/formal/lean-ipp/scripts/verification_manifest.py
          fstar-ci-cache-key --github-output "$GITHUB_OUTPUT"
      - name: Look up exact F* success
        id: fstar_pass_cache
        if: >-
          steps.fstar_fingerprint.outcome == 'success' &&
          steps.snarkpack_impact.outputs.fstar_force_all != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache/snarkpack-fstar-pass
          key: snarkpack-fstar-pass-v2-${{ runner.os }}-${{ steps.fstar_fingerprint.outputs.environment_sha256 }}-${{ steps.fstar_fingerprint.outputs.exact_sha256 }}
      - name: Validate cached F* success
        if: steps.fstar_pass_cache.outputs.cache-hit == 'true'
        run: >-
          python3
          crates/crypto/proof-aggregation/formal/lean-ipp/scripts/verification_manifest.py
          validate-fstar-artifact
          --artifact ".ci-cache/snarkpack-fstar-pass/fstar-checker-evidence.json"
      - name: Upload applicability decisions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formal-applicability-${{ steps.candidate.outputs.sha }}-${{ github.run_attempt }}
          path: .ci-state
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------- snarkpack

  snarkpack-static:
    name: 'snarkpack: static'
    needs: applicability
    if: >-
      needs.applicability.result == 'success' &&
      needs.applicability.outputs.snarkpack_static_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
      - name: Validate the locally generated Lean cache
        if: needs.applicability.outputs.snarkpack_lean_run == 'true'
        env:
          LEAN_MODULES_JSON: ${{ needs.applicability.outputs.snarkpack_lean_modules }}
        run: |
          set -euo pipefail
          python3 scripts/ci/snarkpack_lean_attestation.py plan \
            --modules-json "$LEAN_MODULES_JSON" \
            --exact-cache
          python3 scripts/ci/snarkpack_lean_attestation.py validate-audit \
            --modules-json "$LEAN_MODULES_JSON"
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache-prefix: snarkpack-static
      - name: Run static FV invariants
        env:
          SNARKPACK_FV_MODE: static
          # A stale row may bypass its committed source/checker evidence only
          # when this same run schedules that row kind's exact replacement
          # lane. One lane cannot mask another kind's stale evidence.
          SNARKPACK_ALLOW_PENDING_FSTAR_CONTRACT_REFRESH: ${{ needs.applicability.outputs.snarkpack_fstar_run == 'true' && '1' || '0' }}
          SNARKPACK_ALLOW_PENDING_EXTERNAL_CONTRACT_REFRESH: ${{ needs.applicability.outputs.snarkpack_rust_reference_run == 'true' && '1' || '0' }}
        run: >-
          python3 scripts/ci/run_with_annotation.py
          --title "SnarkPack static FV"
          -- nix develop --command just snarkpack-fv

  # Reproduce every affected extraction graph in one process. The source
  # inventory cache and compiler cache are shared across graphs, and one PR can
  # provision at most one extraction runner.
  snarkpack-extract:
    name: 'snarkpack: extraction'
    needs: applicability
    if: >-
      needs.applicability.result == 'success' &&
      needs.applicability.outputs.snarkpack_extract_run == 'true' &&
      needs.applicability.outputs.snarkpack_extract_cache_hit != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/mizufinance/shieldd-snarkpack-fv-toolchain@sha256:63fb57a0c07de6c4a3ded67410b26a2804d090a3ae51929708c8e4650a686282
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
      - name: Trust the workspace inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Restore the shared extraction compiler cache
        id: extraction_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: snarkpack-extract-v5-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/crypto/proof-aggregation/formal/snarkpack/aeneas-toolchain.toml') }}-${{ hashFiles('crates/crypto/proof-aggregation/src/**/*.rs', 'crates/crypto/proof-aggregation/formal/lean-ipp/scripts/extractions.py', 'crates/crypto/proof-aggregation/formal/lean-ipp/scripts/normalize_aeneas_lean.py') }}
          restore-keys: |
            snarkpack-extract-v5-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/crypto/proof-aggregation/formal/snarkpack/aeneas-toolchain.toml') }}-
      - name: Compare every affected extraction graph
        id: extraction_compare
        env:
          SNARKPACK_FV_MODE: extract-changed
          SNARKPACK_FV_GRAPHS_JSON: ${{ needs.applicability.outputs.snarkpack_extract_graphs }}
        run: >-
          python3 scripts/ci/run_with_annotation.py
          --title "SnarkPack affected extraction graphs"
          -- just snarkpack-fv
      - name: Generate exact extraction refresh artifacts
        if: failure() && steps.extraction_compare.outcome == 'failure'
        shell: bash
        env:
          SNARKPACK_FV_GRAPHS_JSON: ${{ needs.applicability.outputs.snarkpack_extract_graphs }}
        run: |
          set -euo pipefail
          script="crates/crypto/proof-aggregation/formal/lean-ipp/scripts/extractions.py"
          artifact_root=".ci-artifacts/snarkpack-extraction-refresh"
          mkdir -p "$artifact_root"
          jq -er '.[]' <<< "$SNARKPACK_FV_GRAPHS_JSON" |
            while IFS= read -r graph; do
              python3 "$script" regenerate \
                --graph "$graph" \
                --artifact "$artifact_root/$graph"
            done
          mapfile -d '' artifacts < <(
            find "$artifact_root" -mindepth 1 -maxdepth 1 -type d -print0 |
              sort -z
          )
          import_args=()
          for artifact in "${artifacts[@]}"; do
            import_args+=(--artifact "$artifact")
          done
          python3 "$script" import-recovery \
            --maximal-compatible \
            "${import_args[@]}"
          patch="$artifact_root/refresh.patch"
          git diff --binary -- . > "$patch"
          test -s "$patch"
          {
            echo "# SnarkPack extraction refresh"
            echo
            echo "Candidate: $GITHUB_SHA"
            echo
            echo "Review refresh.patch, then apply it from that exact candidate:"
            echo
            echo '```sh'
            echo 'git apply --index refresh.patch'
            echo 'just snarkpack-fv'
            echo '```'
            echo
            echo "Recovery records are included for audit and later compatible waves."
          } > "$artifact_root/README.md"
      - name: Upload exact extraction refresh artifacts
        if: failure() && steps.extraction_compare.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snarkpack-extraction-refresh-${{ needs.applicability.outputs.candidate_sha }}-${{ github.run_attempt }}
          path: .ci-artifacts/snarkpack-extraction-refresh
          if-no-files-found: error
          retention-days: 7
      - name: Save the successful shared extraction compiler cache
        if: >-
          steps.extraction_compare.outcome == 'success' &&
          steps.extraction_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: snarkpack-extract-v5-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/crypto/proof-aggregation/formal/snarkpack/aeneas-toolchain.toml') }}-${{ hashFiles('crates/crypto/proof-aggregation/src/**/*.rs', 'crates/crypto/proof-aggregation/formal/lean-ipp/scripts/extractions.py', 'crates/crypto/proof-aggregation/formal/lean-ipp/scripts/normalize_aeneas_lean.py') }}
      - name: Materialize successful extraction attestation
        if: steps.extraction_compare.outcome == 'success'
        shell: bash
        env:
          CURRENT_SHA256: ${{ needs.applicability.outputs.snarkpack_extract_parity_fingerprint }}
        run: |
          set -euo pipefail
          cache_dir=".ci-cache/snarkpack-extract-pass"
          mkdir -p "$cache_dir"
          printf '%s\n' "$CURRENT_SHA256" > "$cache_dir/sha256"
      - name: Save exact successful extraction attestation
        if: steps.extraction_compare.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache/snarkpack-extract-pass
          key: snarkpack-extract-pass-v2-${{ runner.os }}-${{ needs.applicability.outputs.snarkpack_extract_parity_fingerprint }}

  # Runs outside the Aeneas FV image on purpose.
  # snarkpack-formal.sh re-checks every version it is given against
  # formal/snarkpack/toolchain.toml, so a drifted pin here fails loudly.
  snarkpack-fstar:
    name: 'snarkpack: fstar'
    needs: applicability
    if: >-
      needs.applicability.result == 'success' &&
      needs.applicability.outputs.snarkpack_fstar_run == 'true' &&
      (
        needs.applicability.outputs.snarkpack_fstar_force_all == 'true' ||
        needs.applicability.outputs.snarkpack_fstar_cache_hit != 'true'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 45 || 90 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache-prefix: snarkpack-formal
      - name: Install pinned Z3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/opt"
          curl -fsSL -o /tmp/z3.zip \
            https://github.com/Z3Prover/z3/releases/download/z3-4.14.1/z3-4.14.1-x64-glibc-2.35.zip
          unzip -q /tmp/z3.zip -d "$HOME/.local/opt"
          echo "$HOME/.local/opt/z3-4.14.1-x64-glibc-2.35/bin" >> "$GITHUB_PATH"
      - name: Install pinned F*
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/opt"
          curl -fsSL -o /tmp/fstar.tar.gz \
            https://github.com/FStarLang/FStar/releases/download/v2026.05.24/fstar-v2026.05.24-Linux-x86_64.tar.gz
          tar -xzf /tmp/fstar.tar.gz -C "$HOME/.local/opt"
          echo "$HOME/.local/opt/fstar/bin" >> "$GITHUB_PATH"
      - name: Install pinned hax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/opt"
          hax_dir="$HOME/.local/opt/hax-v0.3.7"
          git clone --depth 1 --branch hax-lib-v0.3.7 https://github.com/cryspen/hax "$hax_dir"
          nix profile install "$hax_dir#hax" "$hax_dir#hax-engine"
          echo "HAX_PROOF_LIBS_HOME=$hax_dir/hax-lib/proof-libs/fstar" >> "$GITHUB_ENV"
      - name: Restore exact F* Rust-boundary extraction cache
        id: fstar_boundary_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            crates/crypto/proof-aggregation/proofs/fstar/extraction
            crates/crypto/proof-aggregation/src/ipp/ip_proofs/proofs/fstar/extraction
            crates/core/component/shielded-pool/proofs/fstar/extraction
          key: snarkpack-fstar-boundary-v1-${{ runner.os }}-${{ hashFiles('.cargo/config.toml', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'crates/crypto/proof-aggregation/Cargo.toml', 'crates/crypto/proof-aggregation/src/ipp/ip_proofs/Cargo.toml', 'crates/core/component/shielded-pool/Cargo.toml', 'crates/crypto/proof-aggregation/formal/snarkpack/toolchain.toml', 'scripts/snarkpack-formal.sh', 'crates/crypto/proof-aggregation/src/**/*.rs', 'crates/core/component/shielded-pool/src/**/*.rs') }}
      - name: Run SnarkPack F* gate
        id: fstar_check
        env:
          SNARKPACK_FSTAR_EVIDENCE_UPDATE: "1"
          SNARKPACK_FSTAR_PROOFS_JSON: ${{ needs.applicability.outputs.snarkpack_fstar_proofs }}
          SNARKPACK_FSTAR_BOUNDARY_CACHE_HIT: ${{ steps.fstar_boundary_cache.outputs.cache-hit == 'true' && '1' || '0' }}
          # Reusable and manual full runs must re-check every module even when committed
          # per-module evidence is current.
          SNARKPACK_FSTAR_FORCE_ALL: ${{ needs.applicability.outputs.snarkpack_fstar_force_all == 'true' && '1' || '0' }}
        run: >-
          python3 scripts/ci/run_with_annotation.py
          --title "SnarkPack F*"
          -- nix develop --command scripts/snarkpack-formal.sh
      - name: Validate newly checked F* evidence
        id: fstar_artifact_validation
        if: steps.fstar_check.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 \
            crates/crypto/proof-aggregation/formal/lean-ipp/scripts/verification_manifest.py \
            validate-fstar-artifact \
            --artifact \
            crates/crypto/proof-aggregation/formal/snarkpack/fstar-checker-evidence.json
      - name: Upload exact F* evidence refresh
        if: steps.fstar_artifact_validation.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snarkpack-fstar-refresh-${{ needs.applicability.outputs.candidate_sha }}-${{ github.run_attempt }}
          path: crates/crypto/proof-aggregation/formal/snarkpack/fstar-checker-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Materialize exact successful F* attestation
        if: steps.fstar_artifact_validation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cache_dir=".ci-cache/snarkpack-fstar-pass"
          mkdir -p "$cache_dir"
          cp \
            crates/crypto/proof-aggregation/formal/snarkpack/fstar-checker-evidence.json \
            "$cache_dir/fstar-checker-evidence.json"
      - name: Save exact successful F* attestation
        if: steps.fstar_artifact_validation.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache/snarkpack-fstar-pass
          key: snarkpack-fstar-pass-v2-${{ runner.os }}-${{ needs.applicability.outputs.snarkpack_fstar_environment_sha256 }}-${{ needs.applicability.outputs.snarkpack_fstar_exact_sha256 }}
      - name: Upload checked F* evidence
        if: steps.fstar_artifact_validation.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snarkpack-fstar-checker-evidence-${{ needs.applicability.outputs.candidate_sha }}-${{ github.run_attempt }}
          path: crates/crypto/proof-aggregation/formal/snarkpack/fstar-checker-evidence.json
          if-no-files-found: error

  snarkpack-parity:
    name: 'snarkpack: parity'
    needs: [applicability, snarkpack-extract]
    if: >-
      always() &&
      needs.applicability.result == 'success' &&
      needs.applicability.outputs.snarkpack_parity_run == 'true' &&
      needs.applicability.outputs.snarkpack_parity_cache_hit != 'true' &&
      (
        needs.applicability.outputs.snarkpack_extract_run != 'true' ||
        needs.applicability.outputs.snarkpack_extract_cache_hit == 'true' ||
        needs.snarkpack-extract.result == 'success'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache-prefix: snarkpack-parity
      - name: Run Rust/reference parity once
        id: parity_check
        env:
          SNARKPACK_FV_MODE: parity-changed
          SNARKPACK_FV_GRAPHS_JSON: ${{ needs.applicability.outputs.snarkpack_extract_graphs }}
        run: >-
          python3 scripts/ci/run_with_annotation.py
          --title "SnarkPack parity"
          -- nix develop --command just snarkpack-fv
      - name: Materialize successful parity attestation
        if: steps.parity_check.outcome == 'success'
        shell: bash
        env:
          CURRENT_SHA256: ${{ needs.applicability.outputs.snarkpack_extract_parity_fingerprint }}
        run: |
          set -euo pipefail
          cache_dir=".ci-cache/snarkpack-parity-pass"
          mkdir -p "$cache_dir"
          printf '%s\n' "$CURRENT_SHA256" > "$cache_dir/sha256"
      - name: Save exact successful parity attestation
        if: steps.parity_check.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache/snarkpack-parity-pass
          key: snarkpack-parity-pass-v2-${{ runner.os }}-${{ needs.applicability.outputs.snarkpack_extract_parity_fingerprint }}

  # Runtime checks share one checkout and one Cargo closure fingerprint. Exact
  # pass evidence skips every selected runtime mode.
  snarkpack-runtime:
    name: 'snarkpack: runtime'
    needs: applicability
    if: >-
      needs.applicability.result == 'success' &&
      (
        needs.applicability.outputs.snarkpack_rust_reference_run == 'true' ||
        needs.applicability.outputs.snarkpack_fuzz_run == 'true' ||
        needs.applicability.outputs.snarkpack_dos_run == 'true'
      ) &&
      needs.applicability.outputs.snarkpack_runtime_cache_hit != 'true'
    # Candidate runs defer this exhaustive lane. Manual replays use
    # GitHub-hosted runners so the assurance path has no external-runner dependency.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache-prefix: snarkpack-runtime
      - name: Run production and independent-reference suites
        if: >-
          needs.applicability.outputs.snarkpack_rust_reference_run == 'true'
        run: |
          set -euo pipefail
          app_shipping_log="$(mktemp)"
          trap 'rm -f "$app_shipping_log"' EXIT
          python3 scripts/ci/run_with_annotation.py \
            --title "SnarkPack production Rust suite" \
            -- nix develop --command cargo test \
              -p shieldd-sdk-proof-aggregation --lib
          python3 scripts/ci/run_with_annotation.py \
            --title "SnarkPack independent reference suite" \
            -- nix develop --command cargo test \
              -p shieldd-sdk-proof-aggregation-reference --lib
          python3 scripts/ci/run_with_annotation.py \
            --title "SnarkPack application aggregate suite" \
            -- nix develop --command cargo test \
              -p shieldd-sdk-app --lib aggregate_ -- --test-threads=1
          python3 scripts/ci/run_with_annotation.py \
            --title "SnarkPack shipping-input retention" \
            -- nix develop --command cargo test \
              -p shieldd-sdk-app --lib \
              app::tests::async_verifier_outcome_retains_its_exact_shipping_input \
              -- --exact --test-threads=1 2>&1 | tee "$app_shipping_log"
          python3 scripts/ci/run_with_annotation.py \
            --title "SnarkPack shipping-input test evidence" \
            -- nix develop --command python3 \
              crates/crypto/proof-aggregation/formal/lean-ipp/scripts/verification_manifest.py \
              test-log "$app_shipping_log" \
              --expected 1 \
              --label "async_verifier_outcome_retains_its_exact_shipping_input" \
              --test-name "app::tests::async_verifier_outcome_retains_its_exact_shipping_input"
          python3 scripts/ci/run_with_annotation.py \
            --title "SnarkPack challenge boundaries" \
            -- nix develop --command just snarkpack-challenge-boundaries
      - name: Run the slow interoperability suite
        if: >-
          needs.applicability.outputs.snarkpack_rust_reference_run == 'true'
        run: >-
          python3 scripts/ci/run_with_annotation.py
          --title "SnarkPack slow interoperability suite"
          -- nix develop --command just snarkpack-slow
      - name: Install exact cargo-fuzz
        if: >-
          needs.applicability.outputs.snarkpack_fuzz_run == 'true'
        run: |
          rustup toolchain install "$SNARKPACK_FUZZ_TOOLCHAIN" --profile minimal
          cargo +"$SNARKPACK_FUZZ_TOOLCHAIN" install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      - name: Run fuzz smoke
        if: >-
          needs.applicability.outputs.snarkpack_fuzz_run == 'true'
        env:
          SNARKPACK_FUZZ_RUNS: ${{ (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && '256' || '16' }}
        run: >-
          python3 scripts/ci/run_with_annotation.py
          --title "SnarkPack fuzz"
          -- nix develop --command just snarkpack-fuzz-smoke
      - name: Run DoS thresholds
        if: >-
          needs.applicability.outputs.snarkpack_dos_run == 'true'
        run: >-
          python3 scripts/ci/run_with_annotation.py
          --title "SnarkPack DoS"
          -- nix develop --command just snarkpack-dos-gate
      - name: Materialize successful runtime attestation
        shell: bash
        env:
          CURRENT_SHA256: ${{ needs.applicability.outputs.snarkpack_runtime_fingerprint }}
        run: |
          set -euo pipefail
          cache_dir=".ci-cache/snarkpack-runtime-pass"
          mkdir -p "$cache_dir"
          printf '%s\n' "$CURRENT_SHA256" > "$cache_dir/sha256"
      - name: Save exact successful runtime attestation
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache/snarkpack-runtime-pass
          key: snarkpack-runtime-pass-v2-${{ runner.os }}-${{ needs.applicability.outputs.snarkpack_runtime_fingerprint }}

  # Publication runs after every selected compute lane and accepts committed
  # evidence only. Lean evidence was already validated in the static job.
  snarkpack-publication:
    name: 'snarkpack: publication closure'
    if: >-
      always() &&
      needs.applicability.result == 'success' &&
      needs.applicability.outputs.snarkpack_status == 'run' &&
      needs.snarkpack-static.result == 'success' &&
      (
        needs.applicability.outputs.snarkpack_extract_run != 'true' ||
        needs.applicability.outputs.snarkpack_extract_cache_hit == 'true' ||
        needs.snarkpack-extract.result == 'success'
      ) &&
      (
        needs.applicability.outputs.snarkpack_fstar_run != 'true' ||
        needs.applicability.outputs.snarkpack_fstar_cache_hit == 'true' ||
        needs.snarkpack-fstar.result == 'success'
      ) &&
      (
        needs.applicability.outputs.snarkpack_parity_run != 'true' ||
        needs.applicability.outputs.snarkpack_parity_cache_hit == 'true' ||
        needs.snarkpack-parity.result == 'success'
      ) &&
      (
        (
          needs.applicability.outputs.snarkpack_rust_reference_run != 'true' &&
          needs.applicability.outputs.snarkpack_fuzz_run != 'true' &&
          needs.applicability.outputs.snarkpack_dos_run != 'true'
        ) ||
        needs.applicability.outputs.snarkpack_runtime_cache_hit == 'true' ||
        needs.snarkpack-runtime.result == 'success'
      )
    needs:
      - applicability
      - snarkpack-static
      - snarkpack-extract
      - snarkpack-fstar
      - snarkpack-parity
      - snarkpack-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
      - name: Require closed committed SnarkPack evidence
        env:
          SNARKPACK_FV_MODE: publication
        run: >-
          python3 scripts/ci/run_with_annotation.py
          --title "SnarkPack publication closure"
          -- bash scripts/snarkpack-fv.sh

  # ---------------------------------------------------------------- soundness

  soundness-policy:
    name: 'soundness: policy'
    needs: applicability
    if: >-
      needs.applicability.result == 'success' &&
      needs.applicability.outputs.soundness_run == 'true' &&
      needs.applicability.outputs.soundness_tier == 'policy'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
      - name: Validate formal applicability and artifact policy
        run: |
          python3 scripts/ci/test_gate_applicability.py
          python3 scripts/tests/test_proof_artifacts.py
          python3 scripts/check_lfs_policy.py

  soundness-gate:
    name: 'soundness: gate'
    needs: applicability
    if: >-
      needs.applicability.result == 'success' &&
      needs.applicability.outputs.soundness_run == 'true' &&
      needs.applicability.outputs.soundness_tier != 'policy'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
      - uses: ./.github/actions/materialize-proof-artifacts
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check soundness invariants
        run: bash scripts/check-soundness-invariants.sh candidate

  soundness-seam-and-pin:
    name: 'soundness: seam-and-pin'
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.soundness_run == 'true' && needs.applicability.outputs.soundness_tier != 'policy'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: tools/gnark/go.mod
          cache-dependency-path: tools/gnark/go.sum
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: ./.github/actions/materialize-proof-artifacts
      - name: Statement-field seam and parity
        working-directory: tools/gnark
        run: |
          go test ./internal/abi/ -run TestRustGoStatementFieldDifferential -count=1
          go test ./internal/primitives/ -run TestNoteReshapeStatementSeamsMatchShielddVectors -count=1
      - name: Manifest pin
        run: bash scripts/check-manifest-pin.sh
      - name: DLEQ Lean stamps
        run: bash scripts/compliance-lean-dleq.sh stamps

  soundness-alloy:
    name: 'soundness: alloy'
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.soundness_run == 'true' && needs.applicability.outputs.soundness_tier != 'policy' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache: "false"
      - name: Run compliance Alloy outcome gate
        run: nix shell nixpkgs#alloy6 --command bash scripts/compliance-alloy.sh

  soundness-artifact-replay:
    name: 'soundness: artifact replay'
    needs: applicability
    # Candidate events validate committed evidence. Manual runs also
    # regenerate every artifact and prove/verify every deployed circuit. Lean
    # kernel replay remains the local operation that creates that evidence.
    if: >-
      needs.applicability.result == 'success' &&
      needs.applicability.outputs.soundness_run == 'true' &&
      needs.applicability.outputs.soundness_tier == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/mizufinance/shieldd-fv-toolchain@sha256:29488637fce71c867d9f6ffd8c5bdc825c80f55d675238bcdfbfe878be11d96c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      - uses: ./.github/actions/materialize-proof-artifacts
      - name: Cache Go build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-fv-${{ hashFiles('tools/gnark/go.sum') }}
          restore-keys: |
            go-fv-
      - name: Regenerate formal artifacts and verify deployed proofs
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-lean-circuit-fv.sh drift all
          bash scripts/check-circuit-fv.sh receipt all

  # ------------------------------------------------------------------ summary

  summary:
    name: 'formal: summary'
    if: always()
    needs:
      - applicability
      - snarkpack-static
      - snarkpack-extract
      - snarkpack-fstar
      - snarkpack-parity
      - snarkpack-runtime
      - snarkpack-publication
      - soundness-policy
      - soundness-gate
      - soundness-seam-and-pin
      - soundness-alloy
      - soundness-artifact-replay
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
      # Fail closed over both sides of the impact decision: every selected lane
      # must succeed and every unselected lane must report `skipped`. This makes
      # an accidentally broadened or broken job `if:` visible in the summary.
      - name: Enforce the formal result contract
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          APPLICABILITY: ${{ needs.applicability.result }}
          SNARKPACK_STATUS: ${{ needs.applicability.outputs.snarkpack_status }}
          SNARKPACK_TIER: ${{ needs.applicability.outputs.snarkpack_tier }}
          SNARKPACK_EXPLANATION: ${{ needs.applicability.outputs.snarkpack_explanation }}
          STATIC_RUN: ${{ needs.applicability.outputs.snarkpack_static_run }}
          EXTRACT_RUN: ${{ needs.applicability.outputs.snarkpack_extract_run }}
          EXTRACT_CACHE_HIT: ${{ needs.applicability.outputs.snarkpack_extract_cache_hit }}
          SNARKPACK_LEAN_RUN: ${{ needs.applicability.outputs.snarkpack_lean_run }}
          FSTAR_RUN: ${{ needs.applicability.outputs.snarkpack_fstar_run }}
          FSTAR_FORCE_ALL: ${{ needs.applicability.outputs.snarkpack_fstar_force_all }}
          FSTAR_CACHE_HIT: ${{ needs.applicability.outputs.snarkpack_fstar_cache_hit }}
          PARITY_RUN: ${{ needs.applicability.outputs.snarkpack_parity_run }}
          PARITY_CACHE_HIT: ${{ needs.applicability.outputs.snarkpack_parity_cache_hit }}
          RUST_REFERENCE_RUN: ${{ needs.applicability.outputs.snarkpack_rust_reference_run }}
          FUZZ_RUN: ${{ needs.applicability.outputs.snarkpack_fuzz_run }}
          DOS_RUN: ${{ needs.applicability.outputs.snarkpack_dos_run }}
          RUNTIME_CACHE_HIT: ${{ needs.applicability.outputs.snarkpack_runtime_cache_hit }}
          SOUNDNESS_STATUS: ${{ needs.applicability.outputs.soundness_status }}
          SOUNDNESS_TIER: ${{ needs.applicability.outputs.soundness_tier }}
          SOUNDNESS_EXPLANATION: ${{ needs.applicability.outputs.soundness_explanation }}
          STATIC: ${{ needs.snarkpack-static.result }}
          EXTRACT: ${{ needs.snarkpack-extract.result }}
          FSTAR: ${{ needs.snarkpack-fstar.result }}
          PARITY: ${{ needs.snarkpack-parity.result }}
          RUNTIME: ${{ needs.snarkpack-runtime.result }}
          PUBLICATION: ${{ needs.snarkpack-publication.result }}
          POLICY: ${{ needs.soundness-policy.result }}
          GATE: ${{ needs.soundness-gate.result }}
          SEAM: ${{ needs.soundness-seam-and-pin.result }}
          ALLOY: ${{ needs.soundness-alloy.result }}
          REPLAY: ${{ needs.soundness-artifact-replay.result }}
        run: python3 scripts/ci/enforce_formal_result.py
