        run: >-
          python3 scripts/ci/run_with_annotation.py
          --title "SnarkPack fuzz"
          -- nix develop --command just snarkpack-fuzz-smoke
      - name: Materialize successful fuzz attestation
        if: steps.fuzz_check.outcome == 'success'
        shell: bash
        env:
