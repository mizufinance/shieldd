        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/snarkpack-fuzz-pass"
          mkdir -p "$cache_dir"
          printf '%s\n' "$CURRENT_SHA256" > "$cache_dir/sha256"
      - name: Save exact successful fuzz attestation
        if: steps.fuzz_check.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/snarkpack-fuzz-pass
          key: snarkpack-fuzz-pass-v1-${{ runner.os }}-${{ steps.fuzz_fingerprint.outputs.sha256 }}

  snarkpack-dos:
    name: 'snarkpack: dos'
    needs: applicability
    if: >-
      needs.applicability.result == 'success' &&
      needs.applicability.outputs.snarkpack_dos_run == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
      - name: Fingerprint exact DoS lane inputs
        id: dos_fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/snarkpack_lane_fingerprint.py \
            --lane dos \
            --github-output "$GITHUB_OUTPUT"
      - name: Restore exact successful DoS attestation
        id: dos_pass_cache
        if: needs.applicability.outputs.snarkpack_fstar_force_all != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/snarkpack-dos-pass
          key: snarkpack-dos-pass-v1-${{ runner.os }}-${{ steps.dos_fingerprint.outputs.sha256 }}
      - name: Validate restored DoS attestation
        if: steps.dos_pass_cache.outputs.cache-hit == 'true'
        shell: bash
        env:
          EXPECTED_SHA256: ${{ steps.dos_fingerprint.outputs.sha256 }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/snarkpack-dos-pass/sha256"
          [[ -f "$marker" ]] || {
            echo "restored DoS attestation has no marker" >&2
            exit 1
          }
          [[ "$(cat "$marker")" == "$EXPECTED_SHA256" ]] || {
            echo "restored DoS attestation does not match current inputs" >&2
            exit 1
          }
      - uses: ./.github/actions/setup-nix-rust
        if: steps.dos_pass_cache.outputs.cache-hit != 'true'
        with:
          rust-cache-prefix: snarkpack-dos
      - name: Run DoS thresholds
        id: dos_check
        if: steps.dos_pass_cache.outputs.cache-hit != 'true'
        run: >-
          python3 scripts/ci/run_with_annotation.py
          --title "SnarkPack DoS"
          -- nix develop --command just snarkpack-dos-gate
      - name: Materialize successful DoS attestation
        if: steps.dos_check.outcome == 'success'
        shell: bash
        env:
          CURRENT_SHA256: ${{ steps.dos_fingerprint.outputs.sha256 }}
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/snarkpack-dos-pass"
          mkdir -p "$cache_dir"
          printf '%s\n' "$CURRENT_SHA256" > "$cache_dir/sha256"
      - name: Save exact successful DoS attestation
        if: steps.dos_check.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/snarkpack-dos-pass
          key: snarkpack-dos-pass-v1-${{ runner.os }}-${{ steps.dos_fingerprint.outputs.sha256 }}

  # ---------------------------------------------------------------- soundness

  soundness-gate:
    name: 'soundness: gate'
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.soundness_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check soundness invariants
        run: bash scripts/check-soundness-invariants.sh
      - name: Check DLEQ Lean stamps
        run: bash scripts/compliance-lean-dleq.sh stamps

  soundness-seam-and-pin:
    name: 'soundness: seam-and-pin'
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.soundness_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
          lfs: true
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: tools/gnark/go.mod
          cache-dependency-path: tools/gnark/go.sum
      - name: Statement-field seam and parity
        working-directory: tools/gnark
        run: |
          go test ./internal/abi/ -run TestRustGoStatementFieldDifferential -count=1
          go test ./internal/primitives/ -run TestNoteReshapeStatementSeamsMatchShielddVectors -count=1
      - name: Manifest pin
        run: bash scripts/check-manifest-pin.sh

  soundness-vk-derivation:
    name: 'soundness: vk-derivation'
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.soundness_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
          lfs: true
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: tools/gnark/go.mod
          cache-dependency-path: tools/gnark/go.sum
      # One job, not a 2-way matrix: each circuit takes ~1 min, so a second
      # runner and Go toolchain setup cost more than running them in sequence.
      - name: VK derivation pinning
        shell: bash
        run: |
          set -euo pipefail
          for circuit in note_reshape2x1 transfer; do
            echo "::group::vk-derivation $circuit"
            bash scripts/check-vk-derivation.sh "$circuit"
            echo "::endgroup::"
          done

  soundness-alloy:
    name: 'soundness: alloy'
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.soundness_run == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache: "false"
      - name: Run compliance Alloy outcome gate
        run: nix shell nixpkgs#alloy6 --command bash scripts/compliance-alloy.sh

  soundness-lean-circuit-fv:
    name: 'soundness: lean-circuit-fv'
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.soundness_run == 'true'
    runs-on: ${{ needs.applicability.outputs.soundness_tier == 'stamps' && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 50
    container:
      image: ghcr.io/mizufinance/shieldd-fv-toolchain@sha256:4bdec94eb778ca2ae549ba75de18b44a822f5460f608d7facc911382f08e88aa
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.applicability.outputs.candidate_sha }}
          lfs: true
      - name: Cache Lean dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/mathlib
            tools/gnark/lean/.lake/packages
          key: lean-fv-${{ hashFiles('tools/gnark/lean/lean-toolchain', 'tools/gnark/lean/lake-manifest.json') }}
          restore-keys: |
            lean-fv-
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      - name: Cache Go build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-fv-${{ hashFiles('tools/gnark/go.sum') }}
          restore-keys: |
            go-fv-
      # dev replaced the script's `stamps|full` modes with `drift|typed|release`
      # plus a family list. Map the applicability tier onto that interface here
      # rather than passing the tier through, so an unrecognised tier fails loudly
      # instead of reaching the script as an unknown mode.
      - name: Run whole-circuit FV tier
        shell: bash
        env:
          TIER: ${{ needs.applicability.outputs.soundness_tier }}
        run: |
          set -euo pipefail
          case "$TIER" in
            stamps) bash scripts/check-lean-circuit-fv.sh drift all ;;
            full)   bash scripts/check-lean-circuit-fv.sh release all ;;
            *)
              echo "unsupported soundness tier: $TIER" >&2
              exit 1
              ;;
          esac

  # ------------------------------------------------------------------ summary

  summary:
    name: 'formal: summary'
    if: always()
    needs:
      - applicability
      - snarkpack-static
      - snarkpack-extract
      - snarkpack-extraction-recovery
      - snarkpack-lean
      - snarkpack-fstar
      - snarkpack-parity
      - snarkpack-rust-reference
      - snarkpack-slow
      - snarkpack-fuzz
      - snarkpack-dos
      - soundness-gate
      - soundness-seam-and-pin
      - soundness-vk-derivation
      - soundness-alloy
      - soundness-lean-circuit-fv
    runs-on: ubuntu-24.04
    steps:
      # Asserts only what the job `if:` conditions cannot already guarantee:
      # that each gate produced a tier we understand, and that the lanes that
      # tier selects succeeded. Asserting the complement (that unselected lanes
      # report `skipped`) would just restate those `if:`s.
      - name: Enforce the formal result contract
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          APPLICABILITY: ${{ needs.applicability.result }}
          SNARKPACK_STATUS: ${{ needs.applicability.outputs.snarkpack_status }}
          SNARKPACK_TIER: ${{ needs.applicability.outputs.snarkpack_tier }}
          SNARKPACK_EXPLANATION: ${{ needs.applicability.outputs.snarkpack_explanation }}
          STATIC_RUN: ${{ needs.applicability.outputs.snarkpack_static_run }}
          EXTRACT_RUN: ${{ needs.applicability.outputs.snarkpack_extract_run }}
          SNARKPACK_LEAN_RUN: ${{ needs.applicability.outputs.snarkpack_lean_run }}
          FSTAR_RUN: ${{ needs.applicability.outputs.snarkpack_fstar_run }}
          PARITY_RUN: ${{ needs.applicability.outputs.snarkpack_parity_run }}
          RUST_REFERENCE_RUN: ${{ needs.applicability.outputs.snarkpack_rust_reference_run }}
          FUZZ_RUN: ${{ needs.applicability.outputs.snarkpack_fuzz_run }}
          DOS_RUN: ${{ needs.applicability.outputs.snarkpack_dos_run }}
          SOUNDNESS_STATUS: ${{ needs.applicability.outputs.soundness_status }}
          SOUNDNESS_TIER: ${{ needs.applicability.outputs.soundness_tier }}
          SOUNDNESS_EXPLANATION: ${{ needs.applicability.outputs.soundness_explanation }}
          STATIC: ${{ needs.snarkpack-static.result }}
          EXTRACT: ${{ needs.snarkpack-extract.result }}
          SNARKPACK_LEAN: ${{ needs.snarkpack-lean.result }}
          FSTAR: ${{ needs.snarkpack-fstar.result }}
          PARITY: ${{ needs.snarkpack-parity.result }}
          RUST_REFERENCE: ${{ needs.snarkpack-rust-reference.result }}
          SLOW: ${{ needs.snarkpack-slow.result }}
          FUZZ: ${{ needs.snarkpack-fuzz.result }}
          DOS: ${{ needs.snarkpack-dos.result }}
          GATE: ${{ needs.soundness-gate.result }}
          SEAM: ${{ needs.soundness-seam-and-pin.result }}
          VK: ${{ needs.soundness-vk-derivation.result }}
          ALLOY: ${{ needs.soundness-alloy.result }}
          LEAN: ${{ needs.soundness-lean-circuit-fv.result }}
        run: python3 scripts/ci/enforce_formal_result.py
