      - name: Restore exact successful fuzz attestation
        id: fuzz_pass_cache
        if: needs.applicability.outputs.snarkpack_fstar_force_all != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/snarkpack-fuzz-pass
          key: snarkpack-fuzz-pass-v1-${{ runner.os }}-${{ steps.fuzz_fingerprint.outputs.sha256 }}
      - name: Validate restored fuzz attestation
        if: steps.fuzz_pass_cache.outputs.cache-hit == 'true'
        shell: bash
        env:
          EXPECTED_SHA256: ${{ steps.fuzz_fingerprint.outputs.sha256 }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/snarkpack-fuzz-pass/sha256"
          [[ -f "$marker" ]] || {
