name: formal

# One category, many lanes — the shape orbis-integration already uses.
#
# snarkpack-formal and soundness-formal were separate workflows, so each paid
# its own applicability + summary tax and duplicated the classifier boilerplate.
# They verify the same tree on the same events, so they are one gate with two
# families of lanes: `snarkpack: *` and `soundness: *`.
#
# The scheduled-only provers live in soundness-provers.yml, which has no
# pull_request trigger, so they never appear as skipped checks here.

on:
  workflow_call:
    inputs:
      target_ref:
        description: Branch whose committed state is the reusable-run candidate.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch whose committed state is the manual-run candidate.
        required: true
        type: choice
        default: dev
        options:
          - dev
          - main
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.target_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CANDIDATE_REF: ${{ (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch') && inputs.target_ref || '' }}
  SNARKPACK_FUZZ_TOOLCHAIN: nightly-2025-09-30
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  applicability:
    name: 'formal: applicability'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: stable
    outputs:
      snarkpack_status: ${{ steps.snarkpack.outputs.status }}
      snarkpack_tier: ${{ steps.snarkpack.outputs.tier }}
      snarkpack_run: ${{ steps.snarkpack.outputs.run }}
      snarkpack_explanation: ${{ steps.snarkpack.outputs.explanation }}
      snarkpack_graphs: ${{ steps.snarkpack.outputs.graphs }}
      soundness_status: ${{ steps.soundness.outputs.status }}
      soundness_tier: ${{ steps.soundness.outputs.tier }}
      soundness_run: ${{ steps.soundness.outputs.run }}
      soundness_explanation: ${{ steps.soundness.outputs.explanation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 0
      # GITHUB_OUTPUT is per-step, so both classifications can write `tier`
      # without colliding; they are read back as steps.<id>.outputs.tier.
      - name: Classify snarkpack applicability
        id: snarkpack
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: |
          set -euo pipefail
          args=(
            --gate snarkpack-formal
            --event "$GITHUB_EVENT_NAME"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ -n "$BASE_SHA" ]]; then
            args+=(--base "$BASE_SHA")
          fi
          python3 scripts/ci/gate-applicability.py "${args[@]}"
      - name: Classify soundness applicability
        id: soundness
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: |
          set -euo pipefail
          args=(
            --gate soundness-formal
            --event "$GITHUB_EVENT_NAME"
            --head "$GITHUB_SHA"
            --github-output "$GITHUB_OUTPUT"
            --pretty
          )
          if [[ -n "$BASE_SHA" ]]; then
            args+=(--base "$BASE_SHA")
          fi
          python3 scripts/ci/gate-applicability.py "${args[@]}"

  # ---------------------------------------------------------------- snarkpack

  snarkpack-static:
    name: 'snarkpack: static'
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.snarkpack_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          lfs: true
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache-prefix: snarkpack-static
      - name: Run static FV invariants
        env:
          SNARKPACK_FV_MODE: static
        run: nix develop --command just snarkpack-fv

  # Extraction lanes only. The F* gate deliberately does NOT run here: this
  # image pins hax at c8e27c5945 for the aeneas-lean backend's `--lakefile`
  # support, while formal/snarkpack/toolchain.toml pins hax v0.3.7 (an older
  # tag) for the F* proofs. Those two versions genuinely disagree, and before
  # the lanes were folded into one container they lived in separate
  # environments. `snarkpack-fstar` below restores that separation.
  snarkpack-toolchain:
    name: 'snarkpack: toolchain (${{ matrix.lane }})'
    needs: applicability
    if: >-
      needs.applicability.result == 'success' &&
      needs.applicability.outputs.snarkpack_run == 'true' &&
      needs.applicability.outputs.snarkpack_tier != 'static'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.applicability.outputs.snarkpack_tier == 'full' && '["extract","lean"]' || '["extract"]') }}
    container:
      # Built by snarkpack-fv-toolchain-image.yml, which prints this digest in
      # its run summary. Repin here whenever that workflow publishes a new one.
      image: ghcr.io/mizufinance/shieldd-snarkpack-fv-toolchain@sha256:63fb57a0c07de6c4a3ded67410b26a2804d090a3ae51929708c8e4650a686282
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          lfs: true
      # actions/checkout adds safe.directory under a *temporary* HOME and then
      # restores it, so the exemption is gone by the time a step shells out to
      # git. This container runs as root while the workspace is owned by the
      # runner uid, so extractions.py's `git rev-parse` fails with exit 128 on
      # dubious ownership.
      - name: Trust the workspace inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Restore Lean build cache
        if: matrix.lane == 'lean'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: crates/crypto/proof-aggregation/formal/lean-ipp/.lake
          key: lean-ipp-${{ hashFiles('crates/crypto/proof-aggregation/formal/lean-ipp/**/*.lean', 'crates/crypto/proof-aggregation/formal/lean-ipp/lake-manifest.json', 'crates/crypto/proof-aggregation/formal/lean-ipp/lean-toolchain') }}
      - name: Run toolchain lane
        shell: bash
        env:
          APPLICABILITY_TIER: ${{ needs.applicability.outputs.snarkpack_tier }}
          LANE: ${{ matrix.lane }}
          SNARKPACK_FV_GRAPHS_JSON: ${{ needs.applicability.outputs.snarkpack_graphs }}
        run: |
          set -euo pipefail
          case "$LANE" in
            extract)
              export SNARKPACK_FV_MODE="$(
                [[ "$APPLICABILITY_TIER" == extract-changed ]] &&
                  echo extract-changed || echo extract-all
              )"
              just snarkpack-fv
              ;;
            lean)
              export LEAN_NUM_THREADS=1
              export SNARKPACK_FV_MODE=lean
              just snarkpack-fv
              ;;
            *)
              echo "unsupported toolchain lane: $LANE" >&2
              exit 1
              ;;
          esac

  # Runs outside the FV toolchain image on purpose — see snarkpack-toolchain.
  # snarkpack-formal.sh re-checks every version it is given against
  # formal/snarkpack/toolchain.toml, so a drifted pin here fails loudly.
  snarkpack-fstar:
    name: 'snarkpack: fstar'
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.snarkpack_run == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache-prefix: snarkpack-formal
      - name: Install pinned Z3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/opt"
          curl -fsSL -o /tmp/z3.zip \
            https://github.com/Z3Prover/z3/releases/download/z3-4.14.1/z3-4.14.1-x64-glibc-2.35.zip
          unzip -q /tmp/z3.zip -d "$HOME/.local/opt"
          echo "$HOME/.local/opt/z3-4.14.1-x64-glibc-2.35/bin" >> "$GITHUB_PATH"
      - name: Install pinned F*
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/opt"
          curl -fsSL -o /tmp/fstar.tar.gz \
            https://github.com/FStarLang/FStar/releases/download/v2026.05.24/fstar-v2026.05.24-Linux-x86_64.tar.gz
          tar -xzf /tmp/fstar.tar.gz -C "$HOME/.local/opt"
          echo "$HOME/.local/opt/fstar/bin" >> "$GITHUB_PATH"
      - name: Install pinned hax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/opt"
          hax_dir="$HOME/.local/opt/hax-v0.3.7"
          git clone --depth 1 --branch hax-lib-v0.3.7 https://github.com/cryspen/hax "$hax_dir"
          nix profile install "$hax_dir#hax" "$hax_dir#hax-engine"
          echo "HAX_PROOF_LIBS_HOME=$hax_dir/hax-lib/proof-libs/fstar" >> "$GITHUB_ENV"
      - name: Run SnarkPack F* gate
        run: nix develop --command just snarkpack-formal

  snarkpack-parity:
    name: 'snarkpack: parity'
    needs: applicability
    if: >-
      needs.applicability.result == 'success' &&
      needs.applicability.outputs.snarkpack_run == 'true' &&
      contains(fromJSON('["extract-changed","extract-all","full"]'), needs.applicability.outputs.snarkpack_tier)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          lfs: true
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache-prefix: snarkpack-parity
      - name: Run Rust/reference parity once
        env:
          SNARKPACK_FV_MODE: ${{ needs.applicability.outputs.snarkpack_tier == 'extract-changed' && 'parity-changed' || 'parity-all' }}
          SNARKPACK_FV_GRAPHS_JSON: ${{ needs.applicability.outputs.snarkpack_graphs }}
        run: nix develop --command just snarkpack-fv

  snarkpack-fuzz:
    name: 'snarkpack: fuzz'
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.snarkpack_run == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache-prefix: snarkpack-fuzz
      - name: Install exact cargo-fuzz
        run: |
          rustup toolchain install "$SNARKPACK_FUZZ_TOOLCHAIN" --profile minimal
          cargo +"$SNARKPACK_FUZZ_TOOLCHAIN" install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      - name: Run fuzz smoke
        env:
          SNARKPACK_FUZZ_RUNS: ${{ (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && '256' || '16' }}
        run: nix develop --command just snarkpack-fuzz-smoke

  snarkpack-dos:
    name: 'snarkpack: dos'
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.snarkpack_run == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache-prefix: snarkpack-dos
      - name: Run DoS thresholds
        run: nix develop --command just snarkpack-dos-gate

  # ---------------------------------------------------------------- soundness

  soundness-gate:
    name: 'soundness: gate'
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.soundness_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check soundness invariants
        run: bash scripts/check-soundness-invariants.sh
      - name: Check DLEQ Lean stamps
        run: bash scripts/compliance-lean-dleq.sh stamps

  soundness-seam-and-pin:
    name: 'soundness: seam-and-pin'
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.soundness_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          lfs: true
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: tools/gnark/go.mod
          cache-dependency-path: tools/gnark/go.sum
      - name: Statement-field seam and parity
        working-directory: tools/gnark
        run: |
          go test ./internal/abi/ -run TestRustGoStatementFieldDifferential -count=1
          go test ./internal/primitives/ -run TestNoteReshapeStatementSeamsMatchShielddVectors -count=1
      - name: Manifest pin
        run: bash scripts/check-manifest-pin.sh

  soundness-key-coherence:
    name: 'soundness: key coherence'
    needs: applicability
    # The full whole-circuit lane emits and validates the same deployed-key
    # proof receipts for all certified and candidate profiles. Keep this
    # standalone round trip only for stamps/typed runs, where the whole-circuit
    # lane deliberately does not prove.
    if: >-
      needs.applicability.result == 'success' &&
      needs.applicability.outputs.soundness_run == 'true' &&
      needs.applicability.outputs.soundness_tier != 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          lfs: true
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: tools/gnark/go.mod
          cache-dependency-path: tools/gnark/go.sum
      # Run serially so each deployed key is exercised against the exact
      # source-compiled circuit without multiplying peak memory.
      - name: Exact SR1CS and multi-branch key coherence
        shell: bash
        run: bash scripts/check-circuit-fv.sh receipt all

  soundness-alloy:
    name: 'soundness: alloy'
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.soundness_run == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache: "false"
      - name: Run compliance Alloy outcome gate
        run: nix shell nixpkgs#alloy6 --command bash scripts/compliance-alloy.sh

  soundness-lean-circuit-fv:
    name: 'soundness: lean-circuit-fv'
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.soundness_run == 'true'
    runs-on: ${{ needs.applicability.outputs.soundness_tier == 'stamps' && 'ubuntu-24.04' || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 50
    container:
      image: ghcr.io/mizufinance/shieldd-fv-toolchain@sha256:4bdec94eb778ca2ae549ba75de18b44a822f5460f608d7facc911382f08e88aa
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          lfs: true
      - name: Cache Lean dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/mathlib
            tools/gnark/lean/.lake/packages
          key: lean-fv-${{ hashFiles('tools/gnark/lean/lean-toolchain', 'tools/gnark/lean/lake-manifest.json') }}
          restore-keys: |
            lean-fv-
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      - name: Cache Go build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-fv-${{ hashFiles('tools/gnark/go.sum') }}
          restore-keys: |
            go-fv-
      # Handwritten NoteReshape proof changes are typechecked on pull requests;
      # deployed-key proving remains a merge/release check.
      - name: Run whole-circuit FV tier
        shell: bash
        env:
          TIER: ${{ needs.applicability.outputs.soundness_tier }}
        run: |
          set -euo pipefail
          case "$TIER" in
            stamps)
              bash scripts/check-lean-circuit-fv.sh drift all
              bash scripts/check-circuit-fv.sh drift --status candidate
              ;;
            typed)
              bash scripts/check-lean-circuit-fv.sh typed all
              bash scripts/check-circuit-fv.sh drift --status candidate
              ;;
            full)
              bash scripts/check-lean-circuit-fv.sh release all
              bash scripts/check-circuit-fv.sh receipt --status candidate
              ;;
            *)
              echo "unsupported soundness tier: $TIER" >&2
              exit 1
              ;;
          esac

  # ------------------------------------------------------------------ summary

  summary:
    name: 'formal: summary'
    if: always()
    needs:
      - applicability
      - snarkpack-static
      - snarkpack-toolchain
      - snarkpack-fstar
      - snarkpack-parity
      - snarkpack-fuzz
      - snarkpack-dos
      - soundness-gate
      - soundness-seam-and-pin
      - soundness-key-coherence
      - soundness-alloy
      - soundness-lean-circuit-fv
    runs-on: ubuntu-24.04
    steps:
      # Asserts only what the job `if:` conditions cannot already guarantee:
      # that each gate produced a tier we understand, and that the lanes that
      # tier selects succeeded. Asserting the complement (that unselected lanes
      # report `skipped`) would just restate those `if:`s.
      - name: Enforce the formal result contract
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          APPLICABILITY: ${{ needs.applicability.result }}
          SNARKPACK_STATUS: ${{ needs.applicability.outputs.snarkpack_status }}
          SNARKPACK_TIER: ${{ needs.applicability.outputs.snarkpack_tier }}
          SNARKPACK_EXPLANATION: ${{ needs.applicability.outputs.snarkpack_explanation }}
          SOUNDNESS_STATUS: ${{ needs.applicability.outputs.soundness_status }}
          SOUNDNESS_TIER: ${{ needs.applicability.outputs.soundness_tier }}
          SOUNDNESS_EXPLANATION: ${{ needs.applicability.outputs.soundness_explanation }}
          STATIC: ${{ needs.snarkpack-static.result }}
          TOOLCHAIN: ${{ needs.snarkpack-toolchain.result }}
          FSTAR: ${{ needs.snarkpack-fstar.result }}
          PARITY: ${{ needs.snarkpack-parity.result }}
          FUZZ: ${{ needs.snarkpack-fuzz.result }}
          DOS: ${{ needs.snarkpack-dos.result }}
          GATE: ${{ needs.soundness-gate.result }}
          SEAM: ${{ needs.soundness-seam-and-pin.result }}
          KEY_COHERENCE: ${{ needs.soundness-key-coherence.result }}
          ALLOY: ${{ needs.soundness-alloy.result }}
          LEAN: ${{ needs.soundness-lean-circuit-fv.result }}
        run: |
          set -euo pipefail
          if [[ "$APPLICABILITY" != success ]]; then
            echo "applicability classification failed: $APPLICABILITY" >&2
            exit 1
          fi

          required=()

          # --- snarkpack ---
          if [[ "$SNARKPACK_STATUS" == block ]]; then
            echo "snarkpack applicability blocked: $SNARKPACK_EXPLANATION" >&2
            exit 1
          elif [[ "$SNARKPACK_STATUS" == skip ]]; then
            echo "snarkpack explained skip: $SNARKPACK_EXPLANATION"
          else
            required+=(
              "snarkpack-static=$STATIC" "snarkpack-fstar=$FSTAR"
              "snarkpack-fuzz=$FUZZ" "snarkpack-dos=$DOS"
            )
            case "$SNARKPACK_TIER" in
              # static carries no extraction, so the toolchain lanes do not run
              static) ;;
              extract-changed|extract-all|full)
                required+=(
                  "snarkpack-toolchain=$TOOLCHAIN" "snarkpack-parity=$PARITY"
                ) ;;
              *)
                echo "unsupported snarkpack tier: $SNARKPACK_TIER" >&2
                exit 1
                ;;
            esac
          fi

          # --- soundness ---
          if [[ "$SOUNDNESS_STATUS" == block ]]; then
            echo "soundness applicability blocked: $SOUNDNESS_EXPLANATION" >&2
            exit 1
          elif [[ "$SOUNDNESS_STATUS" == skip ]]; then
            echo "soundness explained skip: $SOUNDNESS_EXPLANATION"
          else
            required+=(
              "soundness-gate=$GATE" "soundness-seam-and-pin=$SEAM"
              "soundness-lean-circuit-fv=$LEAN"
            )
            # stamps/typed need the standalone deployed-key round trip. Full
            # obtains equivalent schema-v4, branch-labelled proof receipts for
            # every canonical proof case inside the terminal whole-circuit
            # lane, so rerunning it here only doubles proving cost.
            if [[ "$SOUNDNESS_TIER" != full ]]; then
              required+=("soundness-key-coherence=$KEY_COHERENCE")
            fi
            # alloy runs only on candidate events; the scheduled path covers the
            # same gate inside soundness-provers' tamarin-alloy lane.
            if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == merge_group ]]; then
              required+=("soundness-alloy=$ALLOY")
            fi
          fi

          for entry in "${required[@]}"; do
            if [[ "${entry#*=}" != success ]]; then
              echo "required job failed: $entry" >&2
              exit 1
            fi
          done
          echo "formal passed (snarkpack=$SNARKPACK_TIER soundness=$SOUNDNESS_TIER)"
