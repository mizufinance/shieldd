---
name: containers
on:
  push:
    branches:
      - main
      - dev
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_call:
  workflow_dispatch:

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mizufinance/shieldd

jobs:
  proof-artifacts:
    name: Prepare proof artifacts once
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/prepare-proof-artifacts
        with:
          # Seed a missing full base-branch cache for PR formal jobs without
          # restoring its 510 MB constraint subset on every container build.
          seed-full: ${{ github.ref_type == 'branch' && 'true' || 'false' }}

  build_amd64:
    name: Build and Push AMD64 Image
    runs-on: ubuntu-latest
    needs: proof-artifacts
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/restore-proof-artifacts

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push AMD64 image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deployments/containerfiles/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-amd64
          platforms: linux/amd64
          provenance: false
          # Per-arch GHA layer cache so unchanged base/apt/go/rustup/dep layers
          # are reused across pushes. The final `cargo build` layer still rebuilds
          # on any source change (monolithic build with no cache mount); a
          # cargo-chef restructure to cache the compile is a possible follow-up.
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

  build_arm64:
    name: Build and Push ARM64 Image
    runs-on: ubuntu-24.04-arm
    needs: proof-artifacts
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/restore-proof-artifacts

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push ARM64 image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deployments/containerfiles/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-arm64
          platforms: linux/arm64
          provenance: false
          # Per-arch GHA layer cache (separate scope from amd64 so the two arches
          # don't clobber each other). See the amd64 job for the cargo-chef note.
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

  create_manifest:
    name: Create and Push Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [build_amd64, build_arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          tags=(--tag "${image}:sha-${GITHUB_SHA}")
          alias=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            alias="${version//[^a-zA-Z0-9_.-]/-}"
            [[ -n "$alias" ]] || {
              echo "release tag does not contain an OCI-safe name" >&2
              exit 1
            }
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            alias="latest"
          elif [[ "$GITHUB_REF_NAME" == "dev" ]]; then
            alias="dev"
          fi
          if [[ -n "$alias" ]]; then
            tags+=(--tag "${image}:${alias}")
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            "$image@${{ needs.build_amd64.outputs.digest }}" \
            "$image@${{ needs.build_arm64.outputs.digest }}"
