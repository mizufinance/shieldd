name: integration
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep path classification, proof-artifact preparation, and the smoke test in
  # one workspace. This is one required check and needs no cache-only restore.
  summary:
    runs-on: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'blacksmith-16vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 90 || 120 }}
    env:
      SHIELDD_PD_GRPC_PORT: "18080"
      SHIELDD_COMETBFT_RPC_PORT: "17657"
      SHIELDD_COMETBFT_P2P_PORT: "17656"
      SHIELDD_POSTGRES_PORT: "15432"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
          fetch-depth: 0

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        if: github.event_name != 'merge_group' && github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            smoke:
              - '.github/actions/setup-nix-rust/**'
              - '.github/workflows/smoke.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/**'
              - 'deployments/**'
              - 'flake.lock'
              - 'flake.nix'
              - 'justfile'
              - 'scripts/**'
              - 'testnets/**'
              - 'tools/gnark/**'

      - name: Classify integration work
        id: classify
        shell: bash
        env:
          FORCE_RUN: ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' }}
          FILTER_RESULT: ${{ steps.filter.outcome }}
          FILTER_SMOKE: ${{ steps.filter.outputs.smoke }}
        run: |
          set -euo pipefail
          if [[ "$FORCE_RUN" == "true" || "$FILTER_SMOKE" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$FILTER_RESULT" == "success" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "path filtering failed: $FILTER_RESULT" >&2
            exit 1
          fi

      - name: Prepare proof artifacts
        id: proof_artifacts
        if: steps.classify.outputs.run == 'true'
        uses: ./.github/actions/prepare-proof-artifacts

      - name: Set up Nix and Rust
        id: setup
        if: steps.classify.outputs.run == 'true'
        uses: ./.github/actions/setup-nix-rust
        with:
          free-disk: "true"
          rust-cache-prefix: "v0-rust-smoke"

      - name: Run the smoke-test suite
        id: smoke
        if: steps.classify.outputs.run == 'true'
        run: nix develop --command just smoke

      - name: Check integration result
        if: always()
        env:
          SHOULD_RUN: ${{ steps.classify.outputs.run }}
          CLASSIFY_RESULT: ${{ steps.classify.outcome }}
          PROOF_ARTIFACTS_RESULT: ${{ steps.proof_artifacts.outcome }}
          SETUP_RESULT: ${{ steps.setup.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "integration classification failed: $CLASSIFY_RESULT" >&2
            exit 1
          fi
          if [[ "$SHOULD_RUN" == "true" ]]; then
            for step in \
              "proof-artifacts:$PROOF_ARTIFACTS_RESULT" \
              "setup:$SETUP_RESULT" \
              "smoke:$SMOKE_RESULT"
            do
              name="${step%%:*}"
              result="${step#*:}"
              if [[ "$result" != "success" ]]; then
                echo "$name did not pass: $result" >&2
                exit 1
              fi
            done
            echo "smoke passed"
          else
            if [[ "$PROOF_ARTIFACTS_RESULT" != "skipped" || "$SETUP_RESULT" != "skipped" || "$SMOKE_RESULT" != "skipped" ]]; then
              echo "unrelated changes unexpectedly ran integration work" >&2
              exit 1
            fi
            echo "smoke skipped for unrelated changes"
          fi
