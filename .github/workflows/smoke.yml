name: integration
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  # Also support ad-hoc calls for workflow.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      smoke: ${{ github.event_name == 'merge_group' && steps.merge-group.outputs.smoke || steps.filter.outputs.smoke }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        if: github.event_name != 'merge_group'
        id: filter
        with:
          filters: |
            smoke:
              - '.github/actions/setup-nix-rust/**'
              - '.github/workflows/smoke.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/**'
              - 'deployments/**'
              - 'flake.lock'
              - 'flake.nix'
              - 'justfile'
              - 'scripts/**'
              - 'testnets/**'
              - 'tools/gnark/**'

      - name: Require smoke for merge group
        if: github.event_name == 'merge_group'
        id: merge-group
        run: echo "smoke=true" >> "$GITHUB_OUTPUT"

  smoke:
    needs: paths
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || needs.paths.outputs.smoke == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'blacksmith-16vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 45 || 90 }}
    env:
      SHIELDD_PD_GRPC_PORT: "18080"
      SHIELDD_COMETBFT_RPC_PORT: "17657"
      SHIELDD_COMETBFT_P2P_PORT: "17656"
      SHIELDD_POSTGRES_PORT: "15432"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/materialize-proof-artifacts

      - uses: ./.github/actions/setup-nix-rust
        with:
          free-disk: "true"
          # bust cache with unique key; increment the integer in `^v(\d+)` to force fresh cache
          rust-cache-prefix: "v0-rust-smoke"

      - name: run the smoke-test suite
        run: nix develop --command just smoke

  summary:
    needs: [paths, smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check integration result
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHOULD_RUN: ${{ needs.paths.outputs.smoke }}
          PATHS_RESULT: ${{ needs.paths.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          if [ "$PATHS_RESULT" != "success" ]; then
            echo "path filtering failed: $PATHS_RESULT"
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "merge_group" ] || [ "$SHOULD_RUN" = "true" ]; then
            if [ "$SMOKE_RESULT" != "success" ]; then
              echo "smoke did not pass: $SMOKE_RESULT"
              exit 1
            fi
            echo "smoke passed"
          else
            echo "smoke skipped for unrelated changes"
          fi
