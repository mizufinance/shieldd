name: snarkpack-fv-toolchain-image

on:
  workflow_dispatch:
  push:
    paths:
      - 'deployments/containerfiles/Dockerfile.snarkpack-fv-toolchain'
      - '.github/workflows/snarkpack-fv-toolchain-image.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mizufinance/shieldd-snarkpack-fv-toolchain

jobs:
  build:
    name: Build and push SnarkPack FV toolchain (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deployments/containerfiles/Dockerfile.snarkpack-fv-toolchain
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=snarkpack-fv-toolchain
          cache-to: type=gha,scope=snarkpack-fv-toolchain,mode=max

      - name: Probe pushed image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker run --rm "$image" rustc --version
          docker run --rm "$image" lean --version
          docker run --rm "$image" cargo hax --version
          docker run --rm "$image" sh -c \
            'cargo hax into --help | grep -F aeneas-lean'
          docker run --rm "$image" sh -c \
            'cargo hax into aeneas-lean --help | grep -F -- --lakefile'
          docker run --rm "$image" sh -c \
            'test -x "$(command -v charon)" &&
             test -x "$(command -v charon-driver)" &&
             test -x "$(command -v aeneas)"'
          # Loads charon-driver against the rustc-dev toolchain; a plain
          # `command -v` cannot tell a working driver from an unloadable one.
          docker run --rm "$image" sh -c \
            'set -eux
             mkdir -p /tmp/probe/src && cd /tmp/probe
             printf "[package]\nname = \"probe\"\nversion = \"0.0.0\"\nedition = \"2021\"\n" > Cargo.toml
             echo "pub fn f(x: u32) -> u32 { x + 1 }" > src/lib.rs
             charon cargo --start-from crate
             test -s probe.llbc'

      - name: Report digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## SnarkPack FV toolchain image pushed"
            echo ""
            echo "Pin this digest in snarkpack-formal.yml."
            echo ""
            echo '```'
            echo "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${IMAGE_DIGEST}"
