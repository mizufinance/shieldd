name: fv-toolchain-image

# Builds and pushes the FV toolchain image consumed by soundness-formal's
# lean-circuit-fv gate. Triggered only by hand or when the toolchain Dockerfile
# changes — it must NOT depend on the jobs that consume it (no circular build).
# After a run, copy the printed digest into soundness-formal.yml's `container:`.
on:
  workflow_dispatch:
  push:
    paths:
      - 'deployments/containerfiles/Dockerfile.fv-toolchain'
      - '.github/workflows/fv-toolchain-image.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mizufinance/shieldd-fv-toolchain

jobs:
  build:
    name: Build and push FV toolchain (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deployments/containerfiles/Dockerfile.fv-toolchain
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=fv-toolchain
          cache-to: type=gha,scope=fv-toolchain,mode=max

      - name: Report digest
        run: |
          {
            echo "## FV toolchain image pushed"
            echo ""
            echo "Pin this digest in soundness-formal.yml \`container:\`"
            echo ""
            echo '```'
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${{ steps.build.outputs.digest }}"
