name: soundness-formal

on:
  workflow_dispatch:
  schedule:
    # Nightly heavy formal run: symbolic compliance, hax/F*, Picus, advisory ACL2,
    # and the Lean whole-circuit FV gate.
    - cron: '41 9 * * *'
  pull_request:
    paths:
      - '.gitignore'
      - '.github/workflows/soundness-formal.yml'
      - 'docs/soundness/**'
      - 'crates/core/component/compliance/formal/**'
      - 'crates/core/component/compliance/src/crypto.rs'
      - 'crates/core/component/compliance/src/decode_object.rs'
      - 'crates/core/component/compliance/src/r1cs.rs'
      - 'crates/core/component/shielded-pool/formal/**'
      - 'crates/core/component/shielded-pool/proofs/fstar/**'
      - 'crates/core/component/shielded-pool/src/public_input_hash.rs'
      - 'tools/gnark/go.mod'
      - 'tools/gnark/go.sum'
      - 'tools/gnark/lean/**'
      - 'tools/gnark/cmd/gnarkctl/**'
      - 'tools/gnark/artifacts/**'
      - 'tools/gnark/internal/artifacts/**'
      - 'tools/gnark/internal/circuits/**'
      - 'tools/gnark/internal/compliance/**'
      - 'tools/gnark/internal/abi/**'
      - 'tools/gnark/internal/primitives/**'
      - 'scripts/check-lean-circuit-fv.sh'
      - 'scripts/check-manifest-pin.sh'
      - 'scripts/check-soundness-invariants.sh'
      - 'scripts/compliance-symbolic.sh'
      - 'scripts/compliance-alloy.sh'
      - 'scripts/compliance-lean-dleq.sh'
      - 'scripts/shielded-pool-formal.sh'
      - 'scripts/circuit-constraint-check.sh'
      - 'scripts/circuit-gadget-proof-check.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap, deterministic gate: kind-aware ledger statuses, scope bindings,
  # and stamped-artifact references. Runs on every triggering PR.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # PR -> local ref; schedule -> dev only (halves nightly cost; change
        # lands on dev); dispatch -> both (covers pre-release main verification).
        ref: ${{ fromJSON(github.event_name == 'pull_request' && '[""]' || (github.event_name == 'schedule' && '["dev"]' || '["main", "dev"]')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check soundness invariants
        run: bash scripts/check-soundness-invariants.sh
      # Lightweight DLEQ Lean/VCVio tier: hygiene + stamp integrity, no toolchain.
      # The heavy `full` proof run (Sigma + FS-ROM) is nightly-only in `provers`.
      - name: Check DLEQ Lean stamps
        run: bash scripts/compliance-lean-dleq.sh stamps

  # Cheap Go-only gate: the Rust<->Go statement-field seam (the H2/A4 model-fidelity
  # anchor) and the .sr1cs manifest-pin tripwire. No lake/Lean, no nix. Recompiling
  # both circuits' R1CS and re-hashing takes a few seconds; a drift here means the
  # deployed artifact would no longer be the proved artifact.
  seam-and-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # PR -> local ref; schedule -> dev only (halves nightly cost; change
        # lands on dev); dispatch -> both (covers pre-release main verification).
        ref: ${{ fromJSON(github.event_name == 'pull_request' && '[""]' || (github.event_name == 'schedule' && '["dev"]' || '["main", "dev"]')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          lfs: true # seam tests read LFS-tracked .bin witness/statement vectors
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/gnark/go.mod
          cache-dependency-path: tools/gnark/go.sum
      - name: Statement-field seam / parity tests (Rust<->Go)
        working-directory: tools/gnark
        run: |
          go test ./internal/abi/ -run TestRustGoStatementFieldDifferential -count=1
          go test ./internal/primitives/ -run TestConsolidate2x1StatementSeamMatchesShielddVectors -count=1
      - name: Manifest-pin tripwire (recompile R1CS, assert sr1cs_sha256_hex)
        run: bash scripts/check-manifest-pin.sh

  # Alloy bounded-model outcome check on PRs (the same gate the nightly `provers`
  # job runs). Asserts every declared `check` is UNSAT and each `run show` is SAT
  # across all compliance models, including the two statement-sufficiency models.
  # nix-only (no Rust cache); the re-stamp it writes is discarded with the checkout.
  alloy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache: "false"
      - name: Run compliance Alloy outcome gate
        run: nix shell nixpkgs#alloy6 --command bash scripts/compliance-alloy.sh

  lean-circuit-fv:
    # PRs run the cheap `stamps` tier on a standard runner; the nightly `full`
    # tier that elaborates the whole-circuit proofs stays on the 16-vcpu tier for
    # RAM/cores. If the PR stamps tier ever exceeds ~10 min on ubuntu-latest,
    # move it to a smaller blacksmith tier rather than back to 16-vcpu.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    # Toolchain (Go, Rust, elan/Lean, ripgrep) is baked into the FV image, pinned
    # by digest, so no per-run install and no elan-init.sh 429 flake. Rebuild and
    # repin via .github/workflows/fv-toolchain-image.yml when the toolchain moves.
    container:
      image: ghcr.io/mizufinance/shieldd-fv-toolchain@sha256:4bdec94eb778ca2ae549ba75de18b44a822f5460f608d7facc911382f08e88aa
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read # pull the FV toolchain image from GHCR
    # Single-threaded Lean elaboration caps per-process memory: the nightly full
    # tier rebuilds the whole-circuit models, and unbounded threads let one
    # elaboration balloon past the runner's RAM and OOM the job.
    env:
      LEAN_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        # PR -> local ref; schedule -> dev only (change lands on dev, so that's
        # the clean-room drift target); dispatch -> both (covers pre-release main).
        ref: ${{ fromJSON(github.event_name == 'pull_request' && '[""]' || (github.event_name == 'schedule' && '["dev"]' || '["main", "dev"]')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          lfs: true # gate reads the committed LFS-tracked .sr1cs artifacts
      # Cache the Mathlib download cache and dependency builds (proven-zk/Mathlib
      # oleans). Keyed on the toolchain + lake-manifest pins, which are themselves
      # SHA-stamped into the whole-circuit artifacts, so the cache invalidates
      # exactly when the proved inputs change. Deliberately does NOT cache
      # tools/gnark/lean/.lake/build: the project's own circuit-proof oleans must
      # re-elaborate from source so the nightly `full` tier's axiom check stays a
      # real clean-room build. (elan/Lean itself is baked in the image, not cached.)
      - name: Cache Lean Mathlib and deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mathlib
            tools/gnark/lean/.lake/packages
          key: lean-fv-${{ hashFiles('tools/gnark/lean/lean-toolchain', 'tools/gnark/lean/lake-manifest.json') }}
          restore-keys: |
            lean-fv-
      # Rust + Go build caches: the stamps tier compiles the constraint-coverage
      # crate and runs `go run ./cmd/gnarkctl`. These make the ubuntu-latest PR
      # runner viable (the toolchains themselves are baked; only build artifacts
      # are cached here).
      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-fv-${{ hashFiles('tools/gnark/go.sum') }}
          restore-keys: |
            go-fv-
      # PRs run the cheap `stamps` tier (hygiene + stamp integrity + wiring
      # transcript); the nightly schedule/dispatch runs the expensive `full`
      # tier that elaborates the whole-circuit proofs and checks axioms.
      - name: Run Lean whole-circuit FV gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            bash scripts/check-lean-circuit-fv.sh stamps
          else
            bash scripts/check-lean-circuit-fv.sh full
          fi

  # Heavy provers (Tamarin symbolic + hax/F* injectivity). Schedule/dispatch
  # only; PRs keep this check green with an explicit policy note. The ACL2
  # certification leg is advisory because local ACL2 proof drift must not block
  # the required pipeline while the independent Lean gate stays hard-required.
  provers:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # PR -> local ref; schedule -> dev only (halves nightly cost; change
        # lands on dev); dispatch -> both (covers pre-release main verification).
        ref: ${{ fromJSON(github.event_name == 'pull_request' && '[""]' || (github.event_name == 'schedule' && '["dev"]' || '["main", "dev"]')) }}
    steps:
      - name: PR prover policy
        if: github.event_name == 'pull_request'
        run: echo "Heavy formal provers run on nightly schedule and workflow_dispatch; PRs run gate + lean-circuit-fv."

      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          ref: ${{ matrix.ref }}
          lfs: true # provers read the committed LFS-tracked .sr1cs artifacts

      - uses: ./.github/actions/setup-nix-rust
        if: github.event_name != 'pull_request'
        with:
          rust-cache-prefix: soundness-formal

      - name: Install pinned Z3
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/opt"
          curl -L \
            -o /tmp/z3-4.14.1.zip \
            https://github.com/Z3Prover/z3/releases/download/z3-4.14.1/z3-4.14.1-x64-glibc-2.35.zip
          unzip -q /tmp/z3-4.14.1.zip -d "$HOME/.local/opt"
          echo "$HOME/.local/opt/z3-4.14.1-x64-glibc-2.35/bin" >> "$GITHUB_PATH"

      - name: Install pinned cvc5 (finite-field theory, Picus solver)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/opt"
          # The -gpl build bundles CoCoALib, which provides the finite-field
          # theory Picus needs for the decaf/division gadgets. The non-gpl build
          # has no FF and cannot decide them.
          curl -L \
            -o /tmp/cvc5-gpl.zip \
            https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.4/cvc5-Linux-x86_64-static-gpl.zip
          unzip -q /tmp/cvc5-gpl.zip -d "$HOME/.local/opt"
          echo "$HOME/.local/opt/cvc5-Linux-x86_64-static-gpl/bin" >> "$GITHUB_PATH"

      - name: Install pinned F*
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/opt"
          curl -L \
            -o /tmp/fstar-v2026.05.24.tar.gz \
            https://github.com/FStarLang/FStar/releases/download/v2026.05.24/fstar-v2026.05.24-Linux-x86_64.tar.gz
          tar -xzf /tmp/fstar-v2026.05.24.tar.gz -C "$HOME/.local/opt"
          echo "$HOME/.local/opt/fstar/bin" >> "$GITHUB_PATH"

      - name: Install pinned hax
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/opt"
          git clone --depth 1 --branch hax-lib-v0.3.7 https://github.com/cryspen/hax "$HOME/.local/opt/hax-v0.3.7"
          nix profile install \
            "$HOME/.local/opt/hax-v0.3.7#hax" \
            "$HOME/.local/opt/hax-v0.3.7#hax-engine"
          echo "HAX_PROOF_LIBS_HOME=$HOME/.local/opt/hax-v0.3.7/hax-lib/proof-libs/fstar" >> "$GITHUB_ENV"

      - name: Run compliance symbolic gate (Tamarin)
        if: github.event_name != 'pull_request'
        run: nix shell nixpkgs#tamarin-prover nixpkgs#maude --command bash scripts/compliance-symbolic.sh

      - name: Run compliance Alloy state-invariant gate
        if: github.event_name != 'pull_request'
        run: nix shell nixpkgs#alloy6 --command bash scripts/compliance-alloy.sh

      - name: Install pinned Lean (DLEQ / VCVio)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v elan >/dev/null 2>&1; then
            curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
            sh /tmp/elan-init.sh -y --default-toolchain none
            echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          fi

      - name: Run compliance DLEQ Lean/VCVio computational-soundness gate
        if: github.event_name != 'pull_request'
        run: bash scripts/compliance-lean-dleq.sh full

      - name: Run shielded-pool F* injectivity gate
        if: github.event_name != 'pull_request'
        run: bash scripts/shielded-pool-formal.sh

      - name: Install Picus (Veridise under-constraint checker)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Veridise/Picus "$HOME/.local/opt/picus"
          ( cd "$HOME/.local/opt/picus" && raco pkg install --auto --batch || true )
          echo "PICUS_BIN=$HOME/.local/opt/picus/run-picus" >> "$GITHUB_ENV"

      - name: Run gadget-scope R1CS under-constraint check (Picus + cvc5)
        if: github.event_name != 'pull_request'
        run: bash scripts/circuit-constraint-check.sh

      # Honest whole-circuit Picus attempt with a real multi-hour budget instead
      # of the 180 s watchdog. Advisory: an undischarged-timeout is expected and
      # does not fail the build; a genuine underconstrained finding turns the
      # step red without blocking the rest of the nightly. Schedule-only — never
      # a PR gate. The Lean-proved consolidate2x1 and transfer circuits run
      # here; split families can be attempted by hand via
      # scripts/run-whole-circuit-picus.sh.
      - name: Attempt whole-circuit Picus (nightly, non-gating)
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          PICUS_WHOLE_BUDGET_SECONDS: '10800'
        run: bash scripts/run-whole-circuit-picus.sh consolidate2x1 transfer

      # C3 gadget theorems — the only route to `proved`. Certifies the ACL2
      # `R1CS => spec` proof, verifies the gnark parity tie, and checks the
      # stamped artifact. nixpkgs#acl2 ships its community books (arithmetic-5)
      # certified under its own image, so the serial `acl2` certifies cleanly.
      # The same script also runs the M6 Lean spec scaffold (`lake build`).
      - name: Run C3 gadget theorem certification (ACL2)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: nix shell nixpkgs#acl2 nixpkgs#lean4 --command bash scripts/circuit-gadget-proof-check.sh

      - name: Check soundness invariants (post-prover, stamp drift)
        if: github.event_name != 'pull_request'
        run: nix develop --command bash scripts/check-soundness-invariants.sh
