name: soundness-formal

on:
  workflow_call:
    inputs:
      target_ref:
        description: Branch whose committed state is the reusable-run candidate.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch whose committed state is the manual-run candidate.
        required: true
        type: choice
        default: dev
        options:
          - dev
          - main
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.target_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CANDIDATE_REF: ${{ (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch') && inputs.target_ref || '' }}

jobs:
  applicability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: stable
    outputs:
      status: ${{ steps.classify.outputs.status }}
      tier: ${{ steps.classify.outputs.tier }}
      run: ${{ steps.classify.outputs.run }}
      explanation: ${{ steps.classify.outputs.explanation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 0
      - name: Classify soundness applicability
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: |
          args=(
            --gate soundness-formal
            --event "${{ github.event_name }}"
            --head "$GITHUB_SHA"
            --github-output "$GITHUB_OUTPUT"
            --pretty
          )
          if [[ -n "$BASE_SHA" ]]; then
            args+=(--base "$BASE_SHA")
          fi
          python3 scripts/ci/gate-applicability.py "${args[@]}"

  gate:
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check soundness invariants
        run: bash scripts/check-soundness-invariants.sh
      - name: Check DLEQ Lean stamps
        run: bash scripts/compliance-lean-dleq.sh stamps

  seam-and-pin:
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          lfs: true
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: tools/gnark/go.mod
          cache-dependency-path: tools/gnark/go.sum
      - name: Statement-field seam and parity
        working-directory: tools/gnark
        run: |
          go test ./internal/abi/ -run TestRustGoStatementFieldDifferential -count=1
          go test ./internal/primitives/ -run TestConsolidate2x1StatementSeamMatchesShielddVectors -count=1
      - name: Manifest pin
        run: bash scripts/check-manifest-pin.sh

  vk-derivation:
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        circuit: [consolidate2x1, transfer]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          lfs: true
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: tools/gnark/go.mod
          cache-dependency-path: tools/gnark/go.sum
      - name: VK derivation pinning
        run: bash scripts/check-vk-derivation.sh "${{ matrix.circuit }}"

  alloy:
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.run == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache: "false"
      - name: Run compliance Alloy outcome gate
        run: nix shell nixpkgs#alloy6 --command bash scripts/compliance-alloy.sh

  lean-circuit-fv:
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.run == 'true'
    runs-on: ${{ needs.applicability.outputs.tier == 'stamps' && 'ubuntu-24.04' || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 50
    container:
      image: ghcr.io/mizufinance/shieldd-fv-toolchain@sha256:4bdec94eb778ca2ae549ba75de18b44a822f5460f608d7facc911382f08e88aa
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          lfs: true
      - name: Cache Lean dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/mathlib
            tools/gnark/lean/.lake/packages
          key: lean-fv-${{ hashFiles('tools/gnark/lean/lean-toolchain', 'tools/gnark/lean/lake-manifest.json') }}
          restore-keys: |
            lean-fv-
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      - name: Cache Go build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-fv-${{ hashFiles('tools/gnark/go.sum') }}
          restore-keys: |
            go-fv-
      - name: Run whole-circuit FV tier
        shell: bash
        run: bash scripts/check-lean-circuit-fv.sh "${{ needs.applicability.outputs.tier }}"

  tamarin-alloy:
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.run == 'true' && (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch')
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache: "false"
      - name: Run Tamarin symbolic gate
        run: nix shell nixpkgs#tamarin-prover nixpkgs#maude --command bash scripts/compliance-symbolic.sh
      - name: Run Alloy state-invariant gate
        run: nix shell nixpkgs#alloy6 --command bash scripts/compliance-alloy.sh

  dleq:
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.run == 'true' && (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch')
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache-prefix: soundness-dleq
      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v elan >/dev/null 2>&1; then
            curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
            sh /tmp/elan-init.sh -y --default-toolchain none
            echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          fi
      - name: Run DLEQ Lean and VCVio gate
        run: bash scripts/compliance-lean-dleq.sh full

  fstar:
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.run == 'true' && (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch')
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache-prefix: soundness-fstar
      - name: Install Z3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/opt"
          curl -fsSL -o /tmp/z3.zip https://github.com/Z3Prover/z3/releases/download/z3-4.14.1/z3-4.14.1-x64-glibc-2.35.zip
          unzip -q /tmp/z3.zip -d "$HOME/.local/opt"
          echo "$HOME/.local/opt/z3-4.14.1-x64-glibc-2.35/bin" >> "$GITHUB_PATH"
      - name: Install F*
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/opt"
          curl -fsSL -o /tmp/fstar.tar.gz https://github.com/FStarLang/FStar/releases/download/v2026.05.24/fstar-v2026.05.24-Linux-x86_64.tar.gz
          tar -xzf /tmp/fstar.tar.gz -C "$HOME/.local/opt"
          echo "$HOME/.local/opt/fstar/bin" >> "$GITHUB_PATH"
      - name: Install hax
        shell: bash
        run: |
          set -euo pipefail
          hax_dir="$HOME/.local/opt/hax-c8e27c5"
          git clone --filter=blob:none --no-checkout https://github.com/cryspen/hax "$hax_dir"
          git -C "$hax_dir" fetch --depth=1 origin c8e27c5945f7fc5791939cff7c1277f4ab768fe1
          git -C "$hax_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$hax_dir" rev-parse HEAD)" = c8e27c5945f7fc5791939cff7c1277f4ab768fe1
          nix profile install "$hax_dir#hax" "$hax_dir#hax-engine"
          echo "HAX_PROOF_LIBS_HOME=$hax_dir/hax-lib/proof-libs/fstar" >> "$GITHUB_ENV"
      - name: Run shielded-pool F* gate
        run: bash scripts/shielded-pool-formal.sh

  picus:
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.run == 'true' && (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch')
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          lfs: true
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache-prefix: soundness-picus
      - name: Install cvc5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/opt"
          curl -fsSL -o /tmp/cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.4/cvc5-Linux-x86_64-static-gpl.zip
          unzip -q /tmp/cvc5.zip -d "$HOME/.local/opt"
          echo "$HOME/.local/opt/cvc5-Linux-x86_64-static-gpl/bin" >> "$GITHUB_PATH"
      - name: Install Picus
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Veridise/Picus "$HOME/.local/opt/picus"
          (cd "$HOME/.local/opt/picus" && raco pkg install --auto --batch)
          echo "PICUS_BIN=$HOME/.local/opt/picus/run-picus" >> "$GITHUB_ENV"
      - name: Run gadget-scope under-constraint gate
        run: bash scripts/circuit-constraint-check.sh
      - name: Attempt whole-circuit Picus
        continue-on-error: true
        env:
          PICUS_WHOLE_BUDGET_SECONDS: '10800'
        run: bash scripts/run-whole-circuit-picus.sh consolidate2x1 transfer

  acl2:
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.run == 'true' && (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch')
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache: "false"
      - name: Run advisory C3 gadget theorem certification
        run: nix shell nixpkgs#acl2 nixpkgs#lean4 --command bash scripts/circuit-gadget-proof-check.sh

  post-prover-invariants:
    needs: [applicability, tamarin-alloy, dleq, fstar, picus]
    if: always() && needs.applicability.result == 'success' && needs.applicability.outputs.run == 'true' && (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require prover lanes
        env:
          TAMARIN_ALLOY: ${{ needs.tamarin-alloy.result }}
          DLEQ: ${{ needs.dleq.result }}
          FSTAR: ${{ needs.fstar.result }}
          PICUS: ${{ needs.picus.result }}
        run: |
          for result in \
            "tamarin-alloy=$TAMARIN_ALLOY" \
            "dleq=$DLEQ" \
            "fstar=$FSTAR" \
            "picus=$PICUS"; do
            if [[ "${result#*=}" != "success" ]]; then
              echo "required prover failed: $result"
              exit 1
            fi
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache-prefix: soundness-post-prover
      - name: Check post-prover invariant and stamp state
        run: nix develop --command bash scripts/check-soundness-invariants.sh

  summary:
    name: Soundness Formal Summary
    needs:
      - applicability
      - gate
      - seam-and-pin
      - vk-derivation
      - alloy
      - lean-circuit-fv
      - tamarin-alloy
      - dleq
      - fstar
      - picus
      - acl2
      - post-prover-invariants
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce soundness result contract
        env:
          EVENT_NAME: ${{ github.event_name }}
          APPLICABILITY: ${{ needs.applicability.result }}
          STATUS: ${{ needs.applicability.outputs.status }}
          TIER: ${{ needs.applicability.outputs.tier }}
          EXPLANATION: ${{ needs.applicability.outputs.explanation }}
          GATE: ${{ needs.gate.result }}
          SEAM: ${{ needs.seam-and-pin.result }}
          VK: ${{ needs.vk-derivation.result }}
          ALLOY: ${{ needs.alloy.result }}
          LEAN: ${{ needs.lean-circuit-fv.result }}
          TAMARIN_ALLOY: ${{ needs.tamarin-alloy.result }}
          DLEQ: ${{ needs.dleq.result }}
          FSTAR: ${{ needs.fstar.result }}
          PICUS: ${{ needs.picus.result }}
          ACL2: ${{ needs.acl2.result }}
          POST: ${{ needs.post-prover-invariants.result }}
        run: |
          if [[ "$APPLICABILITY" != "success" ]]; then
            echo "applicability classification failed: $APPLICABILITY"
            exit 1
          fi
          jobs=("$GATE" "$SEAM" "$VK" "$ALLOY" "$LEAN" "$TAMARIN_ALLOY" "$DLEQ" "$FSTAR" "$PICUS" "$ACL2" "$POST")
          if [[ "$STATUS" == "skip" ]]; then
            for result in "${jobs[@]}"; do
              [[ "$result" == "skipped" ]] || {
                echo "skip tier unexpectedly ran a job: $result"
                exit 1
              }
            done
            echo "explained skip: $EXPLANATION"
            exit 0
          fi
          if [[ "$STATUS" != "run" || ( "$TIER" != "stamps" && "$TIER" != "full" ) ]]; then
            echo "invalid applicability contract: status=$STATUS tier=$TIER"
            exit 1
          fi
          for required in "gate=$GATE" "seam=$SEAM" "vk=$VK" "lean=$LEAN"; do
            [[ "${required#*=}" == "success" ]] || {
              echo "required job failed: $required"
              exit 1
            }
          done
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "merge_group" ]]; then
            [[ "$ALLOY" == "success" ]] || exit 1
            for result in "$TAMARIN_ALLOY" "$DLEQ" "$FSTAR" "$PICUS" "$ACL2" "$POST"; do
              [[ "$result" == "skipped" ]] || {
                echo "candidate unexpectedly ran nightly job: $result"
                exit 1
              }
            done
          else
            [[ "$ALLOY" == "skipped" ]] || exit 1
            for result in "$TAMARIN_ALLOY" "$DLEQ" "$FSTAR" "$PICUS" "$ACL2" "$POST"; do
              [[ "$result" == "success" ]] || {
                echo "nightly job did not complete: $result"
                exit 1
              }
            done
          fi
          echo "soundness tier $TIER passed"
