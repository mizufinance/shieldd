name: soundness-formal

on:
  workflow_call:
    inputs:
      target_ref:
        description: Branch whose committed state is the reusable-run candidate.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch whose committed state is the manual-run candidate.
        required: true
        type: choice
        default: dev
        options:
          - dev
          - main
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.target_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CANDIDATE_REF: ${{ (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch') && inputs.target_ref || '' }}

jobs:
  applicability:
    name: 'soundness: applicability'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: stable
    outputs:
      status: ${{ steps.classify.outputs.status }}
      tier: ${{ steps.classify.outputs.tier }}
      run: ${{ steps.classify.outputs.run }}
      explanation: ${{ steps.classify.outputs.explanation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 0
      - name: Classify soundness applicability
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: |
          args=(
            --gate soundness-formal
            --event "${{ github.event_name }}"
            --head "$GITHUB_SHA"
            --github-output "$GITHUB_OUTPUT"
            --pretty
          )
          if [[ -n "$BASE_SHA" ]]; then
            args+=(--base "$BASE_SHA")
          fi
          python3 scripts/ci/gate-applicability.py "${args[@]}"

  gate:
    name: 'soundness: gate'
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check soundness invariants
        run: bash scripts/check-soundness-invariants.sh
      - name: Check DLEQ Lean stamps
        run: bash scripts/compliance-lean-dleq.sh stamps

  seam-and-pin:
    name: 'soundness: seam-and-pin'
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          lfs: true
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: tools/gnark/go.mod
          cache-dependency-path: tools/gnark/go.sum
      - name: Statement-field seam and parity
        working-directory: tools/gnark
        run: |
          go test ./internal/abi/ -run TestRustGoStatementFieldDifferential -count=1
          go test ./internal/primitives/ -run TestConsolidate2x1StatementSeamMatchesShielddVectors -count=1
      - name: Manifest pin
        run: bash scripts/check-manifest-pin.sh

  vk-derivation:
    name: 'soundness: vk-derivation'
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          lfs: true
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: tools/gnark/go.mod
          cache-dependency-path: tools/gnark/go.sum
      # One job, not a 2-way matrix: each circuit takes ~1 min, so a second
      # runner and Go toolchain setup cost more than running them in sequence.
      - name: VK derivation pinning
        shell: bash
        run: |
          set -euo pipefail
          for circuit in consolidate2x1 transfer; do
            echo "::group::vk-derivation $circuit"
            bash scripts/check-vk-derivation.sh "$circuit"
            echo "::endgroup::"
          done

  alloy:
    name: 'soundness: alloy'
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.run == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache: "false"
      - name: Run compliance Alloy outcome gate
        run: nix shell nixpkgs#alloy6 --command bash scripts/compliance-alloy.sh

  lean-circuit-fv:
    name: 'soundness: lean-circuit-fv'
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.run == 'true'
    runs-on: ${{ needs.applicability.outputs.tier == 'stamps' && 'ubuntu-24.04' || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 50
    container:
      image: ghcr.io/mizufinance/shieldd-fv-toolchain@sha256:4bdec94eb778ca2ae549ba75de18b44a822f5460f608d7facc911382f08e88aa
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          lfs: true
      - name: Cache Lean dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/mathlib
            tools/gnark/lean/.lake/packages
          key: lean-fv-${{ hashFiles('tools/gnark/lean/lean-toolchain', 'tools/gnark/lean/lake-manifest.json') }}
          restore-keys: |
            lean-fv-
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      - name: Cache Go build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-fv-${{ hashFiles('tools/gnark/go.sum') }}
          restore-keys: |
            go-fv-
      - name: Run whole-circuit FV tier
        shell: bash
        run: bash scripts/check-lean-circuit-fv.sh "${{ needs.applicability.outputs.tier }}"

  summary:
    name: 'soundness: summary'
    needs:
      - applicability
      - gate
      - seam-and-pin
      - vk-derivation
      - alloy
      - lean-circuit-fv
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # Asserts only what the job `if:` conditions cannot already guarantee:
      # that applicability produced a tier we understand, and that every lane
      # succeeded. Asserting the complement (that unselected lanes report
      # `skipped`) would just restate those `if:`s.
      - name: Enforce soundness result contract
        env:
          EVENT_NAME: ${{ github.event_name }}
          APPLICABILITY: ${{ needs.applicability.result }}
          STATUS: ${{ needs.applicability.outputs.status }}
          TIER: ${{ needs.applicability.outputs.tier }}
          EXPLANATION: ${{ needs.applicability.outputs.explanation }}
          GATE: ${{ needs.gate.result }}
          SEAM: ${{ needs.seam-and-pin.result }}
          VK: ${{ needs.vk-derivation.result }}
          ALLOY: ${{ needs.alloy.result }}
          LEAN: ${{ needs.lean-circuit-fv.result }}
        run: |
          set -euo pipefail
          if [[ "$APPLICABILITY" != "success" ]]; then
            echo "applicability classification failed: $APPLICABILITY" >&2
            exit 1
          fi
          if [[ "$STATUS" == "skip" ]]; then
            echo "explained skip: $EXPLANATION"
            exit 0
          fi
          if [[ "$STATUS" != "run" || ( "$TIER" != "stamps" && "$TIER" != "full" ) ]]; then
            echo "invalid applicability contract: status=$STATUS tier=$TIER" >&2
            exit 1
          fi
          required=("gate=$GATE" "seam=$SEAM" "vk=$VK" "lean=$LEAN")
          # alloy runs only on candidate events; the scheduled path covers the
          # same gate inside soundness-provers' tamarin-alloy lane.
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "merge_group" ]]; then
            required+=("alloy=$ALLOY")
          fi
          for entry in "${required[@]}"; do
            if [[ "${entry#*=}" != "success" ]]; then
              echo "required job failed: $entry" >&2
              exit 1
            fi
          done
          echo "soundness tier $TIER passed"
