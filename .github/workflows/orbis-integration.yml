name: orbis-integration
on:
  pull_request:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Shieldd Orbis adapter contracts
    runs-on: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'blacksmith-16vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      RAYON_NUM_THREADS: 2
      GOMAXPROCS: 2
    steps:
      - name: Checkout Shieldd
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: shieldd

      - name: Set up Nix and Rust
        uses: ./shieldd/.github/actions/setup-nix-rust
        with:
          free-disk: "true"
          nix-cache-glob: "shieldd/**/*.nix"
          rust-workspaces: "shieldd"

      - name: Test Orbis/Vera integration contracts
        working-directory: shieldd
        run: |
          python3 scripts/check_orbis_vendor.py
          nix develop --command cargo test --locked --profile ci \
            -p shieldd-sdk-disclosure --features orbis -- --test-threads=1
          nix develop --command cargo test --locked --profile ci \
            -p shieldd-orbis-client \
            -p orbis-integration -- --test-threads=1
          nix develop --command cargo test --locked --profile ci \
            -p shieldd-sdk-compliance \
          --features scanner -- --test-threads=1

      - name: Report live integration prerequisite
        run: echo "::notice::The locked Decaf377 Orbis image is unsupported. This job validates adapter contracts only; live BLS12-381 PRE and Jubjub PET require compatible external implementations."
