name: orbis-integration
on:
  pull_request:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  applicability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: stable
    outputs:
      status: ${{ steps.classify.outputs.status }}
      tier: ${{ steps.classify.outputs.tier }}
      run: ${{ steps.classify.outputs.run }}
      explanation: ${{ steps.classify.outputs.explanation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Classify Orbis integration applicability
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: |
          args=(
            --gate orbis-integration
            --event "${{ github.event_name }}"
            --head "$GITHUB_SHA"
            --github-output "$GITHUB_OUTPUT"
            --pretty
          )
          if [[ -n "$BASE_SHA" ]]; then
            args+=(--base "$BASE_SHA")
          fi
          python3 scripts/ci/gate-applicability.py "${args[@]}"

  flow:
    needs: applicability
    if: needs.applicability.result == 'success' && needs.applicability.outputs.run == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 45
    concurrency:
      group: orbis-integration-host-stack-v1
      cancel-in-progress: false
    env:
      COMPLIANCE_TMP: /tmp/orbis-${{ github.run_id }}-${{ github.run_attempt }}
      SHIELDD_PD_GRPC_PORT: "28080"
      SHIELDD_COMETBFT_RPC_PORT: "27657"
      SHIELDD_COMETBFT_P2P_PORT: "27656"
      SHIELDD_PCLIENTD_PORT_BASE: "28081"
      ORBIS_COMPOSE_PROJECT_NAME: orbis-${{ github.run_id }}-${{ github.run_attempt }}
      ORBIS_SOURCEHUB_RPC_PORT: "36657"
      ORBIS_SOURCEHUB_P2P_PORT: "36656"
      ORBIS_SOURCEHUB_REST_PORT: "31317"
      ORBIS_SOURCEHUB_GRPC_PORT: "49090"
      ORBIS_SOURCEHUB_RPC: http://127.0.0.1:36657
      ORBIS_SOURCEHUB_REST: http://127.0.0.1:31317
      ORBIS_SOURCEHUB_GRPC: http://127.0.0.1:49090
      ORBIS_NODE1_GRPC_PORT: "35051"
      ORBIS_NODE2_GRPC_PORT: "35052"
      ORBIS_NODE3_GRPC_PORT: "35053"
      ORBIS_NODE1_METRICS_PORT: "39091"
      ORBIS_NODE2_METRICS_PORT: "39092"
      ORBIS_NODE3_METRICS_PORT: "39093"
      ORBIS_NODE1_ENDPOINT: http://127.0.0.1:35051
      ORBIS_NODE2_ENDPOINT: http://127.0.0.1:35052
      ORBIS_NODE3_ENDPOINT: http://127.0.0.1:35053
    steps:
      - name: Checkout Shieldd
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: shieldd
          lfs: true

      - uses: ./shieldd/.github/actions/setup-nix-rust
        with:
          free-disk: "true"
          nix-cache-glob: "shieldd/**/*.nix"
          rust-workspaces: "shieldd"

      - name: Clean stale owned Orbis integration resources
        working-directory: shieldd
        run: nix develop --command ./scripts/orbis-ci-cleanup.sh

      - name: Run Shieldd Orbis integration flow
        working-directory: shieldd
        run: |
          nix develop --command bash -euo pipefail -c '
            pull_pid=""
            cleanup() {
              if [ -n "$pull_pid" ] && kill -0 "$pull_pid" 2>/dev/null; then
                kill "$pull_pid" 2>/dev/null || true
                wait "$pull_pid" 2>/dev/null || true
              fi
              ./scripts/orbis-stack.sh down || true
              ./scripts/shieldd-down.sh || true
            }
            trap cleanup EXIT

            ./scripts/orbis-stack.sh pull &
            pull_pid=$!
            just orbis-integration-build
            wait "$pull_pid"
            pull_pid=""
            just orbis-integration-run
          '

      # NOTE: docker logs are captured by orbis-integration itself before it
      # tears down the stack (see capture_orbis_logs in
      # crates/bin/orbis-integration/src/main.rs). Running `orbis-stack.sh
      # logs` here would query already-removed containers and overwrite the
      # captured file with empty output.

      - name: Clean owned integration resources
        if: always()
        working-directory: shieldd
        run: |
          cleanup_status=0
          nix develop --command ./scripts/orbis-stack.sh down || cleanup_status=$?
          nix develop --command ./scripts/shieldd-down.sh || cleanup_status=$?
          exit "$cleanup_status"

      - name: Upload integration artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orbis-integration-artifacts
          path: |
            ${{ env.COMPLIANCE_TMP }}/**

  summary:
    name: Orbis Integration Summary
    needs: [applicability, flow]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check Orbis integration result
        env:
          APPLICABILITY_RESULT: ${{ needs.applicability.result }}
          STATUS: ${{ needs.applicability.outputs.status }}
          TIER: ${{ needs.applicability.outputs.tier }}
          EXPLANATION: ${{ needs.applicability.outputs.explanation }}
          ORBIS_RESULT: ${{ needs.flow.result }}
        run: |
          if [[ "$APPLICABILITY_RESULT" != "success" ]]; then
            echo "applicability classification failed: $APPLICABILITY_RESULT"
            exit 1
          fi
          if [[ "$STATUS" == "skip" ]]; then
            if [[ "$ORBIS_RESULT" != "skipped" ]]; then
              echo "skip tier unexpectedly ran flow: $ORBIS_RESULT"
              exit 1
            fi
            echo "explained skip: $EXPLANATION"
            exit 0
          fi
          if [[ "$STATUS" != "run" ]]; then
            echo "invalid applicability status: $STATUS"
            exit 1
          fi
          if [[ "$TIER" != "full" || "$ORBIS_RESULT" != "success" ]]; then
            echo "required Orbis contract failed: tier=$TIER flow=$ORBIS_RESULT"
            exit 1
          fi
          echo "Orbis tier $TIER passed"
