name: docs-lint
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  # Also support ad-hoc calls for workflow.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustdocs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check documentation links and filename casing
        run: python3 scripts/check_docs.py

      - uses: ./.github/actions/setup-nix-rust

      - name: Check first-party API documentation with all features
        run: nix develop .#ci --command just rustdocs-check
