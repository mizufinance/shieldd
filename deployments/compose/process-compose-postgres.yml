---
# A process-compose configuration for running a PostgreSQL database,
# specifically for indexing ABCI events as emitted by CometBFT for Shieldd.
version: "0.5"
log_level: info
is_strict: true

processes:
  # Run postgresql db process
  postgresql:
    command: |-
      set -e
      ./deployments/scripts/prep-postgres-env
      postgres -k /tmp -p ${SHIELDD_POSTGRES_PORT} -D ${SHIELDD_DEVNET_HOME}/network_data/postgresql/
    readiness_probe:
      exec:
        command: psql -h 127.0.0.1 -p ${SHIELDD_POSTGRES_PORT} -lqt
      initial_delay_seconds: 5
      period_seconds: 5
      failure_threshold: 3
    shutdown:
      # Send SIGINT rather than default SIGTERM to get faster postgres shutdown.
      # More info: https://www.postgresql.org/docs/current/server-shutdown.html
      # and `man 7 signal`.
      signal: 2

  # Set up databases and initial schemas
  postgresql-init:
    command: |-
      set -e
      if psql -h 127.0.0.1 -p ${SHIELDD_POSTGRES_PORT} -lqt | grep shieldd_cometbft ; then
        >&2 echo "Postgres DB already initialized, skipping schema/grants..."
        exit 0
      fi
      >&2 echo "Creating database schema for CometBFT..."
      # Create database for CometBFT writes
      createdb -h 127.0.0.1 -p ${SHIELDD_POSTGRES_PORT} shieldd_cometbft || true
      createuser -h 127.0.0.1 -p ${SHIELDD_POSTGRES_PORT} shieldd
      psql -h 127.0.0.1 -p ${SHIELDD_POSTGRES_PORT} -d shieldd_cometbft -f deployments/config/cometbft-postgres.sql
      psql -h 127.0.0.1 -p ${SHIELDD_POSTGRES_PORT} -d shieldd_cometbft -c 'GRANT ALL PRIVILEGES ON DATABASE shieldd_cometbft TO shieldd;'
      psql -h 127.0.0.1 -p ${SHIELDD_POSTGRES_PORT} -d shieldd_cometbft -c 'GRANT pg_read_all_data TO shieldd;'
      psql -h 127.0.0.1 -p ${SHIELDD_POSTGRES_PORT} -d shieldd_cometbft -c 'GRANT pg_write_all_data TO shieldd;'
    depends_on:
      postgresql:
        condition: process_healthy

  # Add rule for CometBFT to wait for db to be ready.
  cometbft:
    depends_on:
      postgresql-init:
        condition: process_completed_successfully
