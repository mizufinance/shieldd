# Orbis integration stack: prebuilt images (no in-pipeline build).
#
# sourcehub + 3 orbis nodes are pulled from GHCR instead of built from a
# vendored orbis-rs checkout. scripts/lib/common.sh loads digest-pinned images
# from images.lock.json and verifies the Orbis source revision against the Cargo
# git dependencies.
#
# The published orbis images are production builds (ENABLE_INTEGRATION_TEST=false)
# so they do NOT self-fund. orbis-funder funds each node's sourcehub account from
# the dedicated genesis `funder` account (the host flow signs from `test`; they
# must not share a sequence); each node then restarts once (restart: on-failure)
# to pick up its on-chain account number and serve gRPC.
#
# Fixed ORBIS_PASSWORD / ORBIS_SECRET_KEY / node-controller-key values are
# local-test fixtures only.
services:
  sourcehub:
    image: ${SOURCEHUB_IMAGE:?SOURCEHUB_IMAGE must be loaded from images.lock.json}
    platform: ${SOURCEHUB_PLATFORM:-linux/amd64}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -f /home/node/.sourcehub/config/config.toml ]; then
          sourcehubd init local-node --chain-id sourcehub-localnet --home /home/node/.sourcehub
          sourcehubd keys add validator --keyring-backend test --home /home/node/.sourcehub
          echo "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about" | sourcehubd keys add test --recover --keyring-backend test --home /home/node/.sourcehub
          echo "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon art" | sourcehubd keys add funder --recover --keyring-backend test --home /home/node/.sourcehub
          sourcehubd genesis add-genesis-account validator 100000000000uopen --keyring-backend test --home /home/node/.sourcehub
          sourcehubd genesis add-genesis-account test 100000000000uopen --keyring-backend test --home /home/node/.sourcehub
          sourcehubd genesis add-genesis-account funder 100000000000uopen --keyring-backend test --home /home/node/.sourcehub
          sourcehubd genesis gentx validator 10000000000uopen --keyring-backend test --chain-id sourcehub-localnet --home /home/node/.sourcehub
          sourcehubd genesis collect-gentxs --home /home/node/.sourcehub
        fi
        exec sourcehubd start --home /home/node/.sourcehub --rpc.laddr tcp://0.0.0.0:26657 --api.enable --api.address tcp://0.0.0.0:1317
    volumes:
      - sourcehub-data:/home/node/.sourcehub
    ports:
      - "${ORBIS_SOURCEHUB_RPC_PORT:-26657}:26657"
      - "${ORBIS_SOURCEHUB_P2P_PORT:-26656}:26656"
      - "${ORBIS_SOURCEHUB_REST_PORT:-1317}:1317"
      - "${ORBIS_SOURCEHUB_GRPC_PORT:-9090}:9090"
    networks:
      - orbis-integration-network
    healthcheck:
      test: ["CMD", "sourcehubd", "status", "--home", "/home/node/.sourcehub"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  node1:
    image: ${ORBIS_IMAGE:?ORBIS_IMAGE must be loaded from images.lock.json}
    environment:
      - ORBIS_PASSWORD=testpassword123
      - ORBIS_SECRET_KEY=testsecret1testsecret1
      - RUST_LOG=debug
    command: ["--addr", "0.0.0.0:50051", "--log-level", "debug", "--authz-grpc", "http://sourcehub:9090", "--bulletin-grpc", "http://sourcehub:9090", "--chain-rpc", "http://sourcehub:26657", "--chain-rest", "http://sourcehub:1317", "--metrics-addr", "0.0.0.0:9090", "--reshare-interval-secs", "5", "--node-controller-key", "${ORBIS_NODE_CONTROLLER_KEY:-024f4e2ad99c34d60b9ba6283c9431a8418af8673212961f97a77b6377fcd05b62}"]
    # published image doesn't self-fund; orbis-funder funds /data's account and the
    # node restarts once to resolve it. /data persists the signing key + public_key.txt.
    restart: on-failure
    volumes:
      - orbis-node1-data:/data
    ports:
      - "${ORBIS_NODE1_GRPC_PORT:-50051}:50051"
      - "${ORBIS_NODE1_METRICS_PORT:-9091}:9090"
    networks:
      - orbis-integration-network
    depends_on:
      sourcehub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  node2:
    image: ${ORBIS_IMAGE:?ORBIS_IMAGE must be loaded from images.lock.json}
    environment:
      - ORBIS_PASSWORD=testpassword123
      - ORBIS_SECRET_KEY=testsecret2testsecret2
      - RUST_LOG=debug
    command: ["--addr", "0.0.0.0:50051", "--log-level", "debug", "--authz-grpc", "http://sourcehub:9090", "--bulletin-grpc", "http://sourcehub:9090", "--chain-rpc", "http://sourcehub:26657", "--chain-rest", "http://sourcehub:1317", "--metrics-addr", "0.0.0.0:9090", "--reshare-interval-secs", "5", "--node-controller-key", "${ORBIS_NODE_CONTROLLER_KEY:-024f4e2ad99c34d60b9ba6283c9431a8418af8673212961f97a77b6377fcd05b62}"]
    restart: on-failure
    volumes:
      - orbis-node2-data:/data
    ports:
      - "${ORBIS_NODE2_GRPC_PORT:-50052}:50051"
      - "${ORBIS_NODE2_METRICS_PORT:-9092}:9090"
    networks:
      - orbis-integration-network
    depends_on:
      sourcehub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  node3:
    image: ${ORBIS_IMAGE:?ORBIS_IMAGE must be loaded from images.lock.json}
    environment:
      - ORBIS_PASSWORD=testpassword123
      - ORBIS_SECRET_KEY=testsecret3testsecret3
      - RUST_LOG=debug
    command: ["--addr", "0.0.0.0:50051", "--log-level", "debug", "--authz-grpc", "http://sourcehub:9090", "--bulletin-grpc", "http://sourcehub:9090", "--chain-rpc", "http://sourcehub:26657", "--chain-rest", "http://sourcehub:1317", "--metrics-addr", "0.0.0.0:9090", "--reshare-interval-secs", "5", "--node-controller-key", "${ORBIS_NODE_CONTROLLER_KEY:-024f4e2ad99c34d60b9ba6283c9431a8418af8673212961f97a77b6377fcd05b62}"]
    restart: on-failure
    volumes:
      - orbis-node3-data:/data
    ports:
      - "${ORBIS_NODE3_GRPC_PORT:-50053}:50051"
      - "${ORBIS_NODE3_METRICS_PORT:-9093}:9090"
    networks:
      - orbis-integration-network
    depends_on:
      sourcehub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Funds each orbis node's sourcehub account from the dedicated genesis
  # `funder` account. It must NOT share an account with the host-side
  # orbis-integration flow (which signs ring/policy txs from `test`): two
  # independent signers on one Cosmos account race the sequence, and the loser
  # is rejected with code 32. Each node writes its address to
  # /data/public_key.txt; the funder reads those, sends uopen, waits until the
  # balances are actually visible, then waits until all three serve gRPC so the
  # host-side readiness wait can gate on stable nodes rather than the flapping
  # (restart: on-failure) healthcheck.
  orbis-funder:
    image: ${SOURCEHUB_IMAGE:?SOURCEHUB_IMAGE must be loaded from images.lock.json}
    platform: ${SOURCEHUB_PLATFORM:-linux/amd64}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        H=/tmp/funder
        echo "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon art" \
          | sourcehubd keys add funder --recover --keyring-backend test --home "$$H"
        for d in /n1 /n2 /n3; do
          i=0
          while [ ! -s "$$d/public_key.txt" ]; do
            i=$$((i+1)); [ "$$i" -gt 120 ] && { echo "timeout waiting for $$d/public_key.txt"; exit 1; }
            echo "waiting for $$d/public_key.txt"; sleep 3
          done
        done
        n=0
        until sourcehubd query block --type=height 1 --node tcp://sourcehub:26657 >/dev/null 2>&1; do
          n=$$((n+1)); [ "$$n" -gt 120 ] && { echo "timeout waiting for first block"; exit 1; }
          echo "waiting for sourcehub first block"; sleep 2
        done
        # Fund all three nodes in ONE bank multi-send so there is a single tx
        # from the funder account (three separate sends raced their own
        # sequence). The CLI exits 0 even when CheckTx REJECTS the tx (e.g.
        # code 32 sequence mismatch), so gate the retry loop on "code":0 in
        # the JSON output, not on the exit status.
        addrs=""
        for d in /n1 /n2 /n3; do
          a=$$(cat "$$d/public_key.txt")
          echo "will fund orbis node ($$d): $$a"
          addrs="$$addrs $$a"
        done
        n=0
        until out=$$(sourcehubd tx bank multi-send funder $$addrs 1000000000uopen \
              --keyring-backend test --home "$$H" --chain-id sourcehub-localnet \
              --node tcp://sourcehub:26657 --fees 2000uopen --yes -o json 2>&1) \
              && echo "$$out" | grep -q '"code":0'; do
          n=$$((n+1)); [ "$$n" -gt 60 ] && { echo "failed to fund orbis nodes: $$out"; exit 1; }
          echo "retry funding orbis nodes ($$n): $$out"; sleep 3
        done
        # Broadcast-sync returns before commit; wait until every node's
        # balance is actually queryable so "funding complete" means funded.
        for d in /n1 /n2 /n3; do
          a=$$(cat "$$d/public_key.txt")
          n=0
          until sourcehubd query bank balances "$$a" --node tcp://sourcehub:26657 -o json 2>/dev/null | grep -q uopen; do
            n=$$((n+1)); [ "$$n" -gt 60 ] && { echo "timeout waiting for $$a balance"; exit 1; }
            echo "waiting for $$a balance"; sleep 2
          done
        done
        echo "orbis funding complete"
        for h in node1 node2 node3; do
          n=0
          until bash -c "exec 3<>/dev/tcp/$$h/50051" 2>/dev/null; do
            n=$$((n+1)); [ "$$n" -gt 120 ] && { echo "timeout waiting for $$h gRPC"; exit 1; }
            echo "waiting for $$h gRPC"; sleep 3
          done
          echo "$$h gRPC ready"
        done
        echo "all orbis nodes ready"
    volumes:
      - orbis-node1-data:/n1:ro
      - orbis-node2-data:/n2:ro
      - orbis-node3-data:/n3:ro
    networks:
      - orbis-integration-network
    depends_on:
      sourcehub:
        condition: service_healthy

networks:
  orbis-integration-network:
    driver: bridge

volumes:
  sourcehub-data: {}
  orbis-node1-data: {}
  orbis-node2-data: {}
  orbis-node3-data: {}
