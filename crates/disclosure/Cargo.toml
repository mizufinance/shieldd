[package]
name = "shieldd-sdk-disclosure"
version = "2.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = []
proof = []
development-artifacts = []
prover = ["proof"]
orbis = ["dep:orbis-crypto", "dep:zeroize"]

[dependencies]
orbis-crypto = { package = "crypto", path = "../../third_party/orbis-crypto", default-features = false, features = ["decaf377"], optional = true }
zeroize = { version = "1", optional = true }
num-bigint = { workspace = true }
base64 = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand_core = { workspace = true }
decaf377 = { workspace = true }
decaf377-ka = { workspace = true }
decaf377-rdsa = { workspace = true }
shieldd-sdk-keys = { workspace = true }
shieldd-sdk-compliance = { workspace = true, default-features = false }
shieldd-sdk-asset = { workspace = true }
shieldd-sdk-shielded-pool = { workspace = true }
shieldd-sdk-transaction = { workspace = true, default-features = false }
shieldd-sdk-proto = { workspace = true }

poseidon377 = { workspace = true }

[dev-dependencies]
shieldd-sdk-compliance = { workspace = true, features = ["test-helpers"] }
ark-groth16 = { workspace = true }
ark-serialize = { workspace = true }
rand = { workspace = true }
shieldd-sdk-tct = { workspace = true }
shieldd-sdk-sct = { workspace = true, default-features = false }

[[example]]
name = "accepted_fixture"
required-features = ["prover", "development-artifacts"]
