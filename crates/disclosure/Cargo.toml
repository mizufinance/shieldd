[package]
name = "shieldd-sdk-disclosure"
version = "2.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = []
proof = []
prover = ["proof"]
orbis = ["dep:orbis-crypto", "dep:zeroize"]

[dependencies]
ark-ec-04 = { package = "ark-ec", version = "0.4" }
shieldd-sdk-crypto.workspace = true
shieldd-sdk-circuits.workspace = true
shieldd-sdk-proof-params.workspace = true
commonware-cryptography.workspace = true
commonware-parallel.workspace = true
ff.workspace = true
group.workspace = true
reddsa.workspace = true
orbis-crypto = { package = "crypto", path = "../../third_party/orbis-crypto", default-features = false, features = ["bls12-381"], optional = true }
zeroize = { version = "1", optional = true }
num-bigint = { workspace = true }
base64 = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand_core = { workspace = true }
shieldd-sdk-keys = { workspace = true }
shieldd-sdk-compliance = { workspace = true, default-features = false }
shieldd-sdk-asset = { workspace = true }
shieldd-sdk-shielded-pool = { workspace = true }
shieldd-sdk-transaction = { workspace = true, default-features = false }
shieldd-sdk-proto = { workspace = true }


[dev-dependencies]
commonware-codec.workspace = true
commonware-math.workspace = true
shieldd-sdk-compliance = { workspace = true, features = ["test-helpers"] }
rand = { workspace = true }
shieldd-sdk-tct = { workspace = true }
shieldd-sdk-sct = { workspace = true, default-features = false }

[[example]]
name = "accepted_fixture"
required-features = ["prover"]
