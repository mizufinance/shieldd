[package]
name = "shieldd-sdk-shielded-pool"
authors = {workspace = true}
repository = {workspace = true}
description = "Multi-asset shielded pool implementation for Shieldd"
version = {workspace = true}
license = {workspace = true}
edition = {workspace = true}

[features]
benchmark-helpers = ["prover", "component", "shieldd-sdk-compliance/test-helpers"]
component = [
    "cnidarium-component",
    "cnidarium",
    "shieldd-sdk-compliance/component",
    "shieldd-sdk-proto/cnidarium",
    "shieldd-sdk-sct/component",
]
default = ["std", "component"]
std = []
prover = []
parallel = ["shieldd-sdk-tct/parallel"]
docsrs = []

[dependencies]
shieldd-sdk-crypto.workspace = true
shieldd-sdk-circuits.workspace = true
commonware-cryptography.workspace = true
commonware-parallel.workspace = true
ff.workspace = true
group.workspace = true
reddsa.workspace = true
anyhow = {workspace = true}
async-stream = {workspace = true}
async-trait = {workspace = true}
base64 = {workspace = true}
blake2b_simd = {workspace = true}
bytes = {workspace = true}
chacha20poly1305 = {workspace = true}
cnidarium = {workspace = true, optional = true, default-features = true}
cnidarium-component = {workspace = true, optional = true, default-features = true}
futures = {workspace = true}
hex = {workspace = true}
imbl = {workspace = true}
jmt = {workspace = true}
metrics = {workspace = true}
once_cell = {workspace = true}
shieldd-sdk-asset = {workspace = true, default-features = false}
shieldd-sdk-compliance = {workspace = true, default-features = false}
shieldd-sdk-keys = {workspace = true, default-features = false}
shieldd-sdk-num = {workspace = true, default-features = false}
shieldd-sdk-proof-params = {workspace = true, default-features = false}
shieldd-sdk-proto = {workspace = true, default-features = false}
shieldd-sdk-sct = {workspace = true, default-features = false}
shieldd-sdk-tct = {workspace = true, default-features = true}
shieldd-sdk-txhash = {workspace = true, default-features = false}
prost = {workspace = true}
rand = {workspace = true}
rand_core = {workspace = true, features = ["getrandom"]}
regex = {workspace = true}
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
sha2 = {workspace = true}
tap = {workspace = true}
tendermint = {workspace = true}
thiserror = {workspace = true}
tracing = {workspace = true}

[dev-dependencies]
shieldd-sdk-shielded-pool = {path = ".", default-features = false, features = ["prover"]}
criterion = {workspace = true}
shieldd-sdk-compliance = {workspace = true, default-features = false, features = ["test-helpers"]}
shieldd-sdk-proof-params = {workspace = true, default-features = false}
proptest = {workspace = true}
tokio = {workspace = true, features = ["rt-multi-thread", "macros"]}

[[bench]]
name = "routing"
harness = false
