[toolchain]
rust = "1.89"
hax = "v0.3.7"
fstar = "v2026.05.24"
z3 = "4.14.1"
ocaml = "5.1.1"
opam_switch = "hax-0.3.7"

[policy]
primary_backend = "fstar"
go_correspondence_status = "differential-conformance-testing-only"

# Phase C3 — gadget-scope constraint-system proofs (ACL2/Axe). Heavy, nightly
# CI only. Proves a decomposed gadget's R1CS implies an ACL2 spec predicate;
# does not promote whole-circuit property rows. See
# docs/soundness/fv.md and the checked coverage gate.
[constraints]
acl2 = "8.7"
sbcl = "2.4.0"
# The landed C3 anchor (bool-select) certifies against the distribution
# community books shipped with ACL2 8.7, via the parallel `acl2p` image. The
# Poseidon2 feasibility spike additionally certifies Kestrel sparse-R1CS and
# Axe/R1CS books.
acl2_books = "distribution-8.7"
acl2_image = "acl2p"
prime_fields_book = "projects/bls12-377-curves/primes/bls12-377-prime"
fr_primality_cert = "Kestrel BLS12-377 scalar-field defprime"
r1cs_book = "kestrel/crypto/r1cs/sparse/r1cs"
axe_r1cs_book = "kestrel/axe/r1cs/top"
axe_books_rev = "distribution-8.7"
# M6 Lean scaffold plus the extracted BoolSelect source-level proof.
lean = "4.15.0"
lake = "5.0.0"
# Spike 4 (2026-06-06): version recon done. Extractor v3 pinned gnark v0.9.2;
# this repo runs gnark v0.14.0. The extractor is now vendored under
# tools/gnark/third_party/gnark-lean-extractor and ported only at the builder
# shim/export boundary needed for CircuitToLean. BoolSelect extraction is gated
# by scripts/circuit-gadget-proof-check.sh.
gnark_lean_extractor = "third_party/gnark-lean-extractor@663768cd712c3d71796a612859fd47c06665511d; local port to gnark v0.14.0"
proven_zk = "github.com/reilabs/proven-zk.git@5c483bde5177b560c9095e5babc05d3dbed6951e (branch 4.15)"
# R1CS prime field. MUST equal gnark's primitives.ScalarField() (BLS12-377 Fr);
# a mismatch makes every gadget proof vacuous. Asserted by the export bridge.
field = "bls12-377-fr"
field_modulus = "8444461749428370424248824938781546531375899335154063827935233455917409239041"

[constraints.policy]
scope = "decomposed-gadget-only"
whole_circuit_status = "requires whole-circuit artifact before any property row is proved"
picus_status = "under-constraint-evidence-only"
axe_status = "bool-select/iszero/poseidon2/nullifier semantic proofs; gadget-imt-gap now maps to the 5568-constraint AssetRegistryGap export and has a stamped ACL2/Axe output proof; whole-circuit property rows still require whole-circuit artifacts"
lean_status = "ProvenZK-backed extracted BoolSelect, IsZero, and Nullifier models build; BoolSelect/IsZero prove gate implications; whole-circuit Lean extraction pending"
