[toolchain]
rust = "1.89"
hax = "v0.3.7"
fstar = "v2026.05.24"
z3 = "4.14.1"
ocaml = "5.1.1"
opam_switch = "hax-0.3.7"

[policy]
primary_backend = "fstar"
go_correspondence_status = "differential-conformance-testing-only"

# Phase C3 — gadget-scope constraint-system proofs (ACL2/Axe). Heavy, nightly
# CI only. Proves a decomposed gadget's R1CS implies an ACL2 spec predicate;
# does not promote whole-circuit property rows. See
# docs/soundness/constraint-system-assurance.md and the C3 plan.
[constraints]
acl2 = "8.7"
sbcl = "2.4.0"
# The landed C3 anchor (bool-select) certifies against the distribution
# community books shipped with ACL2 8.7, via the parallel `acl2p` image. The
# Poseidon2 feasibility spike additionally certifies Kestrel sparse-R1CS and
# Axe/R1CS books.
acl2_books = "distribution-8.7"
acl2_image = "acl2p"
prime_fields_book = "projects/bls12-377-curves/primes/bls12-377-prime"
fr_primality_cert = "Kestrel BLS12-377 scalar-field defprime"
r1cs_book = "kestrel/crypto/r1cs/sparse/r1cs"
axe_r1cs_book = "kestrel/axe/r1cs/top"
axe_books_rev = "distribution-8.7"
# R1CS prime field. MUST equal gnark's primitives.ScalarField() (BLS12-377 Fr);
# a mismatch makes every gadget proof vacuous. Asserted by the export bridge.
field = "bls12-377-fr"
field_modulus = "8444461749428370424248824938781546531375899335154063827935233455917409239041"

[constraints.policy]
scope = "decomposed-gadget-only"
whole_circuit_status = "requires whole-circuit artifact before any property row is proved"
picus_status = "under-constraint-evidence-only"
axe_status = "bool-select semantic proof; poseidon2 lift smoke only"
