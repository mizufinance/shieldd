[package]
name = "shieldd-sdk-sct"
authors = {workspace = true}
repository = {workspace = true}
description = "SCT component implementation for Shieldd"
version = {workspace = true}
license = {workspace = true}
edition = {workspace = true}

[features]
component = [
    "cnidarium",
    "cnidarium-component",
    "shieldd-sdk-proto/cnidarium",
    "tokio",
    "dep:nomt",
    "dep:io-uring",
    "dep:ibc-types",
]
default = ["component"]
parallel = ["shieldd-sdk-tct/parallel", "dep:rayon"]

[dependencies]
nomt = { git = "https://github.com/thrumdev/nomt", rev = "c3c0e55794500262dfde7c83b6f7455d2aeb303e", default-features = false, features = ["sha2-hasher", "serde"], optional = true }
bitvec = "1"
nomt-core = { git = "https://github.com/thrumdev/nomt", rev = "c3c0e55794500262dfde7c83b6f7455d2aeb303e", default-features = false, features = ["sha2-hasher", "serde"] }
shieldd-sdk-circuits.workspace = true
shieldd-sdk-crypto.workspace = true
anyhow = {workspace = true}
async-trait = {workspace = true}
bincode = {workspace = true}
blake2b_simd = {workspace = true}
bytes = {workspace = true}
cnidarium = {workspace = true, optional = true, default-features = true}
cnidarium-component = {workspace = true, optional = true, default-features = true}
hex = {workspace = true}
futures = {workspace = true}
imbl = {workspace = true}
ibc-types = {workspace = true, optional = true}
metrics = {workspace = true}
once_cell = {workspace = true}
pbjson-types = {workspace = true}
shieldd-sdk-keys = {workspace = true, default-features = false}
shieldd-sdk-proto = {workspace = true, default-features = false}
shieldd-sdk-tct = {workspace = true, default-features = true}
shieldd-sdk-txhash = {workspace = true, default-features = false}
rand = {workspace = true}
rand_core = {workspace = true, features = ["getrandom"]}
rayon = { version = "1.10", optional = true }
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
sha2 = {workspace = true}
tendermint = {workspace = true}
tempfile = {workspace = true}
tokio = {workspace = true, optional = true, features = ["rt"]}
tracing = {workspace = true}
chrono = { workspace = true, default-features = false, features = ["serde", "now"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "=0.6.4", optional = true }

[dev-dependencies]
getrandom = {workspace = true}
tokio = {workspace = true, features = ["full"]}
