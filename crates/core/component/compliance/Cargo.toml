[package]
name = "shieldd-sdk-compliance"
authors = {workspace = true}
repository = {workspace = true}
description = "Compliance component implementation for Shieldd"
version = {workspace = true}
license = {workspace = true}
edition = {workspace = true}

[features]
component = [
    "cnidarium",
    "cnidarium-component",
    "shieldd-sdk-proto/cnidarium",
    "shieldd-sdk-sct/component",
    "dep:tokio",
]
default = ["component"]
scanner = ["dep:rusqlite", "dep:tokio", "tokio/sync", "tokio/time"]
sqlite-bundled = ["scanner", "rusqlite/bundled"]
test-helpers = []

[[example]]
name = "dev_orbis_registration"
required-features = ["test-helpers"]

[dependencies]
zeroize = "1.8"
shieldd-sdk-crypto.workspace = true
ff.workspace = true
group.workspace = true
reddsa.workspace = true
anyhow = {workspace = true}
base64 = {workspace = true}
async-trait = {workspace = true}
bincode = {workspace = true}
cnidarium = {workspace = true, optional = true, default-features = true}
cnidarium-component = {workspace = true, optional = true, default-features = true}
once_cell = {workspace = true}
shieldd-sdk-asset = {workspace = true, default-features = false}
shieldd-sdk-keys = {workspace = true, default-features = false}
shieldd-sdk-num = {workspace = true, default-features = false}
shieldd-sdk-proto = {workspace = true, default-features = false}
shieldd-sdk-sct = {workspace = true, default-features = false}
shieldd-sdk-tct = {workspace = true, default-features = false}
shieldd-sdk-txhash = {workspace = true, default-features = false}
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
sha2 = {workspace = true}
blake2b_simd = {workspace = true}
hex = {workspace = true}
futures = {workspace = true}
rand_core = {workspace = true}
rusqlite = {version = "0.32", optional = true}
tendermint = {workspace = true}
tokio = {workspace = true, optional = true}
tracing = {workspace = true}

[dev-dependencies]
commonware-cryptography.workspace = true
shieldd-sdk-circuits.workspace = true
shieldd-sdk-compliance = { path = ".", features = ["scanner"] }
shieldd-sdk-keys = {workspace = true, features = ["demo"]}
rand = {workspace = true}
serde_json = {workspace = true}
tempfile = {workspace = true}
tokio = {workspace = true, features = ["full"]}
