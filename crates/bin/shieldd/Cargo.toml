[package]
name = "shieldd"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
description = "Minimal Shieldd execution-client server"
repository = { workspace = true }
license = { workspace = true }
publish = false
rust-version = "1.75"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
cnidarium = { workspace = true, features = ["migration", "rpc"], default-features = true }
prost = { workspace = true }
shieldd-sdk-app = { workspace = true, features = ["parallel"], default-features = true }
shieldd-sdk-proto = { workspace = true, features = ["rpc"], default-features = true }
shieldd-sdk-sct = { workspace = true, default-features = true }
shieldd-sdk-shielded-pool = { workspace = true, default-features = false }
tendermint = { workspace = true }
tendermint-proto = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "ansi"] }

# Rust-side global allocator. With the baked `dirty_decay_ms:0` config (see lib.rs),
# freed pages are returned to the OS promptly instead of being held in per-thread
# arenas, which shrinks the RSS high-water from transient per-block allocation
# bursts. Only covers Rust allocations (not RocksDB's C++ or the gnark Go runtime).
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[dev-dependencies]
decaf377 = { workspace = true, default-features = true }
shieldd-sdk-keys = { workspace = true, default-features = false }
tempfile = { workspace = true }
