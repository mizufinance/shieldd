[package]
name = "pcli"
version = {workspace = true}
authors = {workspace = true}
edition = {workspace = true}
description = "Offline wallet, key, grant, and custody tooling"
repository = {workspace = true}
license = {workspace = true}
publish = false

[features]
default = ["demo", "disclosure"]
disclosure = ["dep:shieldd-sdk-disclosure", "dep:shieldd-sdk-view", "dep:tonic", "dep:tempfile", "dep:libc"]
disclosure-prover = ["disclosure", "shieldd-sdk-disclosure/prover"]
demo = ["shieldd-sdk-keys/demo"]
orbis = ["disclosure", "shieldd-sdk-disclosure/orbis", "dep:shieldd-orbis-client", "dep:orbis-authn", "dep:orbis-common", "dep:orbis-crypto"]

[dependencies]
shieldd-sdk-proof-params.workspace = true
ark-std-04 = { package = "ark-std", version = "0.4" }
ark-ec-04 = { package = "ark-ec", version = "0.4" }
shieldd-orbis-client = { workspace = true, optional = true }
orbis-authn = { package = "authn", git = "https://github.com/sourcenetwork/orbis-rs", rev = "0a0f935a85cc60e87561a9c7364fa80fdb3332df", optional = true }
orbis-common = { package = "common", git = "https://github.com/sourcenetwork/orbis-rs", rev = "0a0f935a85cc60e87561a9c7364fa80fdb3332df", optional = true }
orbis-crypto = { package = "crypto", path = "../../../third_party/orbis-crypto", default-features = false, features = ["bls12-381"], optional = true }

zeroize = "1"
shieldd-sdk-disclosure = { workspace = true, features = ["proof"], optional = true }
shieldd-sdk-view = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }
async-trait = {workspace = true}
anyhow = {workspace = true}
base64 = {workspace = true}
bytes = {workspace = true}
camino = {workspace = true}
clap = {workspace = true, features = ["derive", "env"]}
shieldd-sdk-crypto.workspace = true
ff.workspace = true
group.workspace = true
reddsa.workspace = true
time = "0.3"
directories = {workspace = true}
hex = {workspace = true}
shieldd-sdk-asset = {workspace = true, default-features = false}
shieldd-sdk-compliance = {workspace = true, default-features = false}
shieldd-sdk-custody = {workspace = true}
shieldd-sdk-keys = {workspace = true, default-features = false}
shieldd-sdk-proto = {workspace = true, default-features = true}
shieldd-sdk-transaction = {workspace = true, default-features = false}
rand = {workspace = true}
rand_core = {workspace = true, features = ["getrandom"]}
rpassword = {workspace = true}
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
serde_with = {workspace = true, features = ["hex"]}
tokio = {workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util", "signal", "time"]}
toml = {workspace = true, features = ["preserve_order"]}
termion = {workspace = true}
tracing = {workspace = true}
tracing-subscriber = {workspace = true, features = ["env-filter", "ansi"]}

[dev-dependencies]
assert_cmd = {workspace = true}
predicates = "2.1"
