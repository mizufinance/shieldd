[package]
name = "shieldd-sdk-measure"
authors = {workspace = true}
repository = {workspace = true}
description = "A benchmark tool for Shieldd RPCs"
version = {workspace = true}
license = {workspace = true}
edition = {workspace = true}
publish = false

[package.metadata.dist]
dist = false

[[bin]]
name = "measure"
path = "src/main.rs"

[features]
integration-testnet = []

[dependencies]
anyhow = {workspace = true}
bytesize = "1.2"
clap = {workspace = true, features = ["derive", "env"]}
indicatif = {workspace = true}
shieldd-sdk-compact-block = {workspace = true, default-features = false}
shieldd-sdk-proto = {workspace = true, features = ["rpc"], default-features = true}
shieldd-sdk-view = {workspace = true}
rustls = {workspace = true}
serde_json = {workspace = true}
tokio = {workspace = true, features = ["full"]}
tonic = {workspace = true, features = ["tls"]}
tracing = {workspace = true}
tracing-subscriber = {workspace = true, features = ["env-filter"]}
url = {workspace = true}

[dev-dependencies]
assert_cmd = {workspace = true}
predicates = "2.1"
