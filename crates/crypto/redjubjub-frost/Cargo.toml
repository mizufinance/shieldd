[package]
name = "redjubjub-frost"
authors = {workspace = true}
repository = {workspace = true}
description = "Shieldd wire adapters for upstream RedJubjub FROST"
version = {workspace = true}
license = {workspace = true}
edition = {workspace = true}

[dependencies]
anyhow = {workspace = true}
shieldd-sdk-crypto.workspace = true
reddsa = { workspace = true, features = ["frost"] }
frost-core = "=3.0.0"
frost-rerandomized = "=3.0.0"
rand_core = {workspace = true, features = ["getrandom"]}
shieldd-sdk-proto = {workspace = true, default-features = true}

[dev-dependencies]
ff.workspace = true
