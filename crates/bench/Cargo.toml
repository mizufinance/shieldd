[package]
name = "shieldd-sdk-bench"
authors = {workspace = true}
repository = {workspace = true}
description = "Benchmarks for Shieldd crates"
version = {workspace = true}
license = {workspace = true}
edition = {workspace = true}
publish = false

[[bench]]
name = "jubjub"
path = "benches/vanilla/jubjub.rs"
harness = false

[[bench]]
name = "nullifier_storage"
path = "benches/state/nullifier_storage.rs"
harness = false


[dependencies]
shieldd-sdk-crypto = { workspace = true }
ff = { workspace = true }
group = { workspace = true }
anyhow = {workspace = true}
bytes = {workspace = true}
clap = {workspace = true, features = ["derive"]}
shieldd-sdk-bench-support = { path = "../bench-support" }
cnidarium = {workspace = true, features = ["migration"], default-features = true}
shieldd-sdk-app = {workspace = true, features = ["benchmark-helpers"], default-features = true}
shieldd-sdk-proof-params = { workspace = true, default-features = true }
shieldd-sdk-sct = {workspace = true, default-features = true}
shieldd-sdk-transaction = {workspace = true, default-features = true}
rand = {workspace = true}
rand_core = {workspace = true, features = ["getrandom"]}
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
tokio = {workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"]}

[dev-dependencies]
anyhow = {workspace = true}
criterion = {workspace = true, features = ["html_reports"]}
rand_chacha = {workspace = true}
tempfile = {workspace = true}
