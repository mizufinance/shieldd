[package]
name = "shieldd-orbis-client"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
publish = false

[dependencies]
ark-ec-04 = { package = "ark-ec", version = "0.4" }
orbis-crypto = { package = "crypto", path = "../../../third_party/orbis-crypto", default-features = false, features = ["bls12-381"] }
anyhow = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
cosmrs = "0.22"
orbis-prost = { package = "prost", version = "0.14.1" }

orbis-authn = { package = "authn", git = "https://github.com/sourcenetwork/orbis-rs", rev = "0a0f935a85cc60e87561a9c7364fa80fdb3332df" }
orbis-common = { package = "common", git = "https://github.com/sourcenetwork/orbis-rs", rev = "0a0f935a85cc60e87561a9c7364fa80fdb3332df" }
orbis-proto = { package = "proto", git = "https://github.com/sourcenetwork/orbis-rs", rev = "0a0f935a85cc60e87561a9c7364fa80fdb3332df" }
orbis-tonic = { package = "tonic", version = "0.14.5", features = ["transport"] }
