[workspace]

resolver = "2"

exclude = [
  "third_party/commonware",
  "third_party/orbis-crypto",
  "tools/proto-compiler",
  "third_party/h2-0.3.27",
]

# Also remember to add to deployments/scripts/rust-docs
members = [
  "crates/crypto/primitives",
  "crates/crypto/circuits",
  "crates/disclosure",
  "crates/bench-support",
  "crates/bench",
  "crates/bin/orbis-integration",
  "crates/bin/bankd-e2e-host-withdrawal-builder",
  "crates/bin/bankd-e2e-spend-builder",
  "crates/bin/pcli",
  "crates/bin/shieldd",
  "crates/cnidarium-component",
  "crates/core/app",
  "crates/core/app-tests",
  "crates/core/asset",
  "crates/core/component/compact-block",
  "crates/core/component/compliance",
  "crates/core/component/fee",
  "crates/core/component/sct",
  "crates/core/component/shielded-pool",
  "crates/core/keys",
  "crates/core/num",
  "crates/core/transaction",
  "crates/core/txhash",
  "crates/crypto/redjubjub-frost",
  "crates/crypto/proof-params",
  "crates/crypto/tct",
  "crates/custody",
  "crates/proto",
  "crates/test/mock-client",
  "crates/test/tct-property-test",
  "crates/test/tracing-subscriber",
  "crates/util/orbis-client",
  "crates/view",
  ]

[profile.android-prof]
inherits = "release"
debug = 1
strip = "none"

[profile.ci]
inherits = "release"
# Optimized tests with debug assertions.
debug-assertions = true
codegen-units = 16

[workspace.package]
authors    = ["Shieldd Labs <team@shielddlabs.xyz"]
edition    = "2021"
version    = "2.1.0"
repository = "https://github.com/mizufinance/shieldd"
license    = "MIT OR Apache-2.0"

[workspace.dependencies]
shieldd-sdk-crypto = { path = "crates/crypto/primitives" }
shieldd-sdk-circuits = { path = "crates/crypto/circuits" }
commonware-cryptography = { path = "third_party/commonware/cryptography", default-features = false, features = ["std", "bls12381"] }
commonware-math = { path = "third_party/commonware/math" }
commonware-codec = { path = "third_party/commonware/codec" }
commonware-parallel = { path = "third_party/commonware/parallel" }
jubjub = "=0.10.0"
reddsa = { version = "=0.5.2", features = ["frost"] }
ff = "0.13"
group = "0.13"
rand10 = { package = "rand", version = "=0.10.2" }
shieldd-sdk-disclosure = { path = "crates/disclosure", default-features = false }
anyhow                           = { version = "1.0.75" }
assert_cmd                       = { version = "2.0" }
async-stream                     = { version = "0.3.5" }
async-trait                      = { version = "0.1.52" }
axum                             = { version = "0.7.9" }
axum-extra                       = { version = "0.9.6" }
axum-server                      = { version = "0.7.1" }
base64                           = { version = "0.21.2" }
bech32                           = { version = "0.8.1" }
bincode                          = { version = "1.3.3" }
blake2b_simd                     = { version = "1" }
bytes                            = { version = "1.2" }
camino                           = { version = "1" }
chacha20poly1305                 = { version = "0.9.0" }
chrono                           = { default-features = false, version = "0.4" }
clap                             = { version = "3.2" }
cnidarium                        = { version = "0.83", default-features = false}
cnidarium-component              = { default-features = false, version = "2.1.0", path = "crates/cnidarium-component" }
criterion                        = { version = "0.4" }
derivative                       = { version = "2.2" }
directories                      = { version = "4.0.1" }
ed25519-consensus                = { version = "2.1" }
futures                          = { version = "0.3.28" }
hex                              = { version = "0.4.3" }
http                             = { version = "1.2.0" }
ibc-proto                        = { default-features = false, version = "0.51.1" }
ibc-types                        = { default-features = false, version = "0.15.1" }
ics23                            = { version = "0.12.0" }
imbl                             = { version = "7.0.2" }
jmt                              = { version = "0.11", features = ["migration"] }
libloading                       = { version = "0.8" }
metrics                          = { version = "0.24.2" }
num-bigint                       = { version = "0.4" }
num-traits                       = { default-features = false, version = "0.2.15" }
once_cell                        = { version = "1.8" }
parking_lot                      = { version = "0.12.1" }
pbjson                           = { version = "0.7.0" }
pbjson-types                     = { version = "0.7.0" }
shieldd-sdk-app                     = { default-features = false, version = "2.1.0", path = "crates/core/app" }
shieldd-sdk-asset                   = { default-features = false, version = "2.1.0", path = "crates/core/asset" }
shieldd-sdk-compact-block           = { default-features = false, version = "2.1.0", path = "crates/core/component/compact-block" }
shieldd-sdk-custody                 = { version = "2.1.0", path = "crates/custody" }
shieldd-sdk-fee                     = { default-features = false, version = "2.1.0", path = "crates/core/component/fee" }
shieldd-sdk-keys                    = { default-features = false, version = "2.1.0", path = "crates/core/keys" }
shieldd-sdk-mock-client             = { version = "2.1.0", path = "crates/test/mock-client" }
shieldd-sdk-num                     = { default-features = false, version = "2.1.0", path = "crates/core/num" }
shieldd-sdk-proof-params            = { default-features = false, version = "2.1.0", path = "crates/crypto/proof-params" }
shieldd-sdk-proto                   = { default-features = false, version = "2.1.0", path = "crates/proto" }
shieldd-sdk-sct                     = { default-features = false, version = "2.1.0", path = "crates/core/component/sct" }
shieldd-sdk-compliance              = { default-features = false, version = "2.1.0", path = "crates/core/component/compliance" }
shieldd-sdk-shielded-pool           = { default-features = false, version = "2.1.0", path = "crates/core/component/shielded-pool" }
shieldd-sdk-tct                     = { default-features = false, version = "2.1.0", path = "crates/crypto/tct" }
shieldd-sdk-test-subscriber         = { version = "2.1.0", path = "crates/test/tracing-subscriber" }
shieldd-sdk-transaction             = { default-features = false, version = "2.1.0", path = "crates/core/transaction" }
shieldd-sdk-txhash                  = { default-features = false, version = "2.1.0", path = "crates/core/txhash" }
shieldd-sdk-view                    = { version = "2.1.0", path = "crates/view" }
shieldd-orbis-client                = { version = "2.1.0", path = "crates/util/orbis-client" }
pin-project                      = { version = "1.0.12" }
pin-project-lite                 = { version = "0.2.9" }
proptest                         = { version = "1.6" }
proptest-derive                  = { version = "0.5.1" }
prost                            = { version = "0.13.4" }
r2d2                             = { version = "0.8" }
r2d2_sqlite                      = { version = "0.25" }
rand                             = { version = "0.8.5" }
rand_chacha                      = { version = "0.3.1" }
rand_core                        = { version = "0.6.4" }
regex                            = { version = "1.8.1" }
reqwest                          = { version = "0.12.9", features = ["json", "stream"] }
rpassword                        = { version = "7" }
serde                            = { version = "1.0.219" }
serde_json                       = { version = "1.0.96" }
serde_with                       = { version = "3.5.1" }
sha2                             = { version = "0.10" }
tap                              = "1.0.1"
tempfile                         = { version = "3.3.0" }
tendermint                       = { default-features = false, version = "0.40.3" }
tendermint-light-client-verifier = { version = "0.40.3" }
tendermint-proto                 = { version = "0.40.3" }
tendermint-rpc                   = { version = "0.40.3" }
termion                          = { version = "3" }
thiserror                        = { version = "1.0" }
time                             = { version = "0.3" }
tokio                            = { version = "1.39.0" }
tokio-stream                     = { version = "0.1.8" }
tokio-util                       = { version = "0.7" }
toml                             = { version = "0.7" }
tonic                            = { version = "0.12.3" }
tower-http                       = { version = "0.6.2" }
tower-service                    = { version = "0.3.2" }
tracing                          = { version = "0.1" }
tracing-subscriber               = { version = "0.3.20", features = ["env-filter"] }
getrandom                        = { version = "0.2", default-features = false }

[patch.crates-io]
cnidarium = { path = "third_party/cnidarium-0.83.0" }
# Tendermint RPC and Orbis still require reqwest 0.11, whose h2 0.3 line has
# no upstream release for RUSTSEC-2026-0258. This carries the upstream fix;
# remove it once those clients migrate to reqwest 0.12.
h2 = { path = "third_party/h2-0.3.27" }
