syntax = "proto3";
package shieldd.storage.v1;
service QueryService {
  rpc KeyValue(KeyValueRequest) returns (KeyValueResponse);
  rpc ArchiveRange(ArchiveRangeRequest) returns (ArchiveRangeResponse);
}
message KeyValueRequest {
  string key = 1;
  bool proof = 2;
}
message KeyValueResponse {
  message Value { bytes value = 1; }
  Value value = 1;
  // Canonical NOMT participant proof, manifest and checked value commitment.
  // Verify against the commitment authenticated by the SDK Shieldd module.
  bytes proof = 2;
}

// A full-key, inclusive-start/exclusive-end page within one retained block
// prefix. The proof verifies membership, ordering and pagination completeness.
message ArchiveRangeRequest {
 uint64 height = 1;
 bytes prefix = 2;
 bytes start = 3;
 optional bytes end = 4;
 uint32 limit = 5;
}
message ArchiveRangeResponse {
 // Rust-owned canonical range proof; includes full records and next-page key.
 bytes proof = 1;
}
