syntax = "proto3";
package shieldd.core.component.compact_block.v1;

import "shieldd/core/component/compliance/v1/compliance.proto";
import "shieldd/core/component/fee/v1/fee.proto";
import "shieldd/core/component/sct/v1/sct.proto";
import "shieldd/core/component/shielded_pool/v1/shielded_pool.proto";
import "shieldd/core/txhash/v1/txhash.proto";
import "shieldd/crypto/tct/v1/tct.proto";

// Contains the minimum data needed to update client state.
message CompactBlock {
  reserved 6;
  uint64 height = 1;
  // State payloads describing new state fragments.
  repeated StatePayload state_payloads = 2;
  // Nullifiers identifying spent notes.
  repeated sct.v1.Nullifier nullifiers = 3;
  // The block root of this block.
  crypto.tct.v1.MerkleRoot block_root = 4;
  // The epoch root of this epoch (only present when the block is the last in an epoch).
  crypto.tct.v1.MerkleRoot epoch_root = 5;
  // Latest note-discovery parameters. Absent when unchanged.
  shielded_pool.v1.DiscoveryParameters discovery_parameters = 7;
  // Fixed-shape action-level routing records emitted by transactions in this block.
  repeated RoutingRecord routing_records = 8;
  // Indicates updated app parameters.
  bool app_parameters_updated = 9;
  // Updated gas prices, if they have changed.
  fee.v1.GasPrices gas_prices = 10;
  // The epoch index
  uint64 epoch_index = 11;
  // Compliance user tree anchor (root) for this block.
  bytes compliance_user_anchor = 12;
  // Compliance asset tree anchor (root) for this block.
  bytes compliance_asset_anchor = 13;
  // User registrations in this block (for client sync).
  repeated compliance.v1.EventUserRegistered compliance_user_registrations = 14;
  repeated compliance.v1.EventUserAssetStatusChanged compliance_user_status_changes = 18;
  // Asset registrations in this block (for client sync).
  repeated compliance.v1.EventAssetRegistered compliance_asset_registrations = 15;
  // Actions reference canonical payload positions instead of repeating ciphertexts.
  repeated RoutingAction routing_actions = 16;
  // Exact nullifier-generation window, emitted at genesis and app-epoch boundaries.
  sct.v1.NullifierWindow nullifier_window = 17;
  uint64 state_payload_start_position = 19;
}

// An encrypted payload, corresponding to a single commitment in the state commitment tree.
message StatePayload {
  message RolledUp {
    crypto.tct.v1.StateCommitment commitment = 1;
  }
  message Note {
    shielded_pool.v1.NotePayload note = 2;
  }
  message VolumeAccumulator {
    shielded_pool.v1.VolumeAccumulatorPayload payload = 1;
  }
  // The source of the payload, if known.
  sct.v1.CommitmentSource source = 1;
  // The state payload itself.
  oneof state_payload {
    RolledUp rolled_up = 2;
    Note note = 3;
    VolumeAccumulator volume_accumulator = 4;
  }
}

// Query operations for the compact block component.
service QueryService {
  rpc FilteredBlockPage(FilteredBlockPageRequest) returns (CompactBlockPageResponse);
  rpc CompactBlockPage(CompactBlockPageRequest) returns (CompactBlockPageResponse);
}

// One public tag attached to an action. Slot roles are deliberately absent.
message RoutingRecord {
  shielded_pool.v1.RoutingTag tag = 1;
  uint64 height = 2;
  core.txhash.v1.TransactionId transaction_id = 3;
  uint32 action_index = 4;
  uint32 tag_slot = 5;
}

// SCT positions associated with one public action position.
message RoutingAction {
  core.txhash.v1.TransactionId transaction_id = 1;
  uint32 action_index = 2;
  repeated uint64 payload_positions = 3;
}

// Node-local metadata. Payloads are stored separately by canonical position.
message StoredCompactBlock {
  CompactBlock metadata = 1;
  repeated StoredSection sections = 2;
}

// Fixed sections preserve each repeated field's canonical order.
enum CompactRecordKind {
  COMPACT_RECORD_KIND_HEADER = 0;
  COMPACT_RECORD_KIND_PAYLOAD = 1;
  COMPACT_RECORD_KIND_NULLIFIER = 2;
  COMPACT_RECORD_KIND_ROUTING_RECORD = 3;
  COMPACT_RECORD_KIND_ROUTING_ACTION = 4;
  COMPACT_RECORD_KIND_USER_REGISTRATION = 5;
  COMPACT_RECORD_KIND_USER_STATUS = 6;
  COMPACT_RECORD_KIND_ASSET_REGISTRATION = 7;
  COMPACT_RECORD_KIND_PROVEN_PAYLOAD = 8;
}
message StoredSection {
  CompactRecordKind kind = 1;
  uint32 count = 2;
}
message CompactBlockPageRequest {
  uint64 height = 1;
  bytes cursor = 2;
}
message CompactRecordFragment {
  CompactRecordKind kind = 1;
  uint32 index = 2;
  uint32 offset = 3;
  uint32 total_length = 4;
  bytes data = 5;
}
message CompactBlockPageResponse {
  uint64 height = 1;
  string chain_id = 2;
  bytes block_identity = 3;
  repeated CompactRecordFragment fragments = 4;
  bytes next_cursor = 5;
}

// Opt-in trusted-provider query. Selectors reveal wallet routing interests.
message FilteredBlockPageRequest {
  uint64 height = 1;
  repeated shielded_pool.v1.RoutingSelector selectors = 2;
  bytes cursor = 3;
}
message ProvenPayload {
  uint64 position = 1;
  StatePayload payload = 2;
  repeated crypto.tct.v1.MerklePathChunk auth_path = 3; // eight, leaf to root
  txhash.v1.TransactionId transaction_id = 4;
}
// Local positional index entry for payloads with no routing tag.
message UnroutedPayload {
  uint64 position = 1;
  txhash.v1.TransactionId transaction_id = 2;
}
