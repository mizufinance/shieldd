[package]
name = "shieldd-prepared-points381-screen"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[dependencies]
commonware-cryptography = { path = "../../cache/commonware-parallel-ntt/cryptography", features = ["std", "bls12381"] }
commonware-codec = { path = "../../cache/commonware-parallel-ntt/codec" }
commonware-math = { path = "../../cache/commonware-parallel-ntt/math" }
commonware-parallel = { path = "../../cache/commonware-parallel-ntt/parallel" }
blst = "=0.3.17"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
debug = 0
