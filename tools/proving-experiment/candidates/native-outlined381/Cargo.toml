[package]
name = "shieldd-native-outlined381-experiment"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[features]
cost_trace = []
allocation_trace = []

[dependencies]
blst = "=0.3.17"
commonware-cryptography = { path = "../../cache/commonware-outlined381/cryptography", features = ["std", "bls12381"] }
commonware-math = { path = "../../cache/commonware-outlined381/math" }
commonware-codec = { path = "../../cache/commonware-outlined381/codec" }
commonware-parallel = { path = "../../cache/commonware-outlined381/parallel" }
rand = "=0.10.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"

[dev-dependencies]
ark-bls12-381 = "=0.6.0"
ark-ed-on-bls12-381 = "=0.6.0"
ark-ff = "=0.6.0"
ark-ec = "=0.6.0"
ark-crypto-primitives = { version = "=0.6.0", features = ["sponge"] }

[profile.release]
debug = 0

[lib]
name = "shieldd_native_prepared_key381_experiment"
path = "../native-prepared-key381/src/lib.rs"

[[example]]
name = "outlined_worker"
path = "../native-prepared-key381/examples/prepared_msm_full.rs"
