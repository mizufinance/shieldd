[package]
name = "shieldd-domain-subset-cost"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
anyhow = "1"
ark-bls12-377 = "=0.6.0"
ark-bls12-381 = "=0.6.0"
ark-ff = { version = "=0.6.0", features = ["parallel"] }
