[package]
name = "zkpari"
version = "0.1.0"
description = "An implementation of the ZK-Pari SNARK"
categories = ["cryptography"]
license = "MIT/Apache-2.0"
edition = "2021"

################################# Dependencies ################################

[dependencies]
ark-std = { version = "0.6.0", default-features = false }
ark-serialize = { version = "0.6.0", default-features = false, features = ["derive"] }
ark-ff = { version = "0.6.0", default-features = false }
ark-ec = { version = "0.6.0", default-features = false }
ark-poly = { version = "0.6.0", default-features = false }
ark-relations = { version = "0.6.0", default-features = false }
merlin = { version = "3.0.0", default-features = false }
rayon = { version = "1.5.2" }

# The payment circuits (feature "circuits")
ark-bls12-381 = { version = "0.6.0", default-features = false, features = ["curve"], optional = true }
ark-crypto-primitives = { version = "0.6", features = ["sponge", "constraints"], optional = true }
ark-ed-on-bls12-381 = { version = "0.6.0", features = ["r1cs"], optional = true }
ark-r1cs-std = { version = "0.6", optional = true }

[dev-dependencies]
# Enables the payment-circuit feature for tests and benches without imposing
# it on library consumers (cargo unifies the self-dependency's features into
# every dev target's build of the lib).
zkpari = { path = ".", features = ["circuits"] }
# Curve for tests and benchmarks
ark-bls12-381 = { version = "0.6.0", default-features = false, features = ["curve"] }

[[bench]]
name = "batch_verify"
path = "benches/batch_verify.rs"
harness = false

[[bench]]
name = "prover"
path = "benches/prover.rs"
harness = false

[[bench]]
name = "circuits"
path = "benches/circuits.rs"
harness = false

[[bench]]
name = "throughput"
path = "benches/throughput.rs"
harness = false

[features]
default = ["std", "parallel"]
std = ["ark-ff/std", "ark-poly/std", "ark-relations/std", "ark-std/std", "ark-serialize/std"]
circuits = [
    "std",
    "dep:ark-bls12-381",
    "dep:ark-crypto-primitives",
    "dep:ark-ed-on-bls12-381",
    "dep:ark-r1cs-std",
]
print-trace = ["ark-std/print-trace"]
parallel = [
    "std",
    "ark-ff/parallel",
    "ark-ec/parallel",
    "ark-poly/parallel",
    "ark-std/parallel",
]
